<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'PingFang SC','Microsoft YaHei',sans-serif}
.cover{width:1080px;height:1920px;position:relative;background:linear-gradient(160deg,#050816 0%,#0a0e27 30%,#0d1a3a 70%,#0a1628 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;padding:180px 80px 220px 80px}

/* Layer 1: 日期 */
.date{font-size:36px;opacity:0.6;letter-spacing:4px;z-index:5;margin-bottom:16px}

/* Layer 2: 场景标签 */
.scene-label{font-size:28px;text-transform:uppercase;letter-spacing:6px;color:#00d4aa;z-index:5;margin-bottom:32px}

/* Layer 3: 胶囊徽章 */
.badge{display:inline-block;background:rgba(0,212,170,0.15);border:1px solid rgba(0,212,170,0.4);padding:10px 28px;border-radius:50px;font-size:26px;font-weight:600;color:#00d4aa;z-index:5;margin-bottom:40px}

/* Layer 4: 主标题 */
.main-title{font-size:96px;font-weight:900;text-align:center;line-height:1.2;z-index:5;letter-spacing:-2px}
.main-title .accent{background:linear-gradient(135deg,#00d4aa,#0088ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* Layer 5: 渐变分隔线 */
.divider{width:400px;height:3px;background:linear-gradient(90deg,transparent,#00d4aa,transparent);z-index:5;margin:40px 0}

/* Layer 6: 数据说明 */
.data-subtitle{font-size:36px;font-weight:600;text-align:center;z-index:5;opacity:0.7;margin-bottom:32px}

/* Layer 7: 数据卡片 */
.cards{display:flex;gap:24px;z-index:5}
.card{text-align:center;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:24px 32px;border-radius:12px}
.card .val{font-size:56px;font-weight:900;color:#00d4aa}
.card .lbl{font-size:22px;opacity:0.5;margin-top:6px}

/* Background texture */
.bg-grid{position:absolute;top:0;left:0;width:100%;height:100%;background-image:linear-gradient(rgba(0,212,170,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,170,0.05) 1px,transparent 1px);background-size:60px 60px;z-index:0}
.orb1{position:absolute;top:-100px;left:-100px;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,170,0.12),transparent 70%);filter:blur(60px);z-index:1}
.orb2{position:absolute;bottom:-150px;right:-100px;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(0,100,255,0.10),transparent 70%);filter:blur(60px);z-index:1}

.bottom-info{position:absolute;bottom:80px;font-size:24px;opacity:0.3;z-index:5}
</style>
</head>
<body>
<div data-composition-id="root" data-width="1080" data-height="1920" data-start="0" style="position:relative;width:1080px;height:1920px;overflow:hidden">
<div class="cover">
  <div class="bg-grid"></div>
  <div class="orb1"></div>
  <div class="orb2"></div>

  <div class="date">2026年5月</div>
  <div class="scene-label">VIBECODING 大赏</div>
  <div class="badge">AI 驱动短视频管线</div>

  <div class="main-title">
    VibeCoding大赏<br>
    <span class="accent">AI管线锻造短视频</span>
  </div>

  <div class="divider"></div>

  <div class="data-subtitle">ClipForge 深度剖析</div>

  <div class="cards">
    <div class="card"><div class="val">8天</div><div class="lbl">开发周期</div></div>
    <div class="card"><div class="val">2万+</div><div class="lbl">行代码</div></div>
    <div class="card"><div class="val">32</div><div class="lbl">视觉组件</div></div>
    <div class="card"><div class="val">22+</div><div class="lbl">门禁检查</div></div>
  </div>

  <div class="bottom-info">本视频由 ClipForge 自己制作</div>
</div>
<script>window.__hf = { duration: 1, seek: function(t) {} };window.__timelines = {};</script>
</div><!-- end root composition -->
</body>
</html>
