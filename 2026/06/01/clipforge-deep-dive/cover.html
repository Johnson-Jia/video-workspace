<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>cover</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      position: relative;
      background: #000;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #fff;
    }
    .composition {
      position: relative;
      width: 1920px;
      height: 1080px;
    }
    .cover {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px 120px 60px 120px;
      background: radial-gradient(ellipse at 40% 40%, #0a1628, #060612);
    }
    .glow-1 {
      position: absolute;
      width: 500px; height: 500px;
      background: rgba(0,229,255,0.12);
      border-radius: 50%;
      filter: blur(60px);
      top: 15%; left: 15%;
    }
    .glow-2 {
      position: absolute;
      width: 400px; height: 400px;
      background: rgba(249,168,37,0.10);
      border-radius: 50%;
      filter: blur(60px);
      bottom: 10%; right: 15%;
    }
    .grid {
      position: absolute;
      inset: 0;
      background: repeating-radial-gradient(circle at 50% 50%, transparent 0px, transparent 80px, rgba(0,229,255,0.025) 81px, transparent 82px);
    }
    .content { position: relative; z-index: 2; text-align: center; }
    .badge {
      display: inline-block;
      background: rgba(0,229,255,0.15);
      color: #00e5ff;
      border-radius: 24px;
      padding: 8px 24px;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .title {
      font-size: 96px;
      font-weight: 900;
      line-height: 1.15;
      background: linear-gradient(90deg, #00e5ff, #f9a825);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      font-size: 40px;
      color: #b0b0cc;
      margin-top: 20px;
      font-weight: 400;
    }
    .tags {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 28px;
    }
    .tag {
      display: inline-block;
      background: rgba(249,168,37,0.12);
      color: #f9a825;
      border-radius: 20px;
      padding: 6px 18px;
      font-size: 24px;
    }
  </style>
</head>
<body>
  <div class="composition" data-composition-id="cover" data-width="1920" data-height="1080" data-start="0" data-duration="3">
    <div class="cover">
      <div class="glow-1"></div>
      <div class="glow-2"></div>
      <div class="grid"></div>
      <div class="content">
        <div class="badge">开源项目</div>
        <h1 class="title">AI 视频锻造炉</h1>
        <p class="subtitle">一行文字到成片的自动化奇迹</p>
        <div class="tags">
          <span class="tag">9 阶段管线</span>
          <span class="tag">30+ 规则</span>
          <span class="tag">3-5 分钟长视频</span>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    window.__timelines = {};
    const tl = gsap.timeline({paused: true});
    window.__timelines["cover"] = tl;
    window.__hf = { duration: 3, seek: function(t) { tl.time(t, false); } };
  </script>
</body>
</html>
