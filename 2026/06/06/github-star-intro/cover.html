<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #030810; overflow: hidden; font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif; }

.cover {
  position: relative; width: 2160px; height: 3840px;
  background: #030810;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  overflow: hidden;
}

/* V3 atmospheric blobs — depth behind the star field */
.blob-warm {
  position: absolute;
  width: 1800px; height: 1800px; border-radius: 50%;
  background: radial-gradient(ellipse at 30% 40%, rgba(255,184,0,0.14) 0%, rgba(255,140,0,0.04) 45%, transparent 70%);
  top: 10%; left: -22%;
  filter: blur(120px);
}

.blob-cool {
  position: absolute;
  width: 1600px; height: 1600px; border-radius: 50%;
  background: radial-gradient(ellipse at 60% 55%, rgba(100,255,218,0.10) 0%, rgba(80,200,180,0.02) 45%, transparent 70%);
  bottom: 10%; right: -18%;
  filter: blur(110px);
}

/* V2 dot grid */
.star-grid {
  position: absolute; inset: 0;
  background-image: radial-gradient(circle 2px, rgba(255,255,255,0.07) 100%, transparent 100%);
  background-size: 80px 80px;
  background-position: 40px 40px;
}

/* Bright white stars */
.star-b {
  position: absolute; width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255,255,255,0.7);
  box-shadow: 0 0 10px rgba(255,255,255,0.3);
}

/* Amber stars */
.star-a {
  position: absolute; width: 10px; height: 10px; border-radius: 50%;
  background: #FFB800;
  box-shadow: 0 0 20px rgba(255,184,0,0.6), 0 0 40px rgba(255,184,0,0.2);
}

/* Teal stars */
.star-t {
  position: absolute; width: 10px; height: 10px; border-radius: 50%;
  background: #64FFDA;
  box-shadow: 0 0 20px rgba(100,255,218,0.6), 0 0 40px rgba(100,255,218,0.2);
}

/* Connection lines */
.conn {
  position: absolute; height: 1px;
  background: linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.09), rgba(255,255,255,0.02));
  transform-origin: left center;
}

.content {
  position: relative; text-align: center; z-index: 1;
}

/* V3 gradient text applied to V2 title */
.title-line {
  font-size: 280px; font-weight: 900; line-height: 1.2;
  letter-spacing: 36px;
  background-image: linear-gradient(135deg, #FFB800 0%, #FF8C00 25%, #FFFFFF 50%, #64FFDA 75%, #4DD0B0 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.dot-sep {
  display: inline-block; width: 24px; height: 24px; border-radius: 50%;
  background: #FFB800; margin: 0 32px; vertical-align: middle;
  box-shadow: 0 0 30px rgba(255,184,0,0.5), 0 0 60px rgba(255,184,0,0.2);
}

.subtitle {
  font-size: 76px; font-weight: 300; color: rgba(255,255,255,0.35);
  letter-spacing: 6px; margin-top: 60px;
}

.deco-line {
  width: 500px; height: 2px; margin: 80px auto 0;
  background: linear-gradient(90deg, transparent, rgba(255,184,0,0.3), rgba(100,255,218,0.3), transparent);
}

/* V3 micro particles for texture */
.pw {
  position: absolute; width: 4px; height: 4px; border-radius: 50%;
  background: #FFB800; opacity: 0.3;
}
.pc {
  position: absolute; width: 4px; height: 4px; border-radius: 50%;
  background: #64FFDA; opacity: 0.25;
}

.footer {
  position: absolute; bottom: 160px; left: 0; right: 0; text-align: center;
}

.footer-text {
  font-size: 52px; font-weight: 400; color: rgba(255,255,255,0.25);
  letter-spacing: 14px;
}

.footer-sep {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: rgba(255,255,255,0.12); margin: 0 20px; vertical-align: middle;
}
</style>
</head>
<body>
<div data-composition-id="cover" data-width="2160" data-height="3840" data-start="0" data-duration="1">
<div class="clip" data-start="0" data-duration="1">
<div class="cover">
  <!-- V3 atmospheric blobs -->
  <div class="blob-warm"></div>

  <!-- Teal stars -->
  <div class="star-t" style="top:180px;left:1200px"></div>

  <div class="footer">

</div>
</div>

</body>
</html>
