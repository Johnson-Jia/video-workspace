<!-- 场景: s4-scan | 时长: 20.2s -->
<div class="layer-bg">
  <!-- bg-component: scan_grid -->
</div>
<div class="layer-fx">
  <div class="fx-glow fx-pulse" style="top:30%;left:40%;width:300px;height:300px;background:radial-gradient(circle,rgba(0,212,255,0.20),transparent 70%)"></div>
  <div class="fx-dot fx-blink" style="top:20%;left:60%;width:4px;height:4px;background:rgba(0,229,255,0.6);box-shadow:0 0 12px rgba(0,229,255,0.4)"></div>
  <div class="fx-dot fx-blink" style="top:70%;left:30%;width:3px;height:3px;background:rgba(0,229,255,0.5);box-shadow:0 0 10px rgba(0,229,255,0.3)"></div>
</div>
<div class="layer-content">
<div class="phase phase-1">
<!-- 旁白: 先看核心功能，职位扫描。它对接了 7 个招聘平台的公开接口... -->
  <div style="text-align:center;width:100%">
    <div style="font-family:var(--font-title);font-size:64px;font-weight:900;color:var(--text)">职位扫描</div>
    <div style="font-family:var(--font-body);font-size:32px;color:var(--text2);margin-top:12px">7 个招聘平台公开接口</div>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:32px;max-width:700px">
      <span class="tech-badge">Greenhouse</span>
      <span class="tech-badge">Ashby</span>
      <span class="tech-badge">Lever</span>
      <span class="tech-badge">Workday</span>
      <span class="tech-badge">iCIMS</span>
      <span class="tech-badge">SAP</span>
      <span class="tech-badge">Oracle</span>
    </div>
    <div style="font-family:var(--font-data);font-size:60px;font-weight:800;margin-top:36px;background-image:linear-gradient(135deg,#00D4FF,#10B981);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">150+ <span style="font-family:var(--font-title);font-size:40px;font-weight:900">家欧美科技公司</span></div>
  </div>
</div>
<div class="phase phase-2">
  <div style="text-align:center;width:100%">
    <div style="font-family:var(--font-data);font-size:72px;font-weight:800;letter-spacing:2px;background-image:linear-gradient(135deg,#10B981,#00D4FF);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">零 Token</div>
    <div style="font-family:var(--font-body);font-size:34px;color:var(--text);margin-top:12px">纯数据抓取，AI Token 零消耗</div>
    <div style="width:120px;height:2px;background-image:linear-gradient(90deg,transparent,#10B981,transparent);margin:32px auto"></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:20px;max-width:640px">
      <div style="display:flex;align-items:center;gap:16px">
        <div style="width:52px;height:52px;border-radius:50%;background:rgba(0,212,255,0.12);display:flex;align-items:center;justify-content:center;font-size:32px;color:#00D4FF">✓</div>
        <div style="font-family:var(--font-body);font-size:32px;color:var(--text)">浏览器逐个打开职位链接</div>
      </div>
      <div style="display:flex;align-items:center;gap:16px">
        <div style="width:52px;height:52px;border-radius:50%;background:rgba(16,185,129,0.12);display:flex;align-items:center;justify-content:center;font-size:32px;color:#10B981">✓</div>
        <div style="font-family:var(--font-body);font-size:32px;color:var(--text)">自动验证职位有效性</div>
      </div>
      <div style="display:flex;align-items:center;gap:16px">
        <div style="width:52px;height:52px;border-radius:50%;background:rgba(255,184,0,0.12);display:flex;align-items:center;justify-content:center;font-size:32px;color:#FFB800">✓</div>
        <div style="font-family:var(--font-body);font-size:32px;color:var(--text)">省掉无效投递</div>
      </div>
    </div>
  </div>
</div>
</div>
