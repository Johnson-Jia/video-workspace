<!-- 场景: s6-data-contract | 时长: 22.8s -->
<div class="layer-bg">
  <!-- bg-component: contour_lines -->
</div>
<div class="layer-fx">
  <div class="fx-line fx-drift" style="top:35%;left:15%;width:70%;height:1px;background-image:linear-gradient(90deg,transparent,rgba(0,200,200,0.15),transparent)"></div>
  <div class="fx-glow fx-pulse" style="top:40%;left:35%;width:300px;height:300px;background:radial-gradient(circle,rgba(0,200,200,0.18),transparent 70%)"></div>
  <div class="fx-dot fx-drift" style="top:75%;left:70%;width:3px;height:3px;background:rgba(0,200,200,0.5);box-shadow:0 0 8px rgba(0,200,200,0.3)"></div>
</div>
<div class="layer-content">
<div class="phase phase-1">
<!-- 旁白: 架构上有个精妙设计，叫数据契约。系统把所有文件分成两层——用户层... -->
  <div style="text-align:center;width:100%">
    <div style="font-family:var(--font-title);font-size:64px;font-weight:900;color:var(--text)">数据契约</div>
    <div style="font-family:var(--font-body);font-size:32px;color:var(--text2);margin-top:12px;margin-bottom:36px">状态与逻辑彻底分离</div>
    <div style="display:flex;justify-content:center;gap:32px">
      <div class="layer-box" style="border:1.5px solid rgba(255,184,0,0.3);background:rgba(255,184,0,0.04)">
        <div class="layer-icon">🔒</div>
        <div class="layer-title" style="color:#FFB800">用户层</div>
        <div class="layer-desc">简历 · 个人配置 · 评分结果<br><span style="color:#10B981;font-weight:700">系统永不触碰</span></div>
      </div>
      <div class="layer-box" style="border:1.5px solid rgba(0,212,255,0.3);background:rgba(0,212,255,0.04)">
        <div class="layer-icon">🔄</div>
        <div class="layer-title" style="color:#00D4FF">系统层</div>
        <div class="layer-desc">评分逻辑 · 工具脚本<br><span style="color:#10B981;font-weight:700">安全升级迭代</span></div>
      </div>
    </div>
  </div>
</div>
<div class="phase phase-2">
  <div style="text-align:center;width:100%">
    <div style="font-family:var(--font-body);font-size:34px;color:var(--text2);margin-bottom:24px;line-height:1.6">你的求职数据，永远不会被一次更新覆盖</div>
    <div style="width:120px;height:2px;background-image:linear-gradient(90deg,transparent,#00D4FF,transparent);margin:0 auto 32px auto"></div>
    <div style="font-family:var(--font-title);font-size:48px;font-weight:900;color:var(--text);line-height:1.5;max-width:700px">
      <span style="background-image:linear-gradient(135deg,#00D4FF,#10B981);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">状态与逻辑 解耦</span>
    </div>
    <div style="font-family:var(--font-body);font-size:32px;color:var(--text2);margin-top:24px;line-height:1.6">这种思路，是大系统才有的工程素养</div>
  </div>
</div>
</div>
