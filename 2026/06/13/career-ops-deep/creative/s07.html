<!-- 场景: s7-limits | 时长: 25.9s -->
<div class="layer-bg">
  <!-- bg-component: noise_field -->
</div>
<div class="layer-fx">
  <div class="fx-glow fx-pulse" style="top:30%;left:35%;width:320px;height:320px;background:radial-gradient(circle,rgba(255,82,82,0.20),transparent 70%)"></div>
  <div class="fx-dot fx-blink" style="top:22%;left:72%;width:4px;height:4px;background:rgba(255,82,82,0.6);box-shadow:0 0 10px rgba(255,82,82,0.4)"></div>
  <div class="fx-dot fx-blink" style="top:65%;left:25%;width:3px;height:3px;background:rgba(255,82,82,0.5);box-shadow:0 0 8px rgba(255,82,82,0.3)"></div>
</div>
<div class="layer-content">
<div class="phase phase-1">
<!-- 旁白: 但要诚实说它的边界。一是地域：它只对接欧美招聘平台... -->
  <div style="text-align:center;width:100%">
    <div style="font-family:var(--font-title);font-size:64px;font-weight:900;color:#FF5252">⚠ 诚实说边界</div>
    <div style="width:100px;height:2px;background-image:linear-gradient(90deg,transparent,#FF5252,transparent);margin:28px auto"></div>
    <div class="caution-row">
      <div class="caution-icon">🌍</div>
      <div class="caution-text">仅限 <span class="highlight-red">欧美招聘平台</span><br><span class="sub">Boss直聘 · 拉勾 · 猎聘 ✗</span></div>
    </div>
  </div>
</div>
<div class="phase phase-2">
  <div style="text-align:center;width:100%">
    <div style="display:flex;flex-direction:column;gap:24px;align-items:center;max-width:720px">
      <div class="caution-row">
        <div class="caution-icon">🎯</div>
        <div class="caution-text">AI 评分是<span class="highlight-red">推理建议</span>，非精确计算<br><span class="sub">可能存在偏差，别当成唯一标准</span></div>
      </div>
      <div class="caution-row">
        <div class="caution-icon">⚙️</div>
        <div class="caution-text">硬件依赖：<span style="color:#FFB800;font-weight:700">Node.js · Playwright · Chromium</span><br><span class="sub">部署门槛较高</span></div>
      </div>
    </div>
  </div>
</div>
<div class="phase phase-3">
  <div style="text-align:center;width:100%">
    <div style="font-family:var(--font-title);font-size:40px;font-weight:900;color:var(--text);margin-bottom:24px">明确反对盲目海投</div>
    <div style="padding:24px 40px;border-radius:14px;border:1.5px solid rgba(255,82,82,0.35);background:rgba(255,82,82,0.06);max-width:560px;margin:0 auto">
      <div style="font-family:var(--font-data);font-size:52px;font-weight:700;color:#FF5252;margin-bottom:12px">&lt; 4 分</div>
      <div style="font-family:var(--font-title);font-size:36px;font-weight:900;color:var(--text)">不建议投</div>
    </div>
    <div style="font-family:var(--font-title);font-size:38px;font-weight:900;margin-top:28px;background-image:linear-gradient(135deg,#FFB800,#FF8C00);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-style:italic">宁可少投，不要乱投</div>
  </div>
</div>
