<!-- 场景: s8-usecase | 时长: 23.3s -->
<div class="layer-bg">
  <!-- bg-component: radial_beams -->
</div>
<div class="layer-fx">
  <div class="fx-dot fx-drift" style="top:22%;left:70%;width:4px;height:4px;background:rgba(255,184,0,0.5);box-shadow:0 0 10px rgba(255,184,0,0.35)"></div>
  <div class="fx-glow fx-pulse" style="top:35%;left:30%;width:300px;height:300px;background:radial-gradient(circle,rgba(255,184,0,0.18),transparent 70%)"></div>
  <div class="fx-dot fx-drift" style="top:70%;left:65%;width:3px;height:3px;background:rgba(255,200,0,0.5);box-shadow:0 0 8px rgba(255,200,0,0.3)"></div>
</div>
<div class="layer-content">
<div class="phase phase-1">
<!-- 旁白: 它最适合谁？AI、机器学习、自动化方向的工程师... -->
  <div style="text-align:center;width:100%">
    <div style="font-family:var(--font-title);font-size:60px;font-weight:900;color:var(--text)">最适合谁？</div>
    <div style="display:flex;flex-direction:column;gap:16px;margin-top:28px;align-items:center;max-width:680px">
      <div class="compare-row"><span class="check">✓</span><span style="color:var(--text)">AI / ML / 自动化 工程师</span></div>
      <div class="compare-row"><span class="check">✓</span><span style="color:var(--text)">想投海外公司的求职者</span></div>
      <div class="compare-row"><span class="check">✓</span><span style="color:var(--text)">愿意折腾开源工具的极客</span></div>
    </div>
    <div style="width:100px;height:2px;background-image:linear-gradient(90deg,transparent,#FFB800,transparent);margin:28px auto"></div>
    <div style="font-family:var(--font-data);font-size:42px;font-weight:700;color:#FFB800">740 → offer</div>
    <div style="font-family:var(--font-body);font-size:32px;color:var(--text2);margin-top:8px">作者本人的真实案例</div>
  </div>
</div>
<div class="phase phase-2">
  <div style="text-align:center;width:100%">
    <div style="display:flex;flex-direction:column;gap:16px;align-items:center;max-width:680px;margin-bottom:32px">
      <div class="compare-row"><span class="check">✓</span><span style="color:var(--text)">开源脚手架，可深度定制</span></div>
      <div class="compare-row"><span class="cross">✗</span><span style="color:var(--text2)">开箱即用的成品</span></div>
    </div>
    <div style="padding:24px 36px;border-radius:14px;border:1.5px solid rgba(255,184,0,0.3);background:rgba(255,184,0,0.05);max-width:640px;text-align:center">
      <div style="font-family:var(--font-body);font-size:32px;color:var(--text2);margin-bottom:8px">国内岗位需自行改造</div>
      <div style="font-family:var(--font-body);font-size:32px;color:var(--text2)">比如接一个国内平台 Provider</div>
    </div>
    <div style="width:100px;height:2px;background-image:linear-gradient(90deg,transparent,#FFB800,transparent);margin:28px auto"></div>
    <div style="font-family:var(--font-title);font-size:40px;font-weight:900;line-height:1.5">
      <span style="color:var(--text)">当</span>
      <span style="background-image:linear-gradient(135deg,#FFB800,#FF8C00);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">脚手架</span>
      <span style="color:var(--text)">，不当</span>
      <span style="color:var(--text2)">成品</span>
    </div>
  </div>
</div>
</div>
