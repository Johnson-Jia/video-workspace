<!-- 场景: hook | 时长: 3.12s | 知识图谱拟人化钩子 -->
<div class="layer-bg">
  <!-- bg-component: radial_beams -->
</div>
<div class="layer-fx">
  <!-- 暖金收敛粒子（向中心汇聚，呼应"记进图谱"）-->
  <div class="fx-particle" style="top:22%;left:18%;width:14px;height:14px;background:#FFD27A;box-shadow:0 0 16px rgba(255,210,122,0.7);"></div>
  <div class="fx-particle" style="top:30%;right:16%;width:12px;height:12px;background:#FFB347;box-shadow:0 0 14px rgba(255,179,71,0.6);animation-delay:-1s;"></div>
  <div class="fx-particle" style="bottom:30%;left:22%;width:13px;height:13px;background:#FF8C32;box-shadow:0 0 14px rgba(255,140,50,0.6);animation-delay:-2s;"></div>
  <div class="fx-particle" style="bottom:24%;right:20%;width:11px;height:11px;background:#FFD27A;box-shadow:0 0 12px rgba(255,210,122,0.55);animation-delay:-0.5s;"></div>
  <!-- 中心脉冲环（图谱核心呼吸）-->
  <div class="fx-pulse-ring" style="top:calc(50% - 110px);left:calc(50% - 110px);width:220px;height:220px;border-color:rgba(255,179,71,0.55);"></div>
  <div class="fx-pulse-ring" style="top:calc(50% - 80px);left:calc(50% - 80px);width:160px;height:160px;border-color:rgba(255,210,122,0.4);animation-delay:-1.5s;"></div>
  <!-- 轨道粒子（环绕核心）-->
  <div class="fx-orbit" style="top:50%;left:50%;background:#FFD27A;box-shadow:0 0 10px rgba(255,210,122,0.7);"></div>
  <div class="fx-orbit" style="top:50%;left:50%;background:#FFB347;animation-delay:-3s;"></div>
</div>
<div class="layer-content">
<div class="phase phase-1">
  <div class="hk-stage">
    <div class="hk-eyebrow">CODE · GRAPH · MEMORY</div>
    <div class="hk-title grad-warm">它把整个代码库<br>记进了一张图谱</div>
    <div class="hk-orb"></div>
    <div class="hk-sub">一行代码也不漏，亚毫秒就能查回来</div>
  </div>
</div>
</div>
