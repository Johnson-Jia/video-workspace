<!-- 场景: hook | 时长: 2.9s | 反直觉钩子：砍掉九成输入，答案没变 -->
<div class="layer-bg">
<!-- bg-component: electric_pulse -->
<div style="position:absolute;inset:0;background:linear-gradient(135deg,#0a0a14 0%,#1a1020 45%,#0a0a14 100%)"></div>

<div style="position:absolute;top:50%;left:50%;width:140%;height:140%;transform:translate(-50%,-50%);
  background:repeating-conic-gradient(from 0deg at 50% 50%,
    transparent 0deg, rgba(255,140,50,0.045) 1.5deg, transparent 3deg, transparent 16deg);
  animation:beamRotate 80s linear infinite"></div>

<div style="position:absolute;top:18%;left:30%;width:620px;height:620px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,140,50,0.28) 0%, rgba(255,107,53,0.10) 45%, transparent 70%);
  filter:blur(90px);animation:glowPulse 7s ease-in-out infinite"></div>

<div style="position:absolute;top:45%;left:55%;width:480px;height:480px;border-radius:50%;
  background:radial-gradient(circle, rgba(0,212,255,0.22), transparent 65%);
  filter:blur(80px);animation:glowPulse 9s ease-in-out infinite 2s"></div>

<div style="position:absolute;top:22%;left:18%;width:5px;height:5px;border-radius:50%;
  background:hsla(38,90%,62%,0.7);box-shadow:0 0 12px hsla(38,80%,55%,0.55);animation:floatParticle 6s ease-in-out infinite 0s"></div>
<div style="position:absolute;top:62%;left:72%;width:4px;height:4px;border-radius:50%;
  background:hsla(190,85%,60%,0.65);box-shadow:0 0 10px hsla(190,75%,52%,0.5);animation:floatParticle 8s ease-in-out infinite 3s"></div>
<div style="position:absolute;top:35%;left:78%;width:3px;height:3px;border-radius:50%;
  background:hsla(45,80%,62%,0.55);box-shadow:0 0 8px hsla(45,72%,52%,0.4);animation:floatParticle 7s ease-in-out infinite 5s"></div>

<div style="position:absolute;top:calc(50% - 120px);left:calc(50% - 120px);width:240px;height:240px;border-radius:50%;
  border:1.5px solid hsla(35,80%,55%,0.14);animation:warmRing 6s ease-out infinite 0s"></div>
<div style="position:absolute;top:calc(50% - 120px);left:calc(50% - 120px);width:240px;height:240px;border-radius:50%;
  border:1px solid hsla(190,75%,55%,0.10);animation:warmRing 6s ease-out infinite 3s"></div>

<div style="position:absolute;inset:0;
  background:linear-gradient(160deg,rgba(255,255,255,0.03) 0%,transparent 25%,transparent 75%,rgba(255,255,255,0.02) 100%);
  animation:glassShimmer 7s ease-in-out infinite"></div>

<div style="position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 40%,transparent 30%,rgba(0,0,0,0.55) 100%)"></div>
</div>
<div class="layer-fx">
  <!-- 暖金脉冲粒子（输入/数据流）-->
  <div class="fx-particle" style="top:20%;left:20%;width:14px;height:14px;background:#FFD27A;box-shadow:0 0 16px rgba(255,210,122,0.75);"></div>
  <div class="fx-particle" style="top:28%;right:18%;width:12px;height:12px;background:#FFB347;box-shadow:0 0 14px rgba(255,179,71,0.65);animation-delay:-1s;"></div>
  <div class="fx-particle" style="bottom:26%;left:22%;width:13px;height:13px;background:#FF8C32;box-shadow:0 0 14px rgba(255,140,50,0.65);animation-delay:-2s;"></div>
  <div class="fx-particle" style="bottom:22%;right:24%;width:11px;height:11px;background:#FFD27A;box-shadow:0 0 12px rgba(255,210,122,0.55);animation-delay:-0.5s;"></div>
  <!-- 中心脉冲环（数据压缩核心）-->
  <div class="fx-pulse-ring" style="top:calc(50% - 130px);left:calc(50% - 130px);width:260px;height:260px;border-color:rgba(255,179,71,0.55);"></div>
  <div class="fx-pulse-ring" style="top:calc(50% - 90px);left:calc(50% - 90px);width:180px;height:180px;border-color:rgba(0,212,255,0.4);animation-delay:-1.5s;"></div>
  <!-- 横向光束（数据流向）-->
  <div class="fx-beam" style="top:48%;background:linear-gradient(90deg,transparent,rgba(255,179,71,0.45),rgba(0,212,255,0.4),transparent);"></div>
</div>
<div class="layer-content">
<div class="phase phase-1">
  <div class="hk-stage">
    <div class="hk-eyebrow">INPUT · CUT · ANSWER</div>
    <div class="hk-title grad-warm">输入砍掉九成<br>AI 答案没变</div>
    <div class="hk-compress">
      <div class="hk-bar-row">
        <div class="hk-bar-in"></div>
        <div class="hk-bar-arrow">→</div>
        <div class="hk-bar-out"></div>
      </div>
      <div class="hk-bar-labels">
        <div class="hk-label-in">100% 输入</div>
        <div class="hk-label-arrow"></div>
        <div class="hk-label-out">10%</div>
      </div>
    </div>
  </div>
</div>
</div>
