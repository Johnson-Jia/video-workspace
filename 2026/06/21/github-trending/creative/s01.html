<div class="layer-bg">

</div>
<div class="layer-fx">
  <!-- 暖金脉冲粒子（十三万八星光的累积）-->
  <div class="fx-particle fx-pulse" style="top:18%;left:20%;width:16px;height:16px;background:#FFD27A;box-shadow:0 0 18px rgba(255,210,122,0.8);"></div>
  <div class="fx-particle fx-pulse" style="top:24%;right:18%;width:14px;height:14px;background:#FFB800;box-shadow:0 0 16px rgba(255,184,0,0.7);animation-delay:-1s;"></div>
  <div class="fx-particle fx-drift" style="bottom:24%;left:22%;width:15px;height:15px;background:#FF8C32;box-shadow:0 0 16px rgba(255,140,50,0.7);animation-delay:-2s;"></div>
  <div class="fx-particle fx-drift" style="bottom:20%;right:24%;width:13px;height:13px;background:#FFD27A;box-shadow:0 0 14px rgba(255,210,122,0.6);animation-delay:-0.5s;"></div>
  <!-- 中心冲击脉冲环（数字震撼）-->
  <div class="fx-pulse-ring" style="top:calc(50% - 160px);left:calc(50% - 160px);width:320px;height:320px;border-color:rgba(255,184,0,0.55);"></div>
  <div class="fx-pulse-ring" style="top:calc(50% - 110px);left:calc(50% - 110px);width:220px;height:220px;border-color:rgba(0,212,255,0.40);animation-delay:-1.5s;"></div>

</div>

      <div class="hk-divider"></div>
