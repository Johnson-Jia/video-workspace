  <div class="fx-particle fx-drift" style="top:26%;right:18%;width:14px;height:14px;background:#F09BE0;box-shadow:0 0 16px rgba(240,155,224,0.70);animation-delay:-1s;"></div>
  <div class="fx-particle fx-pulse" style="bottom:24%;left:22%;width:15px;height:15px;background:#00D4FF;box-shadow:0 0 16px rgba(0,212,255,0.70);animation-delay:-2s;"></div>

  <!-- 创意冲击环 -->
  <div class="fx-pulse-ring" style="top:calc(50% - 150px);left:calc(50% - 150px);width:300px;height:300px;border-color:rgba(233,75,208,0.55);"></div>
  <div class="fx-pulse-ring" style="top:calc(50% - 100px);left:calc(50% - 100px);width:200px;height:200px;border-color:rgba(0,212,255,0.42);animation-delay:-1.5s;"></div>
  <!-- 剪辑光束 -->
  <div class="fx-beam" style="top:44%;background:linear-gradient(90deg,transparent,rgba(233,75,208,0.45),rgba(0,212,255,0.35),transparent);"></div>
