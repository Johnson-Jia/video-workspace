<!-- 场景: headroom | 时长: 11.28s | 单日涨星王：把 AI 输入压一道，答案几乎不变 -->
<div class="layer-bg">
<!-- bg-component: contour_lines -->
</div>
<div class="layer-fx">
  <!-- 压缩数据流（上下行 stream 表达输入被压缩）-->
  <div class="fx-stream" style="left:14%;background:linear-gradient(180deg,transparent,rgba(0,212,255,0.7),transparent);"></div>
  <div class="fx-stream" style="left:38%;background:linear-gradient(180deg,transparent,rgba(77,168,218,0.6),transparent);animation-delay:-1s;"></div>
  <div class="fx-stream" style="left:60%;background:linear-gradient(180deg,transparent,rgba(0,212,255,0.55),transparent);animation-delay:-2s;"></div>
  <div class="fx-stream" style="left:84%;background:linear-gradient(180deg,transparent,rgba(77,168,218,0.5),transparent);animation-delay:-0.5s;"></div>
  <!-- 数据节点（token 被压缩成的亮点）-->
  <div class="fx-particle fx-pulse" style="top:22%;left:26%;width:14px;height:14px;background:#00D4FF;box-shadow:0 0 16px rgba(0,212,255,0.75);"></div>
  <div class="fx-particle fx-drift" style="top:30%;right:24%;width:13px;height:13px;background:#4DA8DA;box-shadow:0 0 14px rgba(77,168,218,0.65);animation-delay:-1.2s;"></div>
  <div class="fx-particle fx-pulse" style="bottom:24%;left:22%;width:13px;height:13px;background:#00D4FF;box-shadow:0 0 14px rgba(0,212,255,0.6);animation-delay:-2s;"></div>
  <!-- 扫描线 -->
  <div class="fx-scan" style="background:linear-gradient(90deg,transparent,rgba(0,212,255,0.55),transparent);"></div>
</div>

<div class="phase phase-1">
