<!-- 场景: smsforwarder | 时长: 8.4s | 旧安卓化身通知中枢，短信自动转发 -->
<div class="layer-bg">
<!-- bg-component: vignette_glow -->
</div>
<div class="layer-fx">
  <!-- 通知转发粒子（暖琥珀流，从手机向外推送）-->
  <div class="fx-particle fx-pulse" style="top:22%;left:24%;width:14px;height:14px;background:#FFB800;box-shadow:0 0 16px rgba(255,184,0,0.75);"></div>
  <div class="fx-particle fx-drift" style="top:30%;right:22%;width:13px;height:13px;background:#FFD27A;box-shadow:0 0 14px rgba(255,210,122,0.65);animation-delay:-1s;"></div>
  <div class="fx-particle fx-pulse" style="bottom:26%;left:22%;width:14px;height:14px;background:#FF8C32;box-shadow:0 0 14px rgba(255,140,50,0.65);animation-delay:-2s;"></div>
  <div class="fx-particle fx-drift" style="bottom:22%;right:24%;width:12px;height:12px;background:#FFB800;box-shadow:0 0 12px rgba(255,184,0,0.60);animation-delay:-0.5s;"></div>
  <!-- 通知流横带 -->
  <div class="fx-beam" style="top:50%;background:linear-gradient(90deg,transparent,rgba(255,184,0,0.40),rgba(255,140,50,0.30),transparent);"></div>
  <!-- 转发光环 -->
  <div class="fx-pulse-ring" style="top:calc(50% - 110px);left:calc(50% - 110px);width:220px;height:220px;border-color:rgba(255,184,0,0.40);"></div>
</div>

    </div>

    <div class="pfc-mid">

      <div class="pfc-desc">监控短信、来电、APP 通知<br>按规则自动转发到钉钉、飞书、邮箱</div>

        <div class="pfc-bar-track"><div class="pfc-bar-fill" style="width:56%;background:linear-gradient(90deg,#FF8C32,#FFD27A,#FFB800);"></div></div>
        <div class="pfc-topics">
