<!-- 场景: cta | 时长: 4.56s | 6 选 1 互动 + 关注引导（暖金收束 + 温和粒子） -->
<div class="layer-bg">
<!-- bg-component: vignette_glow -->
<div style="position:absolute;inset:0;
  background:linear-gradient(160deg,#0A0806 0%,#1A1208 55%,#0A0806 100%)"></div>

<div style="position:absolute;top:22%;left:50%;width:900px;height:900px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,179,71,0.22) 0%,transparent 60%);filter:blur(80px);
  animation:glowPulse 9s ease-in-out infinite"></div>

<div style="position:absolute;top:0;left:0;width:200%;height:200%;transform-origin:25% 17.5%;animation:beamRotate 90s linear infinite;
  background:repeating-conic-gradient(from 0deg,transparent 0deg,rgba(255,179,71,0.04) 2deg,transparent 4deg,transparent 28deg)"></div>

<div style="position:absolute;top:18%;left:30%;width:460px;height:460px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,210,122,0.20) 0%,transparent 60%);filter:blur(80px);
  animation:glowPulse 12s ease-in-out infinite 2s"></div>

<div style="position:absolute;top:30%;left:62%;width:4px;height:4px;border-radius:50%;
  background:hsla(38,90%,65%,0.60);box-shadow:0 0 10px hsla(38,80%,55%,0.50);animation:floatParticle 7s ease-in-out infinite 0s"></div>

<div style="position:absolute;top:55%;left:32%;width:3px;height:3px;border-radius:50%;
  background:hsla(45,85%,62%,0.55);box-shadow:0 0 9px hsla(45,75%,52%,0.45);animation:floatParticle 9s ease-in-out infinite 3s"></div>

<div style="position:absolute;top:72%;left:58%;width:3px;height:3px;border-radius:50%;
  background:hsla(40,80%,58%,0.50);box-shadow:0 0 8px hsla(40,70%,48%,0.40);animation:floatParticle 8s ease-in-out infinite 5s"></div>

<div style="position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,179,71,0.025) 0%,transparent 40%,rgba(255,200,87,0.03) 60%,transparent 100%);
  animation:glassShimmer 8s ease-in-out infinite"></div>

<div style="position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 38%,transparent 35%,rgba(0,0,0,0.55) 100%)"></div>
</div>
<div class="layer-fx">
  <!-- 暖金脉冲粒子（温暖收束） -->
  <div class="fx-particle fx-pulse" style="top:18%;left:20%;width:14px;height:14px;background:#FFB347;box-shadow:0 0 16px rgba(255,179,71,0.75);"></div>
  <div class="fx-particle fx-drift" style="top:26%;right:22%;width:13px;height:13px;background:#FFD27A;box-shadow:0 0 14px rgba(255,210,122,0.65);animation-delay:-1s;"></div>
  <div class="fx-particle fx-pulse" style="bottom:24%;left:22%;width:14px;height:14px;background:#FFC857;box-shadow:0 0 14px rgba(255,200,87,0.65);animation-delay:-2s;"></div>
  <div class="fx-particle fx-drift" style="bottom:20%;right:24%;width:12px;height:12px;background:#FFB347;box-shadow:0 0 12px rgba(255,179,71,0.60);animation-delay:-0.5s;"></div>
  <!-- 收束光环 -->
  <div class="fx-pulse-ring" style="top:calc(50% - 160px);left:calc(50% - 160px);width:320px;height:320px;border-color:rgba(255,179,71,0.45);"></div>
  <div class="fx-pulse-ring" style="top:calc(50% - 110px);left:calc(50% - 110px);width:220px;height:220px;border-color:rgba(255,210,122,0.35);animation-delay:-1.5s;"></div>
  <!-- 温暖光束 -->
  <div class="fx-beam" style="top:46%;background:linear-gradient(90deg,transparent,rgba(255,179,71,0.40),transparent);"></div>
</div>
<div class="layer-content">
<div class="phase phase-1">
  <div class="cta-stage">
    <!-- cta-title 无 background，可用 grad-warm 渐变 -->
    <div class="cta-title grad-warm">这 6 个<br>你最想试哪个？</div>
    <!-- 6 项目胶囊芯片（胶囊禁 grad-*，用纯色 color + border-color） -->
    <div class="cta-choices">
      <div class="cta-chip" style="border-color:rgba(0,212,255,0.55);color:#00D4FF;">deer-flow</div>
      <div class="cta-chip" style="border-color:rgba(20,224,168,0.55);color:#14E0A8;">worldmonitor</div>
      <div class="cta-chip" style="border-color:rgba(176,123,255,0.55);color:#B07BFF;">cybersecurity</div>
      <div class="cta-chip" style="border-color:rgba(0,212,255,0.55);color:#00D4FF;">cognee</div>
      <div class="cta-chip" style="border-color:rgba(255,200,87,0.55);color:#FFC857;">palmier-pro</div>
      <div class="cta-chip" style="border-color:rgba(176,123,255,0.55);color:#B07BFF;">English</div>
    </div>
    <!-- cta-follow 胶囊，纯色 color（CSS 已设 #FFB347），不放 grad-* -->
    <div class="cta-follow">关注我 · 下期见</div>
  </div>
</div>
</div>
