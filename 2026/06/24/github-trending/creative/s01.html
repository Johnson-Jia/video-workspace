<!-- 场景: hook | 时长: 5.8s | AI帮你做视频 单日三千五百星（青白霓虹冲击 · 复刻主题） -->
<div class="layer-bg">
<!-- bg-component: radial_beams -->
<div style="position:absolute;inset:0;background:linear-gradient(135deg,#040810,#081830,#040810)"></div>

<div style="position:absolute;top:0;left:0;width:200%;height:200%;transform-origin:25% 17.5%;animation:beamRotate 60s linear infinite;
  background:repeating-conic-gradient(from 0deg,transparent 0deg,rgba(0,212,255,0.07) 2deg,transparent 4deg,transparent 28deg)"></div>

<div style="position:absolute;top:15%;left:30%;width:680px;height:680px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,212,255,0.28) 0%,transparent 60%);filter:blur(80px);
  animation:glowPulse 8s ease-in-out infinite"></div>

<div style="position:absolute;top:35%;left:55%;width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,200,87,0.18) 0%,transparent 60%);filter:blur(90px);
  animation:glowPulse 10s ease-in-out infinite 2s"></div>

<div style="position:absolute;top:18%;left:38%;width:5px;height:5px;border-radius:50%;
  background:hsla(190,90%,65%,0.7);box-shadow:0 0 12px hsla(190,80%,55%,0.6);animation:floatParticle 6s ease-in-out infinite 0s"></div>
<div style="position:absolute;top:50%;left:35%;width:4px;height:4px;border-radius:50%;
  background:hsla(180,85%,60%,0.55);box-shadow:0 0 10px hsla(180,75%,50%,0.45);animation:floatParticle 8s ease-in-out infinite 2s"></div>
<div style="position:absolute;top:65%;left:60%;width:4px;height:4px;border-radius:50%;
  background:hsla(45,80%,62%,0.5);box-shadow:0 0 9px hsla(45,70%,52%,0.4);animation:floatParticle 7s ease-in-out infinite 4s"></div>

<div style="position:absolute;top:calc(38% - 80px);left:calc(38% - 80px);width:160px;height:160px;border-radius:50%;
  border:1.5px solid hsla(190,80%,55%,0.16);animation:warmRing 5s ease-out infinite 0s"></div>
<div style="position:absolute;top:calc(38% - 80px);left:calc(38% - 80px);width:160px;height:160px;border-radius:50%;
  border:1px solid hsla(180,70%,50%,0.10);animation:warmRing 5s ease-out infinite 2.5s"></div>

<div style="position:absolute;inset:0;
  background:linear-gradient(160deg,rgba(255,255,255,0.03) 0%,transparent 25%,transparent 75%,rgba(255,255,255,0.02) 100%);
  animation:glassShimmer 7s ease-in-out infinite"></div>

<div style="position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 40%,transparent 28%,rgba(0,0,0,0.55) 100%)"></div>
</div>
<div class="layer-fx">
  <!-- 青蓝脉冲粒子（AI 复刻主题的能量光点） -->
  <div class="fx-particle" style="top:18%;left:20%;width:16px;height:16px;background:#00D4FF;box-shadow:0 0 18px rgba(0,212,255,0.85);animation:fxAura 4.5s ease-in-out infinite;"></div>
  <div class="fx-particle" style="top:24%;right:18%;width:14px;height:14px;background:#00F5D4;box-shadow:0 0 16px rgba(0,245,212,0.75);animation:fxAura 4.5s ease-in-out infinite -1s;"></div>
  <div class="fx-particle" style="bottom:22%;left:22%;width:15px;height:15px;background:#FFC857;box-shadow:0 0 16px rgba(255,200,87,0.7);animation:fxFloat 4s ease-in-out infinite -2s;"></div>
  <div class="fx-particle" style="bottom:18%;right:24%;width:13px;height:13px;background:#FFB347;box-shadow:0 0 14px rgba(255,179,71,0.65);animation:fxFloat 4s ease-in-out infinite -0.5s;"></div>
  <!-- 中心冲击脉冲环 -->
  <div class="fx-pulse-ring" style="top:calc(50% - 200px);left:calc(50% - 200px);width:400px;height:400px;border-color:rgba(0,212,255,0.55);"></div>
  <div class="fx-pulse-ring" style="top:calc(50% - 140px);left:calc(50% - 140px);width:280px;height:280px;border-color:rgba(255,200,87,0.42);animation-delay:-1.5s;"></div>
  <!-- 横向光束 -->
  <div class="fx-beam" style="top:48%;background:linear-gradient(90deg,transparent,rgba(0,212,255,0.45),rgba(255,200,87,0.35),transparent);"></div>
  <!-- 扫描带 -->
  <div class="fx-scan" style="background:linear-gradient(90deg,transparent,rgba(0,212,255,0.50),transparent);"></div>
</div>
<div class="layer-content">
<div class="phase phase-1">
  <div class="hk-stage">
    <div class="hk-eyebrow">GITHUB 今日涨星王</div>
    <div class="hk-title grad-cool">AI 帮你做视频</div>
    <div class="hk-arrow">↓</div>
    <div class="hk-title grad-warm">单日三千五百星</div>
    <div class="hk-tag">复刻专业能力 · 全开源</div>
  </div>
</div>
</div>
