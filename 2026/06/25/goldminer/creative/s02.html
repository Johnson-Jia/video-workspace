<!-- 场景: what | 时长: 20.6s -->
<div class="layer-bg">
<!-- bg-component: diamond_lattice -->
</div>
<div class="layer-fx">
  <!-- 微贷网身份卡：金色光带扫过 + 中央暖辉光呼吸 + 上升金粒 -->
  <div class="fx-aura" style="top:50%;left:50%;width:560px;height:560px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,184,0,0.32),transparent 65%);filter:blur(60px)"></div>
  <div class="fx-beam" style="top:0;left:-20%;width:140%;height:60px;background:linear-gradient(90deg,transparent,rgba(255,184,0,0.40),transparent);filter:blur(8px);mix-blend-mode:screen;transform:rotate(-6deg)"></div>
  <div class="fx-beam" style="top:70%;left:-20%;width:140%;height:50px;background:linear-gradient(90deg,transparent,rgba(212,160,23,0.30),transparent);filter:blur(8px);mix-blend-mode:screen;transform:rotate(4deg);animation-delay:2.5s"></div>
  <div class="fx-particle" style="top:1400px;left:200px;width:10px;height:10px;background:#FFB800;box-shadow:0 0 14px #FFB800"></div>
  <div class="fx-particle" style="top:1550px;left:760px;width:9px;height:9px;background:#FFD700;box-shadow:0 0 12px #FFD700;animation-delay:1.5s"></div>
  <div class="fx-particle" style="top:1650px;left:480px;width:11px;height:11px;background:#FFB800;box-shadow:0 0 14px #FFB800;animation-delay:2.8s"></div>
  <div class="fx-orbit" style="top:50%;left:50%;background:#FFB800;box-shadow:0 0 10px #FFB800"></div>
</div>
<div class="layer-content">
<div class="phase phase-1">
  <div class="wd-wrap">
    <!-- 顶部带：眉标 + 微贷网大字身份 -->
    <div class="wd-top">
      <div class="wd-eyebrow">淘金对象 · 中国 P2P 头部玩家</div>
      <div class="wd-name-block">
        <div class="wd-name-cn">微贷网</div>
        <div class="wd-name-en">Weidai · 2011 年成立</div>
      </div>
      <div class="wd-tags">
        <div class="wd-tag">$110M 融资（约7亿）</div>
        <div class="wd-tag">P2P 中介模式</div>
      </div>
    </div>

    <!-- 中部带：商业模式（借款人 ← 中介 → 投资者）-->
    <div style="position:relative;z-index:2;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:18px;width:100%;padding:30px 0">
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 26px;border-radius:18px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,184,0,0.30);min-width:220px">
        <div style="font-family:'Noto Sans SC';font-size:34px;font-weight:700;color:#fff">借款人</div>
        <div style="font-family:'Noto Sans SC';font-size:32px;color:var(--text2)">想借钱</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="font-family:'JetBrains Mono';font-size:48px;font-weight:900;color:var(--accent-warm);line-height:1">↔</div>
        <div style="font-family:'Noto Sans SC',cursive;font-size:44px;font-weight:900;color:var(--accent-warm)">抽中介费</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 26px;border-radius:18px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,184,0,0.30);min-width:220px">
        <div style="font-family:'Noto Sans SC';font-size:34px;font-weight:700;color:#fff">投资者</div>
        <div style="font-family:'Noto Sans SC';font-size:32px;color:var(--text2)">想放贷赚钱</div>
      </div>
    </div>

    <!-- 底部带：留白呼吸（让 space-between 三带均衡）-->
    <div style="position:relative;z-index:2;font-family:'Noto Sans SC';font-size:38px;font-weight:600;color:rgba(255,235,200,0.72);text-align:center;border-top:2px solid rgba(255,184,0,0.22);padding-top:24px">
      牵线搭桥 · 抽佣吃利差
    </div>
  </div>
</div>
<div class="phase phase-2">
  <div class="wd-wrap">
    <!-- 顶部带：眉标 -->
    <div class="wd-top">
      <div class="wd-eyebrow">行业狂热 · 2011–2016 黄金期</div>
    </div>

    <!-- 中部带：规模数据三行 -->
    <div class="wd-data">
      <div class="wd-data-header grad-gold-soft">号称颠覆银行 · 普惠金融</div>
      <div class="wd-stat-grid">
        <div class="wd-stat-row">
          <div class="wd-stat-label">全国 P2P 平台同时运营</div>
          <div class="wd-stat-val grad-gold">5000+</div>
        </div>
        <div class="wd-stat-row">
          <div class="wd-stat-label">微贷网行业地位</div>
          <div class="wd-stat-val grad-gold">头部玩家</div>
        </div>
        <div class="wd-stat-row">
          <div class="wd-stat-label">承诺年化收益</div>
          <div class="wd-stat-val grad-fire">双位数</div>
        </div>
      </div>
    </div>

    <!-- 底部带：标语 -->
    <div class="wd-slogan">「颠覆银行 · 做普惠金融」— 后来全部清零</div>
  </div>
</div>
</div>
