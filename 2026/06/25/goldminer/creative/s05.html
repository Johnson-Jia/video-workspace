<!-- 场景: compare | 时长: 18.6s -->
<div class="layer-bg">
<!-- bg-component: ancient_relic -->
</div>
<div class="layer-fx">
  <!-- 复盘沉淀：金色符文辉光呼吸 + 对角暖光束 + 上升金粒 + 装饰光环 -->
  <div class="fx-aura" style="top:50%;left:50%;width:580px;height:580px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,184,0,0.32),transparent 65%);filter:blur(60px)"></div>
  <div class="fx-pulse-ring" style="top:50%;left:50%;width:400px;height:400px;border:2px solid rgba(255,184,0,0.40);border-radius:50%;transform:translate(-50%,-50%)"></div>
  <div class="fx-beam" style="top:0;left:-20%;width:140%;height:55px;background:linear-gradient(90deg,transparent,rgba(255,184,0,0.32),transparent);filter:blur(8px);mix-blend-mode:screen;transform:rotate(-5deg)"></div>
  <div class="fx-beam" style="top:65%;left:-20%;width:140%;height:45px;background:linear-gradient(90deg,transparent,rgba(212,160,23,0.28),transparent);filter:blur(8px);mix-blend-mode:screen;transform:rotate(3deg);animation-delay:2s"></div>
  <div class="fx-particle" style="top:1300px;left:280px;width:11px;height:11px;background:#FFD700;box-shadow:0 0 14px #FFD700"></div>
  <div class="fx-particle" style="top:1500px;left:700px;width:10px;height:10px;background:#FFB800;box-shadow:0 0 14px #FFB800;animation-delay:1.6s"></div>
  <div class="fx-particle" style="top:1600px;left:500px;width:12px;height:12px;background:#FFD700;box-shadow:0 0 14px #FFD700;animation-delay:2.8s"></div>
</div>
<div class="layer-content">
<div class="phase phase-1">
  <div class="cm-wrap">
    <!-- 顶部带：眉标 -->
    <div class="cm-header grad-gold-soft">同卵双生 · 同款死法</div>

    <!-- 中部带：双栏对比 -->
    <div class="cm-dual">
      <div class="cm-card left">
        <div class="cm-card-name">微贷网</div>
        <div class="cm-card-en">Weidai · $110M</div>
        <div class="cm-card-row">
          <div class="l">死因</div>
          <div class="v">监管清退 + 庞氏化</div>
        </div>
        <div class="cm-card-row">
          <div class="l">结局</div>
          <div class="v grad-gold">清零</div>
        </div>
      </div>
      <div class="cm-card right">
        <div class="cm-card-name">千和</div>
        <div class="cm-card-en">Qianhe · $100M</div>
        <div class="cm-card-row">
          <div class="l">年放贷</div>
          <div class="v">$500M+</div>
        </div>
        <div class="cm-card-row">
          <div class="l">准备金（覆盖率）</div>
          <div class="v grad-fire">$20M · 2.5%</div>
        </div>
      </div>
    </div>

    <!-- 底部带：结构性绝症结论（纯色金黄，避免 grad-fire background-clip 渲染异常）-->
    <div class="cm-verdict">纸糊的都算不上 · P2P 是结构性绝症</div>
  </div>
</div>
<div class="phase phase-2">
  <div class="cm-wrap">
    <!-- 顶部带：眉标 -->
    <div style="position:relative;z-index:2;font-family:'JetBrains Mono';font-size:32px;font-weight:700;letter-spacing:0.18em;color:var(--accent-warm);text-align:center">
      讨论 · 你来判
    </div>

    <!-- 中部带：CTA 高亮 -->
    <div class="cm-cta">
      <div class="cm-cta-eyebrow">卖铲子点子 · CREDITOS</div>
      <div class="cm-cta-title grad-gold">这个点子<br>能成吗？</div>
      <div class="cm-cta-sub">AI 风控 API · 卖给持牌玩家</div>
    </div>

    <!-- 底部带：药丸标签 -->
    <div class="cm-cta-pills">
      <div class="cm-cta-pill">能成</div>
      <div class="cm-cta-pill">悬</div>
      <div class="cm-cta-pill">关注下期</div>
    </div>
  </div>
</div>
</div>
