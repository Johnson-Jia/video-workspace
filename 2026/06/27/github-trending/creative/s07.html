<div class="layer-fx">

  <div class="fx-aura" style="position:absolute;top:38%;left:50%;width:540px;height:540px;border-radius:50%;background:radial-gradient(circle,hsla(260,70%,55%,0.22),hsla(220,70%,55%,0.10),transparent 70%);filter:blur(50px);transform:translate(-50%,-50%);"></div>
  <!-- 星点闪烁（隐私网络节点） -->
  <div class="fx-particle" style="position:absolute;top:18%;left:28%;width:5px;height:5px;border-radius:50%;background:hsla(0,0%,100%,0.85);box-shadow:0 0 10px hsla(0,0%,100%,0.7);"></div>
  <div class="fx-particle" style="position:absolute;top:22%;left:72%;width:6px;height:6px;border-radius:50%;background:hsla(260,80%,75%,0.80);box-shadow:0 0 12px hsla(260,75%,68%,0.6);"></div>
  <div class="fx-particle" style="position:absolute;top:62%;left:18%;width:5px;height:5px;border-radius:50%;background:hsla(0,0%,100%,0.80);box-shadow:0 0 10px hsla(0,0%,100%,0.65);"></div>
  <div class="fx-particle" style="position:absolute;top:70%;left:82%;width:7px;height:7px;border-radius:50%;background:hsla(220,80%,72%,0.78);box-shadow:0 0 13px hsla(220,75%,65%,0.6);"></div>
  <div class="fx-particle" style="position:absolute;top:85%;left:38%;width:5px;height:5px;border-radius:50%;background:hsla(0,0%,100%,0.75);box-shadow:0 0 10px hsla(0,0%,100%,0.6);"></div>
  <!-- CTA 脉冲环（召唤行动） -->
  <div class="fx-pulse-ring" style="position:absolute;top:50%;left:50%;width:440px;height:440px;border-radius:50%;border:2px solid hsla(260,70%,62%,0.30);transform:translate(-50%,-50%);box-shadow:0 0 40px hsla(260,65%,58%,0.18);"></div>
  <div class="fx-pulse-ring" style="position:absolute;top:50%;left:50%;width:620px;height:620px;border-radius:50%;border:1.5px solid hsla(220,70%,60%,0.22);transform:translate(-50%,-50%);box-shadow:0 0 36px hsla(220,65%,55%,0.14);"></div>
  <!-- 加密连线（隐私网络） -->
  <svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;" xmlns="http://www.w3.org/2000/svg">
    <line x1="26%" y1="20%" x2="70%" y2="24%" stroke="hsla(260,70%,65%,0.25)" stroke-width="1.2"/>
    <line x1="70%" y1="24%" x2="80%" y2="68%" stroke="hsla(220,70%,62%,0.22)" stroke-width="1.2"/>
    <line x1="80%" y1="68%" x2="36%" y2="84%" stroke="hsla(260,70%,65%,0.20)" stroke-width="1.2"/>
    <line x1="36%" y1="84%" x2="18%" y2="62%" stroke="hsla(220,70%,62%,0.22)" stroke-width="1.2"/>
    <line x1="18%" y1="62%" x2="26%" y2="20%" stroke="hsla(260,70%,65%,0.20)" stroke-width="1.2"/>
  </svg>
  <!-- 流星划过 -->
  <div class="fx-beam" style="position:absolute;top:30%;left:10%;width:120px;height:2px;background:linear-gradient(90deg,transparent,hsla(0,0%,100%,0.55),transparent);transform:rotate(-12deg);filter:blur(0.5px);"></div>
</div>
