<!-- 场景: what | 时长: 20.5s | bg: radial_beams | phases: 2 -->
<div class="layer-bg">
<!-- bg-component: radial_beams -->
<div style="position:absolute;inset:0;background:linear-gradient(160deg,#0A0805,#1a1208 60%,#0A0805)"></div>
<div style="position:absolute;top:30%;left:50%;width:14px;height:1400px;background:linear-gradient(180deg,transparent,hsla(40,95%,58%,0.10),transparent);transform:translateX(-50%) rotate(15deg);filter:blur(3px);transform-origin:top center"></div>
<div style="position:absolute;top:30%;left:50%;width:14px;height:1400px;background:linear-gradient(180deg,transparent,hsla(30,90%,56%,0.10),transparent);transform:translateX(-50%) rotate(-15deg);filter:blur(3px);transform-origin:top center"></div>
<div style="position:absolute;top:30%;left:50%;width:14px;height:1400px;background:linear-gradient(180deg,transparent,hsla(45,92%,60%,0.08),transparent);transform:translateX(-50%) rotate(45deg);filter:blur(3px);transform-origin:top center"></div>
<div style="position:absolute;top:30%;left:50%;width:14px;height:1400px;background:linear-gradient(180deg,transparent,hsla(35,88%,58%,0.08),transparent);transform:translateX(-50%) rotate(-45deg);filter:blur(3px);transform-origin:top center"></div>
<div style="position:absolute;top:30%;left:50%;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,hsla(40,95%,60%,0.22),transparent 65%);transform:translate(-50%,-50%);filter:blur(50px);animation:glowPulse 6s ease-in-out infinite"></div>
<div style="position:absolute;top:58%;left:30%;width:4px;height:4px;border-radius:50%;background:hsla(45,92%,65%,0.7);box-shadow:0 0 10px hsla(45,85%,55%,0.6);animation:floatParticle 7s ease-in-out infinite 0s"></div>
<div style="position:absolute;top:62%;left:65%;width:3px;height:3px;border-radius:50%;background:hsla(35,90%,62%,0.65);box-shadow:0 0 9px hsla(35,80%,52%,0.55);animation:floatParticle 8s ease-in-out infinite 2s"></div>
<div style="position:absolute;top:55%;left:48%;width:3px;height:3px;border-radius:50%;background:hsla(50,88%,66%,0.7);box-shadow:0 0 9px hsla(50,80%,56%,0.6);animation:floatParticle 6s ease-in-out infinite 4s"></div>
<div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 40%,hsla(8,20%,3%,0.5) 100%)"></div>
</div>
<div class="layer-fx">
<!-- fx1: 暖金光环扩散 -->
<div class="fx-ring" style="position:absolute;top:32%;left:50%;width:300px;height:300px;border-radius:50%;border:2px solid hsla(40,95%,60%,0.25);transform:translate(-50%,-50%);animation:warmRing 4s ease-out infinite"></div>
<!-- fx2: 流动光带 -->
<div class="fx-shimmer" style="position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(120deg,transparent 30%,hsla(40,90%,58%,0.06) 50%,transparent 70%);animation:glassShimmer 8s ease-in-out infinite"></div>
<!-- fx3: 顶部光束扫掠 -->
<div class="fx-beam" style="position:absolute;top:18%;left:-60%;width:120%;height:160px;background:linear-gradient(100deg,transparent,hsla(40,92%,60%,0.16),transparent);filter:blur(38px);transform:rotate(-5deg);animation:fxBeamSweep 7s ease-in-out infinite"></div>
</div>

  <div class="card-soft" style="text-align:center;min-width:240px">
    <div style="font-size:32px;color:var(--text2)">小鸣融资</div>

<div class="phase phase-2" style="display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:32px">

    <div class="card-soft" style="text-align:center;min-width:220px;border-color:rgba(255,107,0,0.4)">
      <div style="font-size:32px;color:var(--text2)">ofo</div>
      <div style="font-family:var(--font-data);font-size:64px;font-weight:700" class="grad-amber glow-amber">$2.2B</div>

      <div style="font-family:var(--font-data);font-size:64px;font-weight:700" class="grad-amber glow-amber">$0.9B</div>
