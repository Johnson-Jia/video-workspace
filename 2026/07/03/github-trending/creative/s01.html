<!-- 场景: hook | 时长: 2.71s | 6 个 AI 替你干不想碰的活（数字 6 + 暖橙冲击 + 6 光点脉动） -->

<div style="position:absolute;inset:0;background:linear-gradient(135deg,#0a0608,#1a0f06,#0a0608)"></div>

<div style="position:absolute;top:0;left:0;width:200%;height:200%;transform-origin:25% 17.5%;animation:beamRotate 60s linear infinite;

<div style="position:absolute;top:12%;left:28%;width:620px;height:620px;border-radius:50%;

<div style="position:absolute;top:55%;left:55%;width:380px;height:380px;border-radius:50%;
  background:radial-gradient(circle,rgba(77,168,218,0.14) 0%,transparent 65%);filter:blur(70px);
  animation:glowPulse 11s ease-in-out infinite 3s"></div>

<div style="position:absolute;top:30%;left:55%;width:4px;height:4px;border-radius:50%;
  background:hsla(28,90%,60%,0.65);box-shadow:0 0 10px hsla(28,80%,55%,0.5);animation:floatParticle 6s ease-in-out infinite 0s"></div>
<div style="position:absolute;top:48%;left:32%;width:3px;height:3px;border-radius:50%;
  background:hsla(38,85%,60%,0.55);box-shadow:0 0 8px hsla(38,75%,50%,0.4);animation:floatParticle 8s ease-in-out infinite 2s"></div>
<div style="position:absolute;top:65%;left:60%;width:3px;height:3px;border-radius:50%;

<div style="position:absolute;top:calc(38% - 90px);left:calc(38% - 90px);width:180px;height:180px;border-radius:50%;
  border:1.5px solid hsla(28,80%,55%,0.14);animation:warmRing 5s ease-out infinite 0s"></div>
<div style="position:absolute;top:calc(38% - 90px);left:calc(38% - 90px);width:180px;height:180px;border-radius:50%;
  border:1px solid hsla(35,70%,50%,0.10);animation:warmRing 5s ease-out infinite 2.5s"></div>

<div style="position:absolute;inset:0;
  background:linear-gradient(160deg,rgba(255,255,255,0.03) 0%,transparent 25%,transparent 75%,rgba(255,255,255,0.02) 100%);
  animation:glassShimmer 7s ease-in-out infinite"></div>

<div style="position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 35%,transparent 30%,rgba(0,0,0,0.5) 100%)"></div>
</div>
<div class="layer-fx">
  <!-- 暖橙冲击粒子（6 个 AI 能力光点） -->

  <div class="fx-particle fx-pulse" style="top:20%;right:18%;width:14px;height:14px;background:#FFB347;box-shadow:0 0 18px rgba(255,179,71,0.80);animation-delay:-0.5s;"></div>
  <div class="fx-particle fx-drift" style="top:42%;left:14%;width:14px;height:14px;background:#4DA8DA;box-shadow:0 0 16px rgba(77,168,218,0.75);animation-delay:-1s;"></div>
  <div class="fx-particle fx-drift" style="top:44%;right:14%;width:13px;height:13px;background:#FFD27A;box-shadow:0 0 14px rgba(255,210,122,0.70);animation-delay:-1.6s;"></div>
  <div class="fx-particle fx-pulse" style="bottom:24%;left:22%;width:14px;height:14px;background:#B07BFF;box-shadow:0 0 16px rgba(176,123,255,0.70);animation-delay:-2s;"></div>

  <div class="fx-pulse-ring" style="top:calc(50% - 140px);left:calc(50% - 140px);width:280px;height:280px;border-color:rgba(77,168,218,0.42);animation-delay:-1.5s;"></div>
  <!-- 横向暖光束 -->
  <div class="fx-beam" style="top:50%;background:linear-gradient(90deg,transparent,rgba(255,140,50,0.45),rgba(77,168,218,0.30),transparent);"></div>
  <!-- 扫描带（科技感） -->
  <div class="fx-scan" style="background:linear-gradient(90deg,transparent,rgba(255,140,50,0.50),transparent);"></div>
</div>

</div>
