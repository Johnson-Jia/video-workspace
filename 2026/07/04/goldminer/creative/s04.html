<!-- 场景: loot | 时长: 29.3s | bg: diamond_lattice（45°金色菱形网格，宝藏感+区别 s03 dark_cipher） | phases: 3 -->
<div class="layer-bg">

    repeating-linear-gradient(-45deg,transparent,transparent 59px,hsla(40,70%,55%,0.06) 59px,hsla(40,70%,55%,0.06) 60px);

<div style="position:absolute;top:30%;left:25%;width:540px;height:540px;border-radius:50%;

<div style="position:absolute;top:25%;left:60%;width:4px;height:4px;border-radius:50%;background:hsla(48,92%,65%,0.78);box-shadow:0 0 12px hsla(45,85%,55%,0.65);animation:emberFloat 6s ease-in-out infinite 0s"></div>
<div style="position:absolute;top:50%;left:20%;width:3px;height:3px;border-radius:50%;background:hsla(50,88%,62%,0.72);box-shadow:0 0 10px hsla(45,80%,55%,0.55);animation:emberFloat 7s ease-in-out infinite 2s"></div>

<div style="position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,210,120,0.04) 0%,transparent 40%,rgba(255,190,80,0.05) 60%,transparent 100%);

<div style="position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 50%,transparent 30%,hsla(30,20%,3%,0.42) 100%)"></div>

<div class="layer-fx">
<!-- fx1: 宝藏金光上升带（淘金成功） -->
