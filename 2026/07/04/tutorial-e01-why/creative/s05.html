<div class="layer-bg"><!-- bg-component: gradient_mesh --></div>
<div class="layer-fx">
  <!-- fx 1：右上绿色平衡脉冲（正确姿态） -->
  <div class="fx-orb fx-pulse" style="top:12%;right:12%;width:220px;height:220px;
    background:radial-gradient(circle,rgba(16,185,129,.26),rgba(16,185,129,.05) 60%,transparent 70%);
    filter:blur(8px);"></div>
  <!-- fx 2：左下蓝色漂移（清晰理性） -->
  <div class="fx-orb fx-drift" style="bottom:14%;left:10%;width:200px;height:200px;
    background:radial-gradient(circle,rgba(59,130,246,.24),rgba(59,130,246,.05) 60%,transparent 70%);
    filter:blur(10px);"></div>
  <!-- fx 3：右上平衡闪烁锚点（正确姿态焦点） -->
  <div class="fx-orb fx-blink" style="top:24%;right:24%;width:12px;height:12px;
    background:#10B981;border-radius:50%;box-shadow:0 0 16px rgba(16,185,129,.6);"></div>
</div>
<div class="layer-content">
  <div class="phase phase-1 tut-scene">
    <div class="tut-grid">
      <div class="tut-hero" data-reveal="0" data-reveal-dir="top">
        <div class="hero-eyebrow">中间姿态</div>
        <h1 class="hero-title">正确姿态：拥抱 + 验证</h1>
        <div class="hero-underline"></div>
      </div>
      <div class="tut-quote quote-green" data-reveal="3" data-reveal-dir="top">
        <div class="quote-text">信任，但验证。</div>
      </div>
      <div class="tut-analog" data-reveal="7" data-reveal-dir="top">
        <div class="analog-icon">实</div>
        <div class="analog-rows">
          <div class="analog-row"><span class="dot">·</span>把 AI 当一个资深实习生</div>
          <div class="analog-row"><span class="dot">·</span>不知疲倦 · 但会犯错</div>
          <div class="analog-row"><span class="dot">·</span>委派任务 · 审查产出</div>
        </div>
      </div>
      <div class="tut-rate" data-reveal="12" data-reveal-dir="top">
        <div class="rate-cell cell-green">
          <div class="rate-label">懂业务 · 懂原理</div>
          <div class="rate-num">×10 倍</div>
        </div>
        <div class="rate-cell cell-gray">
          <div class="rate-label">不懂的人</div>
          <div class="rate-num">产出再多 = 0</div>
        </div>
      </div>
    </div>
  </div>
