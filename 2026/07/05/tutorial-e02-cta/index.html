/* === ClipForge 基础层（自动生成，勿手改）=== */
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;color:#fff;overflow:hidden;width:1920px;height:1080px;}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;}
.clip{position:absolute;top:0;left:0;width:1920px;height:1080px;overflow:hidden;}
.layer-bg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;}
.layer-fx{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none;}
.layer-content{position:relative;z-index:3;height:100%;color:#fff;font-size:48px;}
.layer-cinema{position:absolute;top:0;left:0;width:100%;height:100%;z-index:4;pointer-events:none;}
.phase{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 120px 60px 120px;opacity:0;}
.phase:first-child{opacity:1;}
/* 兜底：.phase 内文本居中容器的直接块级子元素水平居中（根治 max-width 块缺 margin:0 auto 导致整块偏左；text-align 只居中行内内容不居中块盒子）*/
.phase [style*="text-align:center"] > div,.phase [style*="text-align: center"] > div{margin-left:auto;margin-right:auto;}
audio{display:none;}
.fx-glow{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;}
.fx-line{position:absolute;height:1px;pointer-events:none;}
.fx-dot{position:absolute;border-radius:50%;pointer-events:none;}
/* === fx 原语库（CSS animation 循环态，0%帧可见/移动型，HyperFrames 安全）===
   LLM 在 .layer-fx 内用 <div class="fx-xxx"> 直接引用，无需写 CSS；
   颜色默认半透明白，可 inline 覆盖（style="background:var(--accent-warm)"）。
   情绪→原语：ambient→aura / focus→ring,pulse-ring / calm→particle / tech→scan,stream,grid /
   climax→beam / shock→bolt / energy→orbit。R-R-008 要求 ≥2 种不同 fx class。 */
@keyframes fxAura{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.8;transform:scale(1.1)}}
@keyframes fxRingExp{0%,100%{opacity:.3;transform:scale(.92)}50%{opacity:.65;transform:scale(1.25)}}
@keyframes fxFloat{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-22px);opacity:1}}
@keyframes fxScanMove{0%,100%{top:18%}50%{top:82%}}
@keyframes fxBeamSweep{0%{left:-60%;opacity:0}10%,90%{opacity:.6}50%{left:50%}100%{left:120%;opacity:0}}
@keyframes fxStreamFall{0%{top:-50%;opacity:0}15%{opacity:.5}100%{top:120%;opacity:0}}
@keyframes fxBolt{0%,88%,100%{opacity:0}90%,94%{opacity:.85}91%{opacity:.2}}
@keyframes fxGridPulse{0%,100%{opacity:.06}50%{opacity:.14}}
@keyframes fxOrbit{from{transform:rotate(0) translateX(160px) rotate(0)}to{transform:rotate(360deg) translateX(160px) rotate(-360deg)}}
@keyframes fxPulseRing{0%{transform:scale(.4);opacity:.6}100%{transform:scale(2.2);opacity:0}}
.fx-aura{position:absolute;border-radius:50%;filter:blur(70px);animation:fxAura 4.5s ease-in-out infinite;}
.fx-ring{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.5);animation:fxRingExp 5s ease-in-out infinite;}
.fx-particle{position:absolute;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.7);animation:fxFloat 4s ease-in-out infinite;}
.fx-scan{position:absolute;left:0;width:100%;height:3px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);opacity:.5;animation:fxScanMove 6s ease-in-out infinite;}
.fx-beam{position:absolute;top:40%;width:80%;height:50px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);filter:blur(6px);mix-blend-mode:screen;animation:fxBeamSweep 5s ease-in-out infinite;}
.fx-stream{position:absolute;width:3px;height:35%;background:linear-gradient(180deg,transparent,rgba(255,255,255,.6),transparent);animation:fxStreamFall 3s linear infinite;}
.fx-bolt{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.4),transparent 60%);animation:fxBolt 5s steps(1) infinite;}
.fx-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.1) 1px,transparent 1px);background-size:50px 50px;animation:fxGridPulse 8s ease-in-out infinite;}
.fx-orbit{position:absolute;top:50%;left:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 0 10px rgba(255,255,255,.5);animation:fxOrbit 6s linear infinite;}
.fx-pulse-ring{position:absolute;top:calc(50% - 100px);left:calc(50% - 100px);width:200px;height:200px;margin:0;border-radius:50%;border:2px solid rgba(255,255,255,.5);animation:fxPulseRing 3s ease-out infinite;}
/* === cinema 后处理原语库（全帧签名层 z:4，LLM 在 .layer-cinema 内用 <div class="cinema-xxx"> 引用，无需写 CSS）===
   每视频选 1-2 个签名（Cinema 测试：移除效果帧是否丢签名？都不丢→剪）。快速播报可选，非每场景必需。
   情绪→原语：聚焦/收紧→vignette / 胶片质感→grain / 论点落地冲击→lightflash(GSAP 控 opacity 闪) / 暖光签名→halation / 数据失真科技感→aberration。*/
.cinema-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,0.55) 100%);pointer-events:none;}
.cinema-grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>");pointer-events:none;}
.cinema-halation{position:absolute;inset:0;mix-blend-mode:screen;background:radial-gradient(ellipse at 50% 62%,rgba(255,180,90,0.16),transparent 68%);pointer-events:none;}
.cinema-lightflash{position:absolute;inset:0;mix-blend-mode:screen;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(255,228,180,0.55),transparent 62%);pointer-events:none;}
.cinema-aberration{position:absolute;inset:0;filter:drop-shadow(1.5px 0 rgba(255,40,90,0.45)) drop-shadow(-1.5px 0 rgba(40,200,255,0.45));pointer-events:none;}
.pfc-use[class*="grad-"]{background-image:none;-webkit-background-clip:border-box;background-clip:border-box;-webkit-text-fill-color:#f5f5f5;color:#f5f5f5;} /* 全局兜底：胶囊禁 grad clip:text（feedback-bgclip-text-capsule-conflict），SubAgent 误用 grad-* 时强制纯色可见；项目级 .pfc-use.grad-xxx 可覆盖分色 */
.tut-scene{display:flex;flex-direction:column;justify-content:center;align-items:stretch;width:100%;height:100%;} /* 教程横屏：撑满 phase content box（phase padding 管安全区），align-items:stretch 让 region 水平撑满（根治偏右，不缩中间）*/
.tut-grid{width:100%;height:100%;}
/* === LLM 自定义组件层（来自 creative/style.css）=== */

:root {
  --bg-deep: #0F172A;
  --font-title: 'Inter','PingFang SC','Microsoft YaHei',sans-serif;
  --font-body: 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --font-data: 'JetBrains Mono','Consolas',monospace;
  --tut-bg: #0F172A;
  --tut-blue: #3B82F6;
  --tut-green: #10B981;
  --tut-gold: #FBBF24;
  --tut-blue-white: #E0E7FF;
  --tut-gray: #94A3B8;
  --tut-white: rgba(255,255,255,0.92);
}

/* ============================================
 * Tutorial E02 cta 段 — E03 预告 + 合集引导 + 互动（横屏 reveal §6.16）
 * 1 场景：E03 预告 + 合集引导 + 互动问题
 * ============================================ */
.tut-scene {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: center; align-items: stretch;
  gap: 28px;
  padding: 60px 120px;
}
.tut-grid {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: center; align-items: stretch;
  gap: 28px;
}
.tut-region { opacity: 0; will-change: opacity, transform; }
.tut-region[data-reveal="0"] { opacity: 1; }

.grad-gold { background-image: linear-gradient(92deg,#FBBF24 0%,#F59E0B 50%,#FCD34D 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.grad-blue { background-image: linear-gradient(92deg,#60A5FA 0%,#3B82F6 55%,#1E3A8A 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.grad-green { background-image: linear-gradient(92deg,#34D399 0%,#10B981 55%,#047857 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }

/* —— E03 预告卡 —— */
.tut-cta-next {
  border-radius: 22px; padding: 28px 36px;
  border: 2px solid rgba(251,191,36,0.55);
  background: linear-gradient(165deg, rgba(251,191,36,0.10), rgba(15,23,42,0.60));
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  text-align: center;
}
.tut-cta-next .cn-eyebrow {
  font-family: 'Noto Sans SC'; font-size: 32px; font-weight: 700;
  color: var(--tut-blue-white); letter-spacing: 0.20em;
  padding: 6px 24px; border: 1.5px solid rgba(224,231,255,0.35); border-radius: 999px;
}
.tut-cta-next .cn-title {
  font-family: 'Inter'; font-size: 80px; font-weight: 900; line-height: 1.04;
  text-shadow: 0 0 20px rgba(251,191,36,0.30);
}
.tut-cta-next .cn-subtitle {
  font-family: 'Noto Sans SC'; font-size: 38px; font-weight: 700;
  color: var(--tut-white); -webkit-text-fill-color: var(--tut-white);
  text-shadow: 0 2px 10px rgba(0,0,0,0.45);
}
.tut-cta-next .cn-points {
  display: flex; align-items: center; justify-content: center; gap: 18px;
  font-family: 'Noto Sans SC'; font-size: 34px; font-weight: 700;
  color: var(--tut-blue-white); -webkit-text-fill-color: var(--tut-blue-white);
  text-shadow: 0 2px 8px rgba(0,0,0,0.45);
}
.tut-cta-next .cn-pt { display: inline-flex; align-items: center; gap: 8px; }
.tut-cta-next .cn-pt-ico { font-size: 36px; }
.tut-cta-next .cn-pt-sep { color: var(--tut-gray); -webkit-text-fill-color: var(--tut-gray); }
.tut-cta-next .cn-warn {
  font-family: 'Noto Sans SC'; font-size: 32px; font-weight: 600; font-style: italic;
  color: var(--tut-gold); -webkit-text-fill-color: var(--tut-gold);
  text-shadow: 0 2px 8px rgba(0,0,0,0.45);
  padding-top: 4px;
}

/* —— 合集引导 —— */
.tut-cta-series {
  border-radius: 20px; padding: 22px 32px;
  border: 2px solid rgba(59,130,246,0.55);
  background: linear-gradient(165deg, rgba(59,130,246,0.10), rgba(15,23,42,0.60));
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  text-align: center;
}
.tut-cta-series .cs-head {
  font-family: 'Inter'; font-size: 44px; font-weight: 900; letter-spacing: 0.02em;
  text-shadow: 0 0 14px rgba(59,130,246,0.22);
}
.tut-cta-series .cs-from {
  font-family: 'Noto Sans SC'; font-size: 34px; font-weight: 600;
  color: var(--tut-blue-white); -webkit-text-fill-color: var(--tut-blue-white);
  text-shadow: 0 2px 8px rgba(0,0,0,0.45);
}
.tut-cta-series .cs-actions {
  display: flex; align-items: center; justify-content: center; gap: 22px;
  font-family: 'Noto Sans SC'; font-size: 34px; font-weight: 700;
  flex-wrap: wrap;
}
.tut-cta-series .cs-act {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 8px 22px; border-radius: 999px;
  border: 1.5px solid;
}
.tut-cta-series .cs-act-follow {
  color: var(--tut-gold); -webkit-text-fill-color: var(--tut-gold);
  border-color: rgba(251,191,36,0.55);
  background: rgba(251,191,36,0.10);
  text-shadow: 0 2px 8px rgba(0,0,0,0.45);
}
.tut-cta-series .cs-act-repo {
  color: var(--tut-blue); -webkit-text-fill-color: var(--tut-blue);
  border-color: rgba(59,130,246,0.55);
  background: rgba(59,130,246,0.10);
  text-shadow: 0 2px 8px rgba(0,0,0,0.45);
}
.tut-cta-series .cs-ico { font-size: 34px; }

/* —— 互动问题 —— */
.tut-cta-question {
  display: flex; align-items: center; justify-content: center; gap: 26px;
  padding: 22px 36px; border-radius: 18px;
  border: 2px solid rgba(16,185,129,0.50);
  background: linear-gradient(90deg, rgba(16,185,129,0.08), rgba(15,23,42,0.50));
}
.tut-cta-question .cq-icon { font-size: 64px; line-height: 1; }
.tut-cta-question .cq-body { display: flex; flex-direction: column; gap: 4px; }
.tut-cta-question .cq-line {
  font-family: 'Inter'; font-size: 42px; font-weight: 900; line-height: 1.25;
  color: var(--tut-white); -webkit-text-fill-color: var(--tut-white);
  text-shadow: 0 2px 10px rgba(0,0,0,0.45);
}
.tut-cta-question .cq-hl { font-size: 46px; }
.tut-cta-question .cq-tail {
  font-family: 'Noto Sans SC'; font-size: 34px; font-weight: 600; font-style: italic;
  color: var(--tut-blue-white); -webkit-text-fill-color: var(--tut-blue-white);
  text-shadow: 0 2px 8px rgba(0,0,0,0.45);
  padding-top: 4px;
}
/* === bg 组件 @keyframes（自动注入，来自 components/bg/）=== */
@keyframes gridDotBreath {
  0%, 100% { opacity: 0.06; }

}

@keyframes shapeFloat {

}
@keyframes shapeFloat2 {

@keyframes slateVignette {

}
@keyframes cornerLineGlow {

  50% { opacity: 0.20; }
}
@keyframes bluePulse {
  0%, 100% { opacity: 0.20; }
  50% { opacity: 0.35; }
}
</style>
