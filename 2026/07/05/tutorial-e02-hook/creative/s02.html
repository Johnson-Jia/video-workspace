<!-- 场景: seg2 | 时长: ~10s | bg: clean_slate | 转折：转型起手 + 5 原理预告 -->
<div class="layer-bg">
  <!-- bg-component: clean_slate -->
</div>

<div class="layer-fx">
  <!-- fx-aura 蓝色静态光晕（脉冲呼吸，禁划过类 fx-scan/fx-beam） -->
  <div class="fx-pulse" style="position:absolute;top:32%;left:50%;transform:translateX(-50%);width:900px;height:340px;border-radius:50%;background:radial-gradient(ellipse, hsla(215,70%,52%,0.20) 0%, transparent 65%);filter:blur(50px);opacity:0.7"></div>
  <!-- fx-blink 锚点（平衡构图） -->
  <div class="fx-blink" style="position:absolute;top:20%;left:20%;width:12px;height:12px;border-radius:50%;background:hsla(215,75%,62%,0.85);box-shadow:0 0 16px hsla(215,70%,56%,0.55)"></div>
  <div class="fx-blink" style="position:absolute;bottom:26%;right:22%;width:10px;height:10px;border-radius:50%;background:hsla(215,70%,60%,0.75);box-shadow:0 0 14px hsla(215,65%,54%,0.5)"></div>
</div>

<div class="layer-content">
<div class="phase phase-1 tut-scene">  <!-- 教程模式：单 phase + 多 region + data-reveal（不切 phase） -->
  <div class="tut-grid tut-transition-scene">

    <!-- 区域 1：转折大字（data-reveal=0，承接反常识给指引） -->
    <div class="tut-region tut-transition" data-reveal="0" data-reveal-dir="fade">
      <div class="trans-eyebrow">差别在哪</div>
      <h1 class="trans-big grad-blue">转型起手 · 不是上工具</h1>
      <div class="trans-sub">先过这一关：<span class="ts-tag">思想转变</span> + <span class="ts-tag">5 条 AI 原理</span></div>
    </div>

    <!-- 区域 2：5 原理缩略胶囊（data-reveal=5，本集结构预告） -->
    <div class="tut-region tut-principles" data-reveal="5" data-reveal-dir="top">
      <span class="pr-pill">① token 预测</span>
      <span class="pr-pill">② 上下文 1M</span>
      <span class="pr-pill">③ Agent</span>
      <span class="pr-pill">④ REACT</span>
      <span class="pr-pill">⑤ 精准指令</span>
    </div>

  </div>
</div>
</div>

<div class="layer-cinema">
  <!-- 教程类克制，无 cinema 后处理签名 -->
</div>
