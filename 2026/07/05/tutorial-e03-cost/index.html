/* === ClipForge 基础层（自动生成，勿手改）=== */
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;color:#fff;overflow:hidden;width:1920px;height:1080px;}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;}
.clip{position:absolute;top:0;left:0;width:1920px;height:1080px;overflow:hidden;}
.layer-bg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;}
.layer-fx{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none;}
.layer-content{position:relative;z-index:3;height:100%;color:#fff;font-size:48px;}
.layer-cinema{position:absolute;top:0;left:0;width:100%;height:100%;z-index:4;pointer-events:none;}
.phase{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 120px 60px 120px;opacity:0;}
.phase:first-child{opacity:1;}
/* 兜底：.phase 内文本居中容器的直接块级子元素水平居中（根治 max-width 块缺 margin:0 auto 导致整块偏左；text-align 只居中行内内容不居中块盒子）*/
.phase [style*="text-align:center"] > div,.phase [style*="text-align: center"] > div{margin-left:auto;margin-right:auto;}
audio{display:none;}
.fx-glow{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;}
.fx-line{position:absolute;height:1px;pointer-events:none;}
.fx-dot{position:absolute;border-radius:50%;pointer-events:none;}
/* === fx 原语库（CSS animation 循环态，0%帧可见/移动型，HyperFrames 安全）===
   LLM 在 .layer-fx 内用 <div class="fx-xxx"> 直接引用，无需写 CSS；
   颜色默认半透明白，可 inline 覆盖（style="background:var(--accent-warm)"）。
   情绪→原语：ambient→aura / focus→ring,pulse-ring / calm→particle / tech→scan,stream,grid /
   climax→beam / shock→bolt / energy→orbit。R-R-008 要求 ≥2 种不同 fx class。 */
@keyframes fxAura{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.8;transform:scale(1.1)}}
@keyframes fxRingExp{0%,100%{opacity:.3;transform:scale(.92)}50%{opacity:.65;transform:scale(1.25)}}
@keyframes fxFloat{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-22px);opacity:1}}
@keyframes fxScanMove{0%,100%{top:18%}50%{top:82%}}
@keyframes fxBeamSweep{0%{left:-60%;opacity:0}10%,90%{opacity:.6}50%{left:50%}100%{left:120%;opacity:0}}
@keyframes fxStreamFall{0%{top:-50%;opacity:0}15%{opacity:.5}100%{top:120%;opacity:0}}
@keyframes fxBolt{0%,88%,100%{opacity:0}90%,94%{opacity:.85}91%{opacity:.2}}
@keyframes fxGridPulse{0%,100%{opacity:.06}50%{opacity:.14}}
@keyframes fxOrbit{from{transform:rotate(0) translateX(160px) rotate(0)}to{transform:rotate(360deg) translateX(160px) rotate(-360deg)}}
@keyframes fxPulseRing{0%{transform:scale(.4);opacity:.6}100%{transform:scale(2.2);opacity:0}}
.fx-aura{position:absolute;border-radius:50%;filter:blur(70px);animation:fxAura 4.5s ease-in-out infinite;}
.fx-ring{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.5);animation:fxRingExp 5s ease-in-out infinite;}
.fx-particle{position:absolute;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.7);animation:fxFloat 4s ease-in-out infinite;}
.fx-scan{position:absolute;left:0;width:100%;height:3px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);opacity:.5;animation:fxScanMove 6s ease-in-out infinite;}
.fx-beam{position:absolute;top:40%;width:80%;height:50px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);filter:blur(6px);mix-blend-mode:screen;animation:fxBeamSweep 5s ease-in-out infinite;}
.fx-stream{position:absolute;width:3px;height:35%;background:linear-gradient(180deg,transparent,rgba(255,255,255,.6),transparent);animation:fxStreamFall 3s linear infinite;}
.fx-bolt{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.4),transparent 60%);animation:fxBolt 5s steps(1) infinite;}
.fx-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.1) 1px,transparent 1px);background-size:50px 50px;animation:fxGridPulse 8s ease-in-out infinite;}
.fx-orbit{position:absolute;top:50%;left:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 0 10px rgba(255,255,255,.5);animation:fxOrbit 6s linear infinite;}
.fx-pulse-ring{position:absolute;top:calc(50% - 100px);left:calc(50% - 100px);width:200px;height:200px;margin:0;border-radius:50%;border:2px solid rgba(255,255,255,.5);animation:fxPulseRing 3s ease-out infinite;}
/* === cinema 后处理原语库（全帧签名层 z:4，LLM 在 .layer-cinema 内用 <div class="cinema-xxx"> 引用，无需写 CSS）===
   每视频选 1-2 个签名（Cinema 测试：移除效果帧是否丢签名？都不丢→剪）。快速播报可选，非每场景必需。
   情绪→原语：聚焦/收紧→vignette / 胶片质感→grain / 论点落地冲击→lightflash(GSAP 控 opacity 闪) / 暖光签名→halation / 数据失真科技感→aberration。*/
.cinema-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,0.55) 100%);pointer-events:none;}
.cinema-grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>");pointer-events:none;}
.cinema-halation{position:absolute;inset:0;mix-blend-mode:screen;background:radial-gradient(ellipse at 50% 62%,rgba(255,180,90,0.16),transparent 68%);pointer-events:none;}
.cinema-lightflash{position:absolute;inset:0;mix-blend-mode:screen;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(255,228,180,0.55),transparent 62%);pointer-events:none;}
.cinema-aberration{position:absolute;inset:0;filter:drop-shadow(1.5px 0 rgba(255,40,90,0.45)) drop-shadow(-1.5px 0 rgba(40,200,255,0.45));pointer-events:none;}
.pfc-use[class*="grad-"]{background-image:none;-webkit-background-clip:border-box;background-clip:border-box;-webkit-text-fill-color:#f5f5f5;color:#f5f5f5;} /* 全局兜底：胶囊禁 grad clip:text（feedback-bgclip-text-capsule-conflict），SubAgent 误用 grad-* 时强制纯色可见；项目级 .pfc-use.grad-xxx 可覆盖分色 */
.tut-scene{display:flex;flex-direction:column;justify-content:center;align-items:stretch;width:100%;height:100%;} /* 教程横屏：撑满 phase content box（phase padding 管安全区），align-items:stretch 让 region 水平撑满（根治偏右，不缩中间）*/
.tut-grid{width:100%;height:100%;}
/* === LLM 自定义组件层（来自 creative/style.css）=== */

:root {
  --bg-deep: #0F172A;
  --font-title: 'Inter','PingFang SC','Microsoft YaHei',sans-serif;
  --font-body: 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --font-data: 'JetBrains Mono','Consolas',monospace;
  --tut-bg: #0F172A;
  --tut-blue: #3B82F6;
  --tut-purple: #A78BFA;
  --tut-orange: #FB923C;
  --tut-green: #10B981;
  --tut-gold: #FBBF24;
  --tut-blue-white: #E0E7FF;
  --tut-white: rgba(255,255,255,0.90);
}

/* ============================================
 * Tutorial E03 段2 — 预算 4 块成本（横屏 reveal §6.16）
 * 1 场景 + 标题 + 2×2 成本卡 grid + 总投入收束
 * ============================================ */
.tut-scene {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: center; align-items: stretch;
  gap: 14px;
  padding: 50px 100px 40px;
}
.tut-grid {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: center; align-items: stretch;
  gap: 14px;
}
.tut-region { opacity: 0; will-change: opacity, transform; }
.tut-region[data-reveal="0"] { opacity: 1; }

/* —— 渐变文字工具 —— */
.grad-blue { background-image: linear-gradient(92deg,#60A5FA 0%,#3B82F6 55%,#93C5FD 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.grad-purple { background-image: linear-gradient(92deg,#C4B5FD 0%,#A78BFA 55%,#7C3AED 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.grad-orange { background-image: linear-gradient(92deg,#FDBA74 0%,#FB923C 55%,#C2410C 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.grad-green { background-image: linear-gradient(92deg,#34D399 0%,#10B981 55%,#6EE7B7 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.grad-gold { background-image: linear-gradient(92deg,#FDE68A 0%,#FBBF24 55%,#FCD34D 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.grad-gold-bg-inline {
  display: inline-block;
  background-image: linear-gradient(92deg,#FBBF24 0%,#D97706 100%);
  color: #FFF; -webkit-text-fill-color: #FFF;
  padding: 4px 18px; border-radius: 8px;
  font-family: 'JetBrains Mono';
}

/* —— 标题区 —— */
.tut-cost-title { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.tut-cost-title .mt-num {
  font-family: 'JetBrains Mono'; font-size: 36px; font-weight: 800;
  letter-spacing: 0.10em;
  box-shadow: 0 4px 14px rgba(251,191,36,0.30);
}
.tut-cost-title .mt-h1 {
  font-family: 'Inter'; font-size: 64px; font-weight: 900; line-height: 1.04;
  background-image: linear-gradient(92deg,#FBBF24 0%,#FDE68A 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
}
.tut-cost-title .title-sub {
  font-family: 'Noto Sans SC'; font-size: 32px; font-weight: 600;
  color: var(--tut-blue-white); letter-spacing: 0.06em;
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
}

/* —— 2×2 成本卡 grid —— */
.tut-cost-grid { width: 100%; }
.cost-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 18px;
  width: 100%;
}
.cost-card {
  position: relative;
  border-radius: 22px;
  padding: 20px 28px;
  border: 2.5px solid;
  display: flex; flex-direction: column; gap: 10px;
  background: linear-gradient(165deg, rgba(15,23,42,0.88), rgba(15,23,42,0.85));
}
.cost-tools { border-color: rgba(59,130,246,0.60); background: linear-gradient(165deg, rgba(59,130,246,0.12), rgba(15,23,42,0.88)); }
.cost-train { border-color: rgba(167,139,250,0.60); background: linear-gradient(165deg, rgba(167,139,250,0.12), rgba(15,23,42,0.88)); }
.cost-infra { border-color: rgba(251,146,60,0.60); background: linear-gradient(165deg, rgba(251,146,60,0.12), rgba(15,23,42,0.88)); }
.cost-promo { border-color: rgba(16,185,129,0.60); background: linear-gradient(165deg, rgba(16,185,129,0.12), rgba(15,23,42,0.88)); }

.cost-head {
  display: flex; align-items: center; gap: 16px;
}
.cost-num {
  font-family: 'JetBrains Mono'; font-size: 44px; font-weight: 900;
  min-width: 56px; line-height: 1;
}
.cost-num-blue { color: var(--tut-blue); text-shadow: 0 2px 6px rgba(30,41,59,0.08); }
.cost-num-purple { color: var(--tut-purple); text-shadow: 0 2px 6px rgba(30,41,59,0.08); }
.cost-num-orange { color: var(--tut-orange); text-shadow: 0 2px 6px rgba(30,41,59,0.08); }
.cost-num-green { color: var(--tut-green); text-shadow: 0 2px 6px rgba(30,41,59,0.08); }
.cost-name {
  font-family: 'Inter'; font-size: 42px; font-weight: 900; letter-spacing: 0.02em;
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
}
.cost-formula {
  font-family: 'JetBrains Mono'; font-size: 34px; font-weight: 700;
  color: var(--tut-blue-white);
  padding: 8px 16px; border-radius: 10px;
  background: rgba(255,255,255,0.05);
  border: 1.5px solid rgba(255,255,255,0.10);
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
  letter-spacing: 0.02em;
}
.cost-items { display: flex; flex-direction: column; gap: 6px; }
.cost-item {
  font-family: 'Noto Sans SC'; font-size: 32px; font-weight: 600; color: var(--tut-white);
  display: flex; align-items: center; gap: 12px; line-height: 1.3;
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
}
.ci-mark { font-size: 32px; min-width: 36px; }
.ci-dot-blue { color: var(--tut-blue); }
.ci-dot-purple { color: var(--tut-purple); }
.ci-dot-orange { color: var(--tut-orange); }
.ci-dot-green { color: var(--tut-green); }

/* —— ③ 内联徽标「小团队可跳过」 —— */
.cost-badge {
  margin-left: auto;
  font-family: 'JetBrains Mono'; font-size: 32px; font-weight: 800;
  padding: 4px 14px; border-radius: 10px;
  background: linear-gradient(92deg,#FBBF24,#D97706);
  color: #FFF; -webkit-text-fill-color: #FFF;
  box-shadow: 0 4px 12px rgba(251,191,36,0.40);
  letter-spacing: 0.04em;
  white-space: nowrap;
}

/* —— 总投入收束 —— */
.tut-cost-sum {
  border-radius: 22px; padding: 16px 32px;
  border: 2.5px solid rgba(251,191,36,0.55);
  background: linear-gradient(90deg, rgba(251,191,36,0.10), rgba(15,23,42,0.88));
  display: flex; align-items: center; justify-content: center;
}
.sum-line {
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap; justify-content: center;
  font-family: 'Inter'; font-weight: 900;
}
.sum-side {
  font-family: 'Noto Sans SC'; font-size: 36px; font-weight: 700; color: var(--tut-white);
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
}
.sum-eq {
  font-family: 'JetBrains Mono'; font-size: 48px; font-weight: 900; color: var(--tut-gold);
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
}
.sum-total {
  font-size: 56px; line-height: 1;
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
}
/* === bg 组件 @keyframes（自动注入，来自 components/bg/）=== */
@keyframes auroraFlow {
  0%, 100% { transform: translateX(-8%) scaleY(1); }
  50% { transform: translateX(8%) scaleY(1.12); }
}
@keyframes auroraCurtain {
  0%, 100% { transform: scaleY(1) translateY(0); opacity: 0.5; }
  50% { transform: scaleY(1.15) translateY(-10px); opacity: 0.8; }
}
@keyframes glassShimmer {
  0%, 100% { opacity: 0.15; }
  50% { opacity: 0.20; }
}
@keyframes starTwinkle {
  0%, 100% { opacity: 0.35; }
  50% { opacity: 0.55; }
}
</style>

<div style="position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.02) 0%,transparent 40%,rgba(255,255,255,0.03) 60%,transparent 100%);
  animation:glassShimmer 9s ease-in-out infinite"></div>

<div style="position:absolute;bottom:10%;left:-10%;width:120%;height:160px;opacity:0.15;
  background:linear-gradient(90deg,transparent,hsla(150,60%,50%,0.4),hsla(180,50%,45%,0.3),hsla(280,40%,45%,0.4),transparent);
  filter:blur(60px)"></div>
</div>

<div class="layer-fx">
  <!-- fx-aura 多色静态光晕（蓝工具 / 紫培训 / 橙基础设施 / 绿推广；脉冲呼吸，禁划过类） -->
  <div class="fx-pulse" style="position:absolute;top:30%;left:24%;width:520px;height:280px;border-radius:50%;background:radial-gradient(ellipse, hsla(215,75%,58%,0.16) 0%, transparent 65%);filter:blur(50px);opacity:0.7"></div>
  <div class="fx-pulse" style="position:absolute;top:30%;right:24%;width:520px;height:280px;border-radius:50%;background:radial-gradient(ellipse, hsla(255,70%,72%,0.14) 0%, transparent 65%);filter:blur(50px);opacity:0.7"></div>
  <div class="fx-pulse" style="position:absolute;top:62%;left:24%;width:520px;height:280px;border-radius:50%;background:radial-gradient(ellipse, hsla(28,95%,62%,0.14) 0%, transparent 65%);filter:blur(50px);opacity:0.7"></div>
  <div class="fx-pulse" style="position:absolute;top:62%;right:24%;width:520px;height:280px;border-radius:50%;background:radial-gradient(ellipse, hsla(150,60%,52%,0.14) 0%, transparent 65%);filter:blur(50px);opacity:0.7"></div>
  <!-- fx-blink 锚点（平衡构图） -->
  <div class="fx-blink" style="position:absolute;top:13%;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:hsla(43,90%,62%,0.22);box-shadow:0 0 16px hsla(43,85%,56%,0.22)"></div>
  <div class="fx-blink" style="position:absolute;top:30%;left:12%;width:10px;height:10px;border-radius:50%;background:hsla(215,75%,60%,0.75);box-shadow:0 0 14px hsla(215,70%,54%,0.5)"></div>
  <div class="fx-blink" style="position:absolute;top:30%;right:12%;width:10px;height:10px;border-radius:50%;background:hsla(255,70%,68%,0.75);box-shadow:0 0 14px hsla(255,65%,62%,0.5)"></div>
  <div class="fx-blink" style="position:absolute;top:62%;left:12%;width:10px;height:10px;border-radius:50%;background:hsla(28,95%,60%,0.22);box-shadow:0 0 14px hsla(28,90%,54%,0.22)"></div>
  <div class="fx-blink" style="position:absolute;top:62%;right:12%;width:10px;height:10px;border-radius:50%;background:hsla(150,65%,58%,0.75);box-shadow:0 0 14px hsla(150,60%,52%,0.5)"></div>
</div>

<div class="layer-content">
<div class="phase phase-1 tut-scene">  <!-- 教程模式：1 场景 + 5 region + data-reveal（不切 phase） -->
  <div class="tut-grid">

    <!-- 区域 1：标题（data-reveal=0，dir=fade） -->
    <div class="tut-region tut-cost-title" data-reveal="0" data-reveal-dir="fade">
      <div class="mt-num grad-gold-bg-inline">预算</div>
      <h1 class="mt-h1">4 块成本</h1>
      <div class="title-sub">立项要算清要多少钱</div>
    </div>

    <!-- 区域 2：成本卡①工具/API（data-reveal=4，dir=left） -->
    <div class="tut-region tut-cost-grid" data-reveal="4" data-reveal-dir="left">
      <div class="cost-grid">
        <div class="cost-card cost-tools">
          <div class="cost-head">
            <span class="cost-num cost-num-blue">①</span>
            <span class="cost-name grad-blue">工具 / API</span>
          </div>
          <div class="cost-formula">人均月费 × 人数 × 月数</div>
          <div class="cost-items">
            <div class="cost-item"><span class="ci-mark ci-dot-blue">●</span>Claude Code 订阅</div>
            <div class="cost-item"><span class="ci-mark ci-dot-blue">●</span>模型调用计费</div>
          </div>
        </div>

        <div class="cost-card cost-train">
          <div class="cost-head">
            <span class="cost-num cost-num-purple">②</span>
            <span class="cost-name grad-purple">培训</span>
          </div>
          <div class="cost-formula">2 天全员脱产 + 讲师</div>
          <div class="cost-items">
            <div class="cost-item"><span class="ci-mark ci-dot-purple">●</span>工时成本</div>
            <div class="cost-item"><span class="ci-mark ci-dot-purple">●</span>讲师费用</div>
          </div>
        </div>

        <div class="cost-card cost-infra">
          <div class="cost-head">
            <span class="cost-num cost-num-orange">③</span>
            <span class="cost-name grad-orange">基础设施</span>
            <span class="cost-badge">小团队可跳过</span>
          </div>
          <div class="cost-formula">大团队才需要</div>
          <div class="cost-items">
            <div class="cost-item"><span class="ci-mark ci-dot-orange">●</span>RAG / 知识图谱服务器</div>
            <div class="cost-item"><span class="ci-mark ci-dot-orange">●</span>架构师人力</div>
          </div>
        </div>

        <div class="cost-card cost-promo">
          <div class="cost-head">
            <span class="cost-num cost-num-green">④</span>
            <span class="cost-name grad-green">推广运营</span>
          </div>
          <div class="cost-formula">轻量 · 持续</div>
          <div class="cost-items">
            <div class="cost-item"><span class="ci-mark ci-dot-green">●</span>度量工具</div>
            <div class="cost-item"><span class="ci-mark ci-dot-green">●</span>试点激励 · 考核绑定</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 区域 3：收束「四块 = 总投入」（data-reveal=26，dir=top） -->
    <div class="tut-region tut-cost-sum" data-reveal="26" data-reveal-dir="top">
      <div class="sum-line">
        <span class="sum-side">工具 + 培训 + 基础设施 + 推广</span>
        <span class="sum-eq">=</span>
        <span class="grad-gold sum-total">总投入</span>
      </div>
    </div>

  </div>
</div>
</div>

<div class="layer-cinema">
  <!-- 教程类克制，无 cinema 后处理签名 -->
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
var tl = gsap.timeline({ paused: true });
const EASE={standard:'power2.out',tension:'back.out(1.4)',resolve:'power3.out',ambient:'sine.inOut'}; // 运动预设 motion-presets.md，禁裸 linear/power0
tl.set('#s01', {opacity:1}, 0);
tl.to('#s01 [data-reveal="0"]', {opacity:1,duration:0.5}, 0.00);
tl.fromTo('#s01 [data-reveal="4"]', {opacity:0,x:-40}, {opacity:1,x:0,duration:0.5}, 4.00);
tl.fromTo('#s01 [data-reveal="26"]', {opacity:0,y:-40}, {opacity:1,y:0,duration:0.5}, 26.00);
tl.to('#s01 .fx-blink', {opacity:0.25,duration:1.6,repeat:20,yoyo:true,ease:'sine.inOut'}, 0.00);
tl.to('#s01 .fx-pulse', {scale:1.18,duration:2.4,repeat:13,yoyo:true,ease:'sine.inOut'}, 0.00);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
window.__hf={duration:34.30,seek:function(ms){tl.seek(ms/1000);}};
</script>
