<div class="layer-bg" style="--domain-color:#00D4FF;--domain-glow:rgba(0,212,255,0.22)">

  <div style="position:absolute;inset:0;background-image:linear-gradient(rgba(0,212,255,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.06) 1px,transparent 1px);background-size:80px 80px;animation:gridPulse 6s ease-in-out infinite"></div>
  <div style="position:absolute;left:0;width:100%;height:3px;top:0;background:linear-gradient(90deg,transparent,rgba(0,212,255,0.35),rgba(0,212,255,0.5),rgba(0,212,255,0.35),transparent);box-shadow:0 0 20px rgba(0,212,255,0.3);animation:scanLine 8s linear infinite"></div>

  <div style="position:absolute;top:30%;left:40%;width:12px;height:12px;border-radius:50%;background:rgba(0,212,255,0.9);box-shadow:0 0 14px rgba(0,212,255,0.7);animation:gridNodeBlink 3s ease-in-out infinite"></div>
  <div style="position:absolute;top:65%;left:62%;width:10px;height:10px;border-radius:50%;background:rgba(0,229,160,0.85);box-shadow:0 0 12px rgba(0,229,160,0.6);animation:gridNodeBlink 4s ease-in-out infinite 1s"></div>
</div>
<div class="layer-fx">

  <div style="position:absolute;top:0;left:68%;width:1.5px;height:100%;background:linear-gradient(transparent 20%,rgba(0,229,160,0.3) 50%,transparent 80%);animation:beamBreath 8s ease-in-out infinite 3s"></div>
  <!-- fx 2: 数据节点闪烁 -->
  <div class="fx-dot fx-pulse" style="position:absolute;top:22%;left:18%;width:10px;height:10px;border-radius:50%;background:#00D4FF;box-shadow:0 0 18px #00D4FF;animation:annotationPulse 4s ease-in-out infinite"></div>
  <div class="fx-dot fx-drift" style="position:absolute;top:78%;left:85%;width:8px;height:8px;border-radius:50%;background:#00E5A0;box-shadow:0 0 16px #00E5A0;animation:annotationPulse 5s ease-in-out infinite 1.5s"></div>
