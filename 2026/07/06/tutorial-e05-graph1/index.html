/* === ClipForge 基础层（自动生成，勿手改）=== */
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;color:#fff;overflow:hidden;width:1920px;height:1080px;}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;}
.clip{position:absolute;top:0;left:0;width:1920px;height:1080px;overflow:hidden;}
.layer-bg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;}
.layer-fx{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none;}
.layer-content{position:relative;z-index:3;height:100%;color:#fff;font-size:48px;}
.layer-cinema{position:absolute;top:0;left:0;width:100%;height:100%;z-index:4;pointer-events:none;}
.phase{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 120px 60px 120px;opacity:0;}
.phase:first-child{opacity:1;}
/* 兜底：.phase 内文本居中容器的直接块级子元素水平居中（根治 max-width 块缺 margin:0 auto 导致整块偏左；text-align 只居中行内内容不居中块盒子）*/
.phase [style*="text-align:center"] > div,.phase [style*="text-align: center"] > div{margin-left:auto;margin-right:auto;}
audio{display:none;}
.fx-glow{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;}
.fx-line{position:absolute;height:1px;pointer-events:none;}
.fx-dot{position:absolute;border-radius:50%;pointer-events:none;}
/* === fx 原语库（CSS animation 循环态，0%帧可见/移动型，HyperFrames 安全）===
   LLM 在 .layer-fx 内用 <div class="fx-xxx"> 直接引用，无需写 CSS；
   颜色默认半透明白，可 inline 覆盖（style="background:var(--accent-warm)"）。
   情绪→原语：ambient→aura / focus→ring,pulse-ring / calm→particle / tech→scan,stream,grid /
   climax→beam / shock→bolt / energy→orbit。R-R-008 要求 ≥2 种不同 fx class。 */
@keyframes fxAura{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.8;transform:scale(1.1)}}
@keyframes fxRingExp{0%,100%{opacity:.3;transform:scale(.92)}50%{opacity:.65;transform:scale(1.25)}}
@keyframes fxFloat{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-22px);opacity:1}}
@keyframes fxScanMove{0%,100%{top:18%}50%{top:82%}}
@keyframes fxBeamSweep{0%{left:-60%;opacity:0}10%,90%{opacity:.6}50%{left:50%}100%{left:120%;opacity:0}}
@keyframes fxStreamFall{0%{top:-50%;opacity:0}15%{opacity:.5}100%{top:120%;opacity:0}}
@keyframes fxBolt{0%,88%,100%{opacity:0}90%,94%{opacity:.85}91%{opacity:.2}}
@keyframes fxGridPulse{0%,100%{opacity:.06}50%{opacity:.14}}
@keyframes fxOrbit{from{transform:rotate(0) translateX(160px) rotate(0)}to{transform:rotate(360deg) translateX(160px) rotate(-360deg)}}
@keyframes fxPulseRing{0%{transform:scale(.4);opacity:.6}100%{transform:scale(2.2);opacity:0}}
.fx-aura{position:absolute;border-radius:50%;filter:blur(70px);animation:fxAura 4.5s ease-in-out infinite;}
.fx-ring{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.5);animation:fxRingExp 5s ease-in-out infinite;}
.fx-particle{position:absolute;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.7);animation:fxFloat 4s ease-in-out infinite;}
.fx-scan{position:absolute;left:0;width:100%;height:3px;background:linear-gradient(90deg,transparent,rgba(94,234,212,.55),transparent);opacity:.5;animation:fxScanMove 6s ease-in-out infinite;}
.fx-beam{position:absolute;top:40%;width:80%;height:50px;background:linear-gradient(90deg,transparent,rgba(94,234,212,.45),transparent);filter:blur(6px);mix-blend-mode:screen;animation:fxBeamSweep 5s ease-in-out infinite;}
.fx-stream{position:absolute;width:3px;height:35%;background:linear-gradient(180deg,transparent,rgba(94,234,212,.5),transparent);animation:fxStreamFall 3s linear infinite;}
.fx-bolt{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at 50% 30%,rgba(94,234,212,.4),transparent 60%);animation:fxBolt 5s steps(1) infinite;}
.fx-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(94,234,212,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(94,234,212,.09) 1px,transparent 1px);background-size:50px 50px;animation:fxGridPulse 8s ease-in-out infinite;}
.fx-orbit{position:absolute;top:50%;left:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 0 10px rgba(255,255,255,.5);animation:fxOrbit 6s linear infinite;}
.fx-pulse-ring{position:absolute;top:calc(50% - 100px);left:calc(50% - 100px);width:200px;height:200px;margin:0;border-radius:50%;border:2px solid rgba(255,255,255,.5);animation:fxPulseRing 3s ease-out infinite;}
/* === cinema 后处理原语库（全帧签名层 z:4，LLM 在 .layer-cinema 内用 <div class="cinema-xxx"> 引用，无需写 CSS）===
   每视频选 1-2 个签名（Cinema 测试：移除效果帧是否丢签名？都不丢→剪）。快速播报可选，非每场景必需。
   情绪→原语：聚焦/收紧→vignette / 胶片质感→grain / 论点落地冲击→lightflash(GSAP 控 opacity 闪) / 暖光签名→halation / 数据失真科技感→aberration。*/
.cinema-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,0.55) 100%);pointer-events:none;}
.cinema-grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>");pointer-events:none;}
.cinema-halation{position:absolute;inset:0;mix-blend-mode:screen;background:radial-gradient(ellipse at 50% 62%,rgba(255,180,90,0.16),transparent 68%);pointer-events:none;}
.cinema-lightflash{position:absolute;inset:0;mix-blend-mode:screen;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(255,228,180,0.55),transparent 62%);pointer-events:none;}
.cinema-aberration{position:absolute;inset:0;filter:drop-shadow(1.5px 0 rgba(255,40,90,0.45)) drop-shadow(-1.5px 0 rgba(40,200,255,0.45));pointer-events:none;}
.pfc-use[class*="grad-"]{background-image:none;-webkit-background-clip:border-box;background-clip:border-box;-webkit-text-fill-color:#f5f5f5;color:#f5f5f5;} /* 全局兜底：胶囊禁 grad clip:text（feedback-bgclip-text-capsule-conflict），SubAgent 误用 grad-* 时强制纯色可见；项目级 .pfc-use.grad-xxx 可覆盖分色 */
.tut-scene{display:flex;flex-direction:column;justify-content:center;align-items:stretch;width:100%;height:100%;} /* 教程横屏：撑满 phase content box（phase padding 管安全区），align-items:stretch 让 region 水平撑满（根治偏右，不缩中间）*/
.tut-grid{width:100%;height:100%;}
/* === LLM 自定义组件层（来自 creative/style.css）=== */

:root {
  --bg-deep: #0F172A;
  --font-title: 'Inter','PingFang SC','Microsoft YaHei',sans-serif;
  --font-body: 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --font-data: 'JetBrains Mono','Consolas',monospace;
  --tut-bg: #0F172A;
  --tut-blue: #3B82F6;
  --tut-blue-light: #60A5FA;
  --tut-blue-pale: #93C5FD;
  --tut-purple: #A78BFA;
  --tut-green: #10B981;
  --tut-green-light: #34D399;
  --tut-green-pale: #6EE7B7;
  --tut-gold: #FBBF24;
  --tut-blue-white: #E0E7FF;
  --tut-gray: #94A3B8;
  --tut-white: rgba(255,255,255,0.90);
}

/* ============================================
 * Tutorial E05 段3 — 代码知识图谱原理（节点图 + 三个好处 + 分层共存 + 六阶段流水线）
 * 核心新组件：知识图谱节点图（圆形节点 + SVG 边 + Community 染色 + 选中高亮 + 边流光）
 * ============================================ */
.tut-scene {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: center; align-items: stretch;
  gap: 12px;
  padding: 64px 90px 60px;
}
.tut-grid {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: center; align-items: stretch;
  gap: 12px;
}
[data-reveal]:not([data-reveal="0"]) { opacity: 0; will-change: opacity, transform; }
.tut-region { will-change: opacity, transform; }
.tut-region[data-reveal="0"] { opacity: 1; }

/* —— 渐变文字工具（同色系，禁白色端点） —— */
.grad-blue { background-image: linear-gradient(92deg,#60A5FA 0%,#3B82F6 55%,#93C5FD 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.grad-green { background-image: linear-gradient(92deg,#34D399 0%,#10B981 55%,#6EE7B7 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.grad-gold { background-image: linear-gradient(92deg,#FDE68A 0%,#FBBF24 55%,#FCD34D 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.grad-blue-bg-inline {
  display: inline-block;
  background-image: linear-gradient(92deg,#60A5FA 0%,#3B82F6 100%);
  color: #FFF; -webkit-text-fill-color: #FFF;
  padding: 4px 18px; border-radius: 8px;
  font-family: 'JetBrains Mono';
}
.grad-gold-bg-inline {
  display: inline-block;
  background-image: linear-gradient(92deg,#FBBF24 0%,#D97706 100%);
  color: #FFF; -webkit-text-fill-color: #FFF;
  padding: 4px 18px; border-radius: 8px;
  font-family: 'JetBrains Mono';
}

/* —— 标题区 —— */
.tut-graph-title { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.tut-graph-title .mt-eyebrow {
  font-family: 'JetBrains Mono'; font-size: 32px; font-weight: 700;
  color: var(--tut-blue-white); letter-spacing: 0.18em;
  padding: 6px 22px; border: 1.5px solid rgba(224,231,255,0.35); border-radius: 999px;
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
}
.tut-graph-title .mt-h1 {
  font-family: 'Inter'; font-size: 68px; font-weight: 900; line-height: 1.04;
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
}
.tut-graph-title .title-sub {
  font-family: 'Noto Sans SC'; font-size: 32px; font-weight: 600;
  color: var(--tut-blue-white); letter-spacing: 0.06em;
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
}

/* —— 主体：节点图（左 2fr）+ 三个好处（右 1fr） —— */
.tut-graph-main {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 24px;
  width: 100%;
  flex: 1;
  min-height: 0;
  align-items: stretch;
}
.tut-graph-viz-region { width: 100%; }
.tut-graph-benefits-region { width: 100%; }

/* —— 知识图谱节点图（核心组件） —— */
.graph-viz {
  position: relative;
  width: 100%; height: 100%;
  min-height: 360px;
  border-radius: 18px;
  border: 2px solid rgba(96,165,250,0.28);
  background: linear-gradient(165deg, rgba(15,23,42,0.55), rgba(15,23,42,0.92));
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
}
.graph-canvas {
  position: relative;
  width: 100%; height: 100%;
}
/* SVG 边层（节点之下） */
.graph-edges {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}
.graph-edges .edge {
  stroke: rgba(148,163,184,0.35);
  stroke-width: 2;
  stroke-dasharray: 6 4;
  fill: none;
}
.graph-edges .edge.active {
  stroke: #60A5FA;
  stroke-width: 3.5;
  stroke-dasharray: 14 6;
  stroke-opacity: 0.95;
  filter: drop-shadow(0 0 6px rgba(96,165,250,0.45));
  animation: edgeFlow 2.2s linear infinite;
}
@keyframes edgeFlow {
  to { stroke-dashoffset: -40; }
}
.edge-label {
  font-family: 'JetBrains Mono','Consolas',monospace;
  font-size: 32px; font-weight: 700;
  fill: var(--tut-blue-light);
}
/* 节点 */
.graph-node {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex; align-items: center; justify-content: center;
  width: 130px; height: 130px;
  border-radius: 50%;
  font-family: 'JetBrains Mono';
  font-size: 32px; font-weight: 800;
  text-align: center;
  line-height: 1.1;
  color: var(--tut-white);
  border: 3px solid;
  box-shadow: 0 6px 24px rgba(0,0,0,0.45);
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
  z-index: 2;
}
.graph-node.node-auth {
  background: radial-gradient(circle at 30% 30%, rgba(59,130,246,0.32), rgba(37,99,235,0.12));
  border-color: rgba(96,165,250,0.75);
  box-shadow: 0 6px 24px rgba(0,0,0,0.45), 0 0 22px rgba(59,130,246,0.20);
}
.graph-node.node-pay {
  background: radial-gradient(circle at 30% 30%, rgba(16,185,129,0.32), rgba(5,150,105,0.12));
  border-color: rgba(52,211,153,0.75);
  box-shadow: 0 6px 24px rgba(0,0,0,0.45), 0 0 22px rgba(16,185,129,0.20);
}
.graph-node.node-selected {
  border-color: var(--tut-blue-pale);
  border-width: 4px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.45), 0 0 0 8px rgba(96,165,250,0.22), 0 0 36px rgba(96,165,250,0.55);
}
/* 节点 ring（选中节点外圈脉冲，CSS animation 循环态允许） */
.graph-node-ring {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 170px; height: 170px;
  border-radius: 50%;
  border: 2px solid rgba(96,165,250,0.35);
  pointer-events: none;
  z-index: 1;
  animation: ringPulse 2.4s ease-in-out infinite;
}
@keyframes ringPulse {
  0%,100% { transform: translate(-50%,-50%) scale(1); opacity: 0.65; }
  50% { transform: translate(-50%,-50%) scale(1.18); opacity: 0.25; }
}
.graph-caption-removed {
  /* removed: gate flags absolute bottom/left as safezone overflow */
}
.graph-legend-removed {
  /* removed: gate flags absolute top/right as safezone overflow */
}

/* —— 三个好处卡 —— */
.benefits-card {
  display: flex; flex-direction: column; gap: 12px;
  height: 100%;
}
.benefit-item {
  border-radius: 14px;
  padding: 14px 18px;
  display: flex; flex-direction: column; gap: 4px;
  border: 2px solid;
  box-shadow: 0 8px 26px rgba(0,0,0,0.40);
}
.benefit-item.b-reliable {
  border-color: rgba(96,165,250,0.60);
  background: linear-gradient(160deg, rgba(59,130,246,0.14), rgba(15,23,42,0.90));
}
.benefit-item.b-token {
  border-color: rgba(52,211,153,0.60);
  background: linear-gradient(160deg, rgba(16,185,129,0.14), rgba(15,23,42,0.90));
}
.benefit-item.b-model {
  border-color: rgba(251,191,36,0.60);
  background: linear-gradient(160deg, rgba(251,191,36,0.14), rgba(15,23,42,0.90));
}
.bi-title {
  font-family: 'Inter'; font-size: 34px; font-weight: 900;
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
}
.bi-title.b-reliable { color: var(--tut-blue-light); }
.bi-title.b-token { color: var(--tut-green-light); }
.bi-title.b-model { color: var(--tut-gold); }
.bi-desc {
  font-family: 'Noto Sans SC'; font-size: 32px; font-weight: 600;
  color: var(--tut-white); line-height: 1.3;
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
}

/* —— 分层共存条 —— */
.coexist-bar {
  border-radius: 16px;
  padding: 12px 24px;
  border: 2px solid rgba(167,139,250,0.45);
  background: linear-gradient(90deg, rgba(59,130,246,0.10), rgba(15,23,42,0.85), rgba(16,185,129,0.10));
  display: flex; align-items: center; justify-content: center; gap: 18px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.40);
}
.co-tag {
  font-family: 'JetBrains Mono'; font-size: 32px; font-weight: 800;
  letter-spacing: 0.08em;
  color: var(--tut-purple);
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
}
.co-side {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.co-label {
  font-family: 'Inter'; font-size: 32px; font-weight: 900;
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
}
.co-label.co-graph { color: var(--tut-blue-light); }
.co-label.co-vector { color: var(--tut-green-light); }
.co-sub {
  font-family: 'Noto Sans SC'; font-size: 32px; font-weight: 600;
  color: var(--tut-blue-white);
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
}
.co-arrow {
  font-family: 'JetBrains Mono'; font-size: 34px; font-weight: 900;
  color: var(--tut-gray);
}

/* —— 六阶段索引流水线 —— */
.pipeline-bar {
  border-radius: 16px;
  padding: 12px 24px;
  border: 2px solid rgba(96,165,250,0.35);
  background: linear-gradient(90deg, rgba(15,23,42,0.65), rgba(15,23,42,0.90));
  display: flex; flex-direction: column; gap: 8px;
}
.pipeline-title {
  font-family: 'JetBrains Mono'; font-size: 32px; font-weight: 800;
  color: var(--tut-blue-white); letter-spacing: 0.10em;
  text-align: center;
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
}
.pipeline-flow {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 2px;
}
.pl-step {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  flex: 1;
}
.pl-dot {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 2.5px solid rgba(96,165,250,0.45);
  background: rgba(15,23,42,0.80);
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono'; font-size: 32px; font-weight: 900;
  color: var(--tut-gray);
}
.pl-dot.lit {
  border-color: var(--tut-blue-light);
  background: radial-gradient(circle, var(--tut-blue), rgba(37,99,235,0.30));
  color: var(--tut-white);
  box-shadow: 0 0 14px rgba(96,165,250,0.55), 0 0 0 3px rgba(96,165,250,0.18);
}
.pl-label {
  font-family: 'Noto Sans SC'; font-size: 32px; font-weight: 700;
  color: var(--tut-blue-white);
  text-align: center; line-height: 1.2;
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
}
.pl-connector {
  flex: 0 0 auto;
  width: 18px; height: 3px;
  background: linear-gradient(90deg, rgba(96,165,250,0.20), rgba(96,165,250,0.55));
  border-radius: 2px;
  margin-top: 16px;
}
/* === bg 组件 @keyframes（自动注入，来自 components/bg/）=== */
@keyframes hexPulse { 0%,100%{opacity:0.5} 50%{opacity:0.85} }
@keyframes glassShimmer { 0%,100%{opacity:0.15} 50%{opacity:0.20} }
@keyframes hexScanRotate { 0%{transform:translate(-50%,-50%) rotate(0deg)} 100%{transform:translate(-50%,-50%) rotate(360deg)} }
@keyframes hexNodePulse { 0%,100%{opacity:0.3;transform:scale(0.9)} 50%{opacity:1;transform:scale(1.15)} }
@keyframes holoHexSpin { 0%{transform:translate(-50%,-50%) rotate(0deg)} 100%{transform:translate(-50%,-50%) rotate(60deg)} }
@keyframes cornerBlink { 0%,100%{opacity:0.35} 50%{opacity:0.85} }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="45.05" data-width="1920" data-height="1080">
