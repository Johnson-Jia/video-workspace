<!-- 场景: seg1 | 时长: ~47s | bg: diamond_lattice | 三痛点纵排（不懂业务/看不见全貌/留不住能力）+ 解法标签 + 结论金条 -->

  <div class="fx-aura" style="position:absolute;top:74%;left:20%;width:420px;height:200px;border-radius:50%;background:radial-gradient(ellipse, hsla(215,75%,58%,0.14) 0%, transparent 65%);filter:blur(50px);opacity:0.7"></div>

  <!-- fx-pulse-ring 脉冲锚点（每卡进入时左侧锚点，呼应当前痛点） -->
  <div class="fx-pulse-ring" style="position:absolute;top:32%;left:8%;width:24px;height:24px;border-radius:50%;border:3px solid hsla(0,80%,65%,0.7);box-shadow:0 0 18px hsla(0,75%,60%,0.22)"></div>
  <div class="fx-pulse-ring" style="position:absolute;top:54%;left:8%;width:24px;height:24px;border-radius:50%;border:3px solid hsla(255,70%,72%,0.7);box-shadow:0 0 18px hsla(255,65%,62%,0.5)"></div>
  <div class="fx-pulse-ring" style="position:absolute;top:76%;left:8%;width:24px;height:24px;border-radius:50%;border:3px solid hsla(215,75%,60%,0.7);box-shadow:0 0 18px hsla(215,70%,54%,0.5)"></div>
  <!-- fx-blink 平衡 -->
  <div class="fx-blink" style="position:absolute;top:9%;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:hsla(43,90%,60%,0.85);box-shadow:0 0 16px hsla(43,85%,54%,0.22)"></div>
  <div class="fx-blink" style="position:absolute;top:91%;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:hsla(43,90%,60%,0.85);box-shadow:0 0 14px hsla(43,85%,54%,0.22)"></div>
</div>
