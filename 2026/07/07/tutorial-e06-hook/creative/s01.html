<div class="layer-content">
<div class="phase phase-1 tut-scene">  <!-- 教程模式：1 场景 + 3 region + data-reveal（不切 phase） -->
  <div class="tut-grid">

    <!-- 区域 1：标题（data-reveal=0，dir=fade） -->
    <div class="tut-region tut-hook-title" data-reveal="0" data-reveal-dir="fade">
      <div class="hook-tag grad-gold-bg-inline">E06 钩子</div>
      <h1 class="hook-h1">需求 <span class="arrow-glyph">→</span> 交付 <span class="grad-gold">一条命令</span></h1>
      <div class="title-sub">OpenSpec + Superpowers</div>
    </div>

    <!-- 区域 2：左移对比（data-reveal=15，dir=left）—— 左：改Markdown(新/可控) ← 右：改代码(旧/损失) -->
    <div class="tut-region tut-hook-shift" data-reveal="15" data-reveal-dir="left">
      <div class="shift-row">
        <div class="shift-card shift-green">
          <div class="shift-icon">✓</div>
          <div class="shift-name grad-green">改 Markdown</div>
          <div class="shift-note">质量可控</div>
        </div>
        <div class="shift-arrow"><span class="arrow-glyph grad-gold">◀</span><div class="shift-arrow-label">偏差左移</div></div>
        <div class="shift-card shift-red">
          <div class="shift-icon">✗</div>
          <div class="shift-name grad-red">改代码</div>
          <div class="shift-note">质量损失</div>
        </div>
      </div>
    </div>

    <!-- 区域 3：反常识钩子（data-reveal=22，dir=top） -->
    <div class="tut-region tut-hook-twist" data-reveal="22" data-reveal-dir="top">
      <div class="twist-tag grad-gold-bg-inline">反常识</div>
      <div class="twist-main">发动机不是写更多代码 是<span class="grad-gold">纠错左移</span></div>
    </div>

  </div>
</div>
</div>
