<div class="layer-content">
<div class="phase phase-1">
<!-- phase-1: OfficeCLI 终端窗口 + Word/Excel/PPT 三件套 -->
<div class="terminal-stage">
  <div class="pfc-name" style="margin-bottom:8px;"><span class="pfc-owner">iOfficeAI /</span> <span class="pfc-repo">OfficeCLI</span></div>
  <div class="pfc-use" style="align-self:center;">单文件免装 Office · 给 AI 用</div>
  <div class="terminal-win">
    <div class="terminal-bar">
      <div class="term-dot term-dot-r"></div>
      <div class="term-dot term-dot-y"></div>
      <div class="term-dot term-dot-g"></div>
      <span class="terminal-title">officecli — bash</span>
    </div>
    <div class="terminal-body">
      <div class="term-line"><span class="term-prompt">$</span> <span class="term-cmd">officecli read doc.docx</span></div>
      <div class="term-line term-out">→ AI 批量读取 Word 文档</div>
      <div class="term-line"><span class="term-prompt">$</span> <span class="term-cmd">officecli read sheet.xlsx</span></div>
      <div class="term-line term-out">→ AI 批量读取 Excel 表格</div>
    </div>
  </div>
  <div class="office-icons">
    <div class="office-icon">
      <span class="office-icon-glyph" style="color:#2B579A;">W</span>
      <span class="office-icon-name">Word</span>
    </div>
    <div class="office-icon">
      <span class="office-icon-glyph" style="color:#217346;">X</span>
      <span class="office-icon-name">Excel</span>
    </div>
    <div class="office-icon">
      <span class="office-icon-glyph" style="color:#D24726;">P</span>
      <span class="office-icon-name">PPT</span>
    </div>
  </div>
</div>
</div>
<div class="phase phase-2">
<!-- phase-2: CubeSandbox 沙盒徽章 + 四词特性 + 腾讯云 -->

    </div>
    <div class="feature-card">

    </div>
    <div class="feature-card">
      <span class="feature-icon">○</span>
      <span class="feature-name">轻量</span>
    </div>
  </div>
</div>
