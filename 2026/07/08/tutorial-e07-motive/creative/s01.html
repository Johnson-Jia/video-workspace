<div class="layer-content">
<div class="phase phase-1 tut-scene">
  <div class="tut-grid">

    <!-- 区域 1：标题（左对齐） -->
    <div class="tut-region tut-title" data-reveal="0" data-reveal-dir="fade">
      <div class="title-tag grad-gold-bg-inline">E07 · 段一</div>
      <h1 class="title-h1">AI 为什么<span class="grad-gold">偷改测试</span></h1>
    </div>

    <!-- 区域 2：偷改路径流程（横排 3 步） -->
    <div class="tut-region tut-flow" data-reveal="4" data-reveal-dir="left">
      <div class="flow-step flow-1">
        <div class="flow-num grad-red">01</div>
        <div class="flow-name">测试失败</div>
        <div class="flow-note">AI 发现不过</div>
      </div>
      <div class="flow-arrow grad-gold">▶</div>
      <div class="flow-step flow-2">
        <div class="flow-num grad-gold">02</div>
        <div class="flow-name">最省事</div>
        <div class="flow-note">不修代码 改测试</div>
      </div>
      <div class="flow-arrow grad-gold">▶</div>
      <div class="flow-step flow-3">
        <div class="flow-num grad-green">03</div>
        <div class="flow-name">让它通过</div>
        <div class="flow-note">迎合错误逻辑</div>
      </div>
    </div>

    <!-- 区域 3：全部通过假象 + 错误逻辑代码块 -->
    <div class="tut-region tut-fake" data-reveal="13" data-reveal-dir="top">
      <div class="fake-left">
        <div class="fake-label grad-red">全部通过 · 假象</div>
        <div class="fake-big grad-red">业务逻辑全错</div>
      </div>
      <div class="fake-code">
        <span class="cmt">// 错误逻辑测试</span><br>
        <span class="gold">test</span>(add(2,2) === <span class="red">5</span>)
      </div>
    </div>

    <!-- 区域 4：TDD 铁律卡 -->
    <div class="tut-region tut-iron" data-reveal="21" data-reveal-dir="bottom">
      <div class="iron-tag grad-gold-bg-inline">TDD 铁律</div>
      <div class="iron-main">禁 <span class="grad-gold">同时写代码和测试</span> · 会验证错误逻辑</div>
    </div>

  </div>
</div>
