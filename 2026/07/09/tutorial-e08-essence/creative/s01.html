<!-- 场景: scene-1 | 时长: 22.25s | 度量的本质·金句升华 -->
<div class="layer-bg">
<!-- bg-component: noise_field -->
<!-- 深色底 -->
<div style="position:absolute;inset:0;background:linear-gradient(160deg,#0F172A 0%,#12121e 50%,#0a0a16 100%)"></div>
<!-- SVG 噪点纹理（微移动画） -->
<svg style="position:absolute;inset:0;width:100%;height:100%;opacity:0.15;animation:grainShift 4s ease-in-out infinite" xmlns="http://www.w3.org/2000/svg">
  <filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter>
  <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
</svg>
<!-- 光斑 1：冷调 -->
<div style="position:absolute;top:20%;left:15%;width:550px;height:550px;border-radius:50%;background:radial-gradient(circle,hsla(220,50%,45%,0.20),hsla(260,40%,30%,0.06),transparent 70%);filter:blur(90px);animation:noiseDrift 22s ease-in-out infinite 0s"></div>
<!-- 光斑 2：暖调（金，呼应金句主题） -->
<div style="position:absolute;top:55%;left:50%;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,hsla(40,80%,55%,0.18),hsla(30,60%,40%,0.05),transparent 70%);filter:blur(75px);animation:noiseDrift 26s ease-in-out infinite 9s"></div>
<!-- 悬浮尘埃粒子 -->
<div style="position:absolute;top:30%;left:60%;width:2px;height:2px;border-radius:50%;background:rgba(255,255,255,0.30);box-shadow:0 0 4px rgba(255,255,255,0.25);animation:dustFloat 5s ease-in-out infinite 0s"></div>
<div style="position:absolute;top:48%;left:25%;width:2px;height:2px;border-radius:50%;background:rgba(255,255,255,0.25);box-shadow:0 0 3px rgba(255,255,255,0.2);animation:dustFloat 6s ease-in-out infinite 2s"></div>
<div style="position:absolute;top:68%;left:45%;width:2px;height:2px;border-radius:50%;background:rgba(255,255,255,0.28);box-shadow:0 0 4px rgba(255,255,255,0.22);animation:dustFloat 5.5s ease-in-out infinite 4s"></div>
<div style="position:absolute;top:18%;left:38%;width:2px;height:2px;border-radius:50%;background:rgba(255,255,255,0.22);box-shadow:0 0 3px rgba(255,255,255,0.18);animation:dustFloat 7s ease-in-out infinite 1s"></div>
<!-- 玻璃折射层 -->
<div style="position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.015) 0%,transparent 35%,transparent 65%,rgba(255,255,255,0.02) 100%);animation:glassShimmer 9s ease-in-out infinite"></div>
</div>
<div class="layer-fx">
  <!-- fx 层：3 类不同特效（克制精致，不抢金句焦点） -->
  <div class="fx-aura-essence"></div>
  <div class="fx-spark-essence sp1"></div>
  <div class="fx-spark-essence sp2"></div>
  <div class="fx-spark-essence sp3"></div>
  <div class="fx-shimmer-essence sh1"></div>
  <div class="fx-shimmer-essence sh2"></div>
</div>
<div class="layer-content">
<div class="phase phase-1">
  <!-- phase-1 (0-2.45s): 标签「度量的本质」+ 阶梯一「能被量化的」 -->
  <div class="essence-scene">
    <div class="essence-tag">THE ESSENCE OF METRICS · 度量的本质</div>
    <div class="essence-ladder">
      <div class="essence-step s1">
        <span class="essence-step-num">01</span>
        <span class="essence-step-text grad-essence-gold">能被量化的</span>
      </div>
    </div>
  </div>
</div>
<div class="phase phase-2">
  <!-- phase-2 (2.45-8.06s): + 阶梯二「才能被管理」形成「量化→管理」递进链 -->
  <div class="essence-scene">
    <div class="essence-tag">THE ESSENCE OF METRICS · 度量的本质</div>
    <div class="essence-ladder">
      <div class="essence-step s1">
        <span class="essence-step-num">01</span>
        <span class="essence-step-text grad-essence-gold">能被量化的</span>
      </div>
      <div class="essence-arrow">↓</div>
      <div class="essence-step s2">
        <span class="essence-step-num">02</span>
        <span class="essence-step-text grad-essence-gold">才能被管理</span>
      </div>
    </div>
  </div>
</div>
<div class="phase phase-3">
  <!-- phase-3 (8.06-12.09s): + 阶梯三「才能指引方向」三阶梯完整链定型 -->
  <div class="essence-scene">
    <div class="essence-tag">THE ESSENCE OF METRICS · 度量的本质</div>
    <div class="essence-ladder">
      <div class="essence-step s1">
        <span class="essence-step-num">01</span>
        <span class="essence-step-text grad-essence-gold">能被量化的</span>
      </div>
      <div class="essence-arrow">↓</div>
      <div class="essence-step s2">
        <span class="essence-step-num">02</span>
        <span class="essence-step-text grad-essence-gold">才能被管理</span>
      </div>
      <div class="essence-arrow">↓</div>
      <div class="essence-step s3">
        <span class="essence-step-num">03</span>
        <span class="essence-step-text grad-essence-gold">才能指引方向</span>
      </div>
    </div>
  </div>
</div>
<div class="phase phase-4">
  <!-- phase-4 (12.09-22.25s): 三阶梯淡出 + 左右对比 + 收尾金句 -->
  <div class="essence-scene" style="justify-content:space-between;padding-top:80px;padding-bottom:80px;">
    <div class="essence-tag" style="margin-bottom:0;">拍脑门 vs 量化</div>
    <div class="essence-compare" style="margin-bottom:0;">
      <div class="essence-side weak">
        <div class="essence-side-label">拍脑门</div>
        <div class="essence-side-num">蒙对 1 次</div>
        <div class="essence-side-desc">靠运气 · 不可复制</div>
      </div>
      <div class="essence-vs">VS</div>
      <div class="essence-side strong">
        <div class="essence-side-label">量化</div>
        <div class="essence-side-num grad-essence-gold">对齐 100 次</div>
        <div class="essence-side-desc">靠数据 · 可复制</div>
      </div>
    </div>
    <div class="essence-finale">
      <div class="essence-finale-label">THE FINAL WORD</div>
      <div class="essence-finale-text">
        <span class="base">度量不是为了证明 AI 有用，</span><span class="em">是为了让下一组决策有根。</span>
      </div>
    </div>
  </div>
</div>
</div>
<div class="layer-cinema">
  <!-- 金句段克制：仅轻 vignette 增加焦点感 -->
  <div class="cinema-vignette" style="position:absolute;inset:0;width:100%;height:100%;opacity:0.35;"></div>
</div>
