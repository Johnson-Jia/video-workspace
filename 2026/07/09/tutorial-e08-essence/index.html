/* === ClipForge 基础层（自动生成，勿手改）=== */
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;color:#fff;overflow:hidden;width:1920px;height:1080px;}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;}
.clip{position:absolute;top:0;left:0;width:1920px;height:1080px;overflow:hidden;}
.layer-bg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;}
.layer-fx{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none;}
.layer-content{position:relative;z-index:3;height:100%;color:#fff;font-size:48px;}
.layer-cinema{position:absolute;top:0;left:0;width:100%;height:100%;z-index:4;pointer-events:none;}
.phase{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 120px 60px 120px;opacity:0;}
.phase:first-child{opacity:1;}
/* 兜底：.phase 内文本居中容器的直接块级子元素水平居中（根治 max-width 块缺 margin:0 auto 导致整块偏左；text-align 只居中行内内容不居中块盒子）*/
.phase [style*="text-align:center"] > div,.phase [style*="text-align: center"] > div{margin-left:auto;margin-right:auto;}
audio{display:none;}
.fx-glow{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;}
.fx-line{position:absolute;height:1px;pointer-events:none;}
.fx-dot{position:absolute;border-radius:50%;pointer-events:none;}
/* === fx 原语库（CSS animation 循环态，0%帧可见/移动型，HyperFrames 安全）===
   LLM 在 .layer-fx 内用 <div class="fx-xxx"> 直接引用，无需写 CSS；
   颜色默认半透明白，可 inline 覆盖（style="background:var(--accent-warm)"）。
   情绪→原语：ambient→aura / focus→ring,pulse-ring / calm→particle / tech→scan,stream,grid /
   climax→beam / shock→bolt / energy→orbit。R-R-008 要求 ≥2 种不同 fx class。 */
@keyframes fxAura{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.8;transform:scale(1.1)}}
@keyframes fxRingExp{0%,100%{opacity:.3;transform:scale(.92)}50%{opacity:.65;transform:scale(1.25)}}
@keyframes fxFloat{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-22px);opacity:1}}
@keyframes fxScanMove{0%,100%{top:18%}50%{top:82%}}
@keyframes fxBeamSweep{0%{left:-60%;opacity:0}10%,90%{opacity:.6}50%{left:50%}100%{left:120%;opacity:0}}
@keyframes fxStreamFall{0%{top:-50%;opacity:0}15%{opacity:.5}100%{top:120%;opacity:0}}
@keyframes fxBolt{0%,88%,100%{opacity:0}90%,94%{opacity:.85}91%{opacity:.2}}
@keyframes fxGridPulse{0%,100%{opacity:.06}50%{opacity:.14}}
@keyframes fxOrbit{from{transform:rotate(0) translateX(160px) rotate(0)}to{transform:rotate(360deg) translateX(160px) rotate(-360deg)}}
@keyframes fxPulseRing{0%{transform:scale(.4);opacity:.6}100%{transform:scale(2.2);opacity:0}}
.fx-aura{position:absolute;border-radius:50%;filter:blur(70px);animation:fxAura 4.5s ease-in-out infinite;}
.fx-ring{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.5);animation:fxRingExp 5s ease-in-out infinite;}
.fx-particle{position:absolute;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.7);animation:fxFloat 4s ease-in-out infinite;}
.fx-scan{position:absolute;left:0;width:100%;height:3px;background:linear-gradient(90deg,transparent,rgba(94,234,212,.55),transparent);opacity:.5;animation:fxScanMove 6s ease-in-out infinite;}
.fx-beam{position:absolute;top:40%;width:80%;height:50px;background:linear-gradient(90deg,transparent,rgba(94,234,212,.45),transparent);filter:blur(6px);mix-blend-mode:screen;animation:fxBeamSweep 5s ease-in-out infinite;}
.fx-stream{position:absolute;width:3px;height:35%;background:linear-gradient(180deg,transparent,rgba(94,234,212,.5),transparent);animation:fxStreamFall 3s linear infinite;}
.fx-bolt{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at 50% 30%,rgba(94,234,212,.4),transparent 60%);animation:fxBolt 5s steps(1) infinite;}
.fx-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(94,234,212,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(94,234,212,.09) 1px,transparent 1px);background-size:50px 50px;animation:fxGridPulse 8s ease-in-out infinite;}
.fx-orbit{position:absolute;top:50%;left:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 0 10px rgba(255,255,255,.5);animation:fxOrbit 6s linear infinite;}
.fx-pulse-ring{position:absolute;top:calc(50% - 100px);left:calc(50% - 100px);width:200px;height:200px;margin:0;border-radius:50%;border:2px solid rgba(255,255,255,.5);animation:fxPulseRing 3s ease-out infinite;}
/* === cinema 后处理原语库（全帧签名层 z:4，LLM 在 .layer-cinema 内用 <div class="cinema-xxx"> 引用，无需写 CSS）===
   每视频选 1-2 个签名（Cinema 测试：移除效果帧是否丢签名？都不丢→剪）。快速播报可选，非每场景必需。
   情绪→原语：聚焦/收紧→vignette / 胶片质感→grain / 论点落地冲击→lightflash(GSAP 控 opacity 闪) / 暖光签名→halation / 数据失真科技感→aberration。*/
.cinema-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,0.55) 100%);pointer-events:none;}
.cinema-grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>");pointer-events:none;}
.cinema-halation{position:absolute;inset:0;mix-blend-mode:screen;background:radial-gradient(ellipse at 50% 62%,rgba(255,180,90,0.16),transparent 68%);pointer-events:none;}
.cinema-lightflash{position:absolute;inset:0;mix-blend-mode:screen;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(255,228,180,0.55),transparent 62%);pointer-events:none;}
.cinema-aberration{position:absolute;inset:0;filter:drop-shadow(1.5px 0 rgba(255,40,90,0.45)) drop-shadow(-1.5px 0 rgba(40,200,255,0.45));pointer-events:none;}
.pfc-use[class*="grad-"]{background-image:none;-webkit-background-clip:border-box;background-clip:border-box;-webkit-text-fill-color:#f5f5f5;color:#f5f5f5;} /* 全局兜底：胶囊禁 grad clip:text（feedback-bgclip-text-capsule-conflict），SubAgent 误用 grad-* 时强制纯色可见；项目级 .pfc-use.grad-xxx 可覆盖分色 */
.tut-scene{display:flex;flex-direction:column;justify-content:center;align-items:stretch;width:100%;height:100%;} /* 教程横屏：撑满 phase content box（phase padding 管安全区），align-items:stretch 让 region 水平撑满（根治偏右，不缩中间）*/
.tut-grid{width:100%;height:100%;}
/* === LLM 自定义组件层（来自 creative/style.css）=== */

:root {
  --bg-deep: #0F172A;
  --tut-bg: #0F172A;
  --tut-cyan: #22D3EE;
  --tut-blue: #60A5FA;
  --tut-gold-deep: #FCD34D;
  --tut-gold: #FBBF24;
  --tut-gold-warm: #FCD34D;
  --tut-slate: #64748B;
  --tut-white: rgba(255,255,255,0.92);
  --tut-blue-white: #E0E7FF;
  --font-title: 'Inter',sans-serif;
  --font-body: 'Noto Sans SC',sans-serif;
  --font-data: 'JetBrains Mono',monospace;
}

/* ============================================
 * Tutorial E08 essence — 度量的本质·金句升华（克制精致）
 * 思想升华段：少元素、大留白、金句居中
 * 金色渐变文字（深金→暖金，禁白端点）+ text-shadow 深蓝非发光
 * 4 phase 累积 reveal：标题+阶梯一 → 阶梯二 → 阶梯三 → 左右对比+收尾金句
 * ============================================ */

.essence-scene {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  padding: 90px 120px;
  text-align: center;
}

/* —— 顶部小标签「度量的本质」—— */
.essence-tag {
  font-family: 'JetBrains Mono'; font-size: 32px; font-weight: 700;
  letter-spacing: 0.30em;
  color: var(--tut-gold);
  text-shadow: 0 2px 6px rgba(30,41,59,0.32);
  margin-bottom: 28px;
  opacity: 0.92;
}

/* —— 三阶梯递进金句（量化→管理→方向）—— */
.essence-ladder {
  display: flex; flex-direction: column;
  align-items: center; gap: 18px;
  margin-bottom: 56px;
  width: 100%;
}
.essence-step {
  display: flex; align-items: center; gap: 28px;
  font-family: 'Inter',sans-serif;
  line-height: 1.0;
}
.essence-step-num {
  font-family: 'JetBrains Mono'; font-size: 32px; font-weight: 800;
  color: var(--tut-gold);
  opacity: 0.75;
  width: 50px; text-align: right;
}
.essence-step-text {
  font-weight: 900;
  text-shadow: 0 3px 10px rgba(30,41,59,0.32);
  letter-spacing: 0.02em;
}
/* 阶梯递进放大（72 → 96 → 120px） */
.essence-step.s1 .essence-step-text { font-size: 72px; }
.essence-step.s2 .essence-step-text { font-size: 96px; }
.essence-step.s3 .essence-step-text { font-size: 120px; }
/* 金色渐变（深金→暖金，禁白端点；同色系） */
.grad-essence-gold {
  background-image: linear-gradient(92deg, #FCD34D 0%, #FBBF24 50%, #FCD34D 100%);
  -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
}
.essence-arrow {
  font-family: 'Inter'; font-size: 48px; font-weight: 700;
  color: var(--tut-gold);
  opacity: 0.55;
  line-height: 1;
  text-shadow: 0 2px 6px rgba(30,41,59,0.32);
}

/* —— 左右对比区「拍脑门蒙一次 vs 量化对齐一百次」—— */
.essence-compare {
  display: flex; align-items: center; justify-content: center;
  gap: 60px;
  width: 100%;
  margin-bottom: 48px;
}
.essence-side {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 22px 40px;
  border-radius: 14px;
  min-width: 360px;
}
.essence-side.weak {
  background: rgba(100,116,139,0.08);
  border: 1.5px dashed rgba(100,116,139,0.45);
}
.essence-side.strong {
  background: rgba(251,191,36,0.06);
  border: 1.5px solid rgba(251,191,36,0.40);
}
.essence-side-label {
  font-family: 'JetBrains Mono'; font-size: 32px; font-weight: 700;
  letter-spacing: 0.18em;
}
.essence-side.weak .essence-side-label { color: var(--tut-slate); }
.essence-side.strong .essence-side-label { color: var(--tut-gold); }
.essence-side-num {
  font-family: 'Inter'; font-size: 84px; font-weight: 900;
  line-height: 1.0;
}
.essence-side.weak .essence-side-num {
  color: var(--tut-slate);
  text-shadow: 0 2px 6px rgba(30,41,59,0.32);
}
.essence-side-desc {
  font-family: 'Noto Sans SC'; font-size: 32px; font-weight: 600;
  letter-spacing: 0.06em;
}
.essence-side.weak .essence-side-desc { color: rgba(148,163,184,0.85); }
.essence-side.strong .essence-side-desc {
  background-image: linear-gradient(92deg, #FCD34D 0%, #FBBF24 60%, #FCD34D 100%);
  -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
}
.essence-vs {
  font-family: 'Inter'; font-size: 44px; font-weight: 900;
  color: var(--tut-white);
  opacity: 0.55;
  letter-spacing: 0.04em;
  text-shadow: 0 2px 6px rgba(30,41,59,0.32);
}

/* —— 收尾金句「度量不是为了证明 AI 有用，是为了让下一组决策有根」—— */
.essence-finale {
  width: 100%;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.essence-finale-label {
  font-family: 'JetBrains Mono'; font-size: 32px; font-weight: 700;
  letter-spacing: 0.30em;
  color: var(--tut-gold);
  opacity: 0.80;
}
.essence-finale-text {
  font-family: 'Inter',sans-serif;
  font-size: 56px; font-weight: 800;
  line-height: 1.30;
  max-width: 1500px;
  text-shadow: 0 3px 10px rgba(30,41,59,0.32);
  letter-spacing: 0.02em;
  overflow-wrap: break-word; word-break: break-word;
}
.essence-finale-text .em {
  background-image: linear-gradient(92deg, #FCD34D 0%, #FBBF24 55%, #FCD34D 100%);
  -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
  font-weight: 900;
}
.essence-finale-text .base {
  color: var(--tut-blue-white);
}

/* —— fx 层（克制精致，3 类不同特效）—— */
/* fx-aura-essence：静态低 alpha 暖金光晕衬底（不抢金句焦点） */
.fx-aura-essence {
  position: absolute;
  width: 1100px; height: 1100px;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(251,191,36,0.10) 0%, rgba(251,191,36,0.04) 35%, transparent 65%);
  pointer-events: none;
}
/* fx-spark-essence：金色微粒（点缀，思想火花意象） */
.fx-spark-essence {
  position: absolute;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(252,211,77,0.85);
  box-shadow: 0 0 10px rgba(251,191,36,0.6);
}
.fx-spark-essence.sp1 { top: 22%; left: 18%; }
.fx-spark-essence.sp2 { top: 68%; left: 82%; width: 5px; height: 5px; }
.fx-spark-essence.sp3 { top: 45%; left: 88%; width: 4px; height: 4px; background: rgba(252,211,77,0.7); }
/* fx-shimmer-essence：金色细线（度量刻度意象，水平铺底） */
.fx-shimmer-essence {
  position: absolute;
  left: 8%; width: 84%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(251,191,36,0.18), transparent);
}
.fx-shimmer-essence.sh1 { top: 30%; }
.fx-shimmer-essence.sh2 { top: 70%; opacity: 0.6; }
/* === bg 组件 @keyframes（自动注入，来自 components/bg/）=== */
@keyframes noiseDrift {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(40px, -30px) scale(1.08); }
  66% { transform: translate(-25px, 35px) scale(0.94); }
}
@keyframes grainShift {
  0% { transform: translate(0, 0); }
  50% { transform: translate(-8px, 6px); }
  100% { transform: translate(0, 0); }
}
@keyframes dustFloat {
  0%, 100% { transform: translateY(0); opacity: 0.25; }
  50% { transform: translateY(-30px); opacity: 0.45; }
}
@keyframes glassShimmer {
  0%, 100% { opacity: 0.15; }
  50% { opacity: 0.20; }
}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="22.25" data-width="1920" data-height="1080">
<audio id="narration" src="narration.mp3" data-volume="1" data-track="1" data-start="0"></audio>
<audio id="bgm" src="bgm.wav" data-volume="0.2" data-track="2" data-start="0"></audio>

<div class="clip" id="s01" data-start="0.00" data-duration="22.25">
<!-- 场景: scene-1 | 时长: 22.25s | 度量的本质·金句升华 -->
<div class="layer-bg" data-bg-types="glow,gradient,noise,particles">
<!-- bg-component: noise_field -->
<div style="position:absolute;inset:0;
  background:linear-gradient(160deg, #08080f 0%, #12121e 50%, #0a0a16 100%)"></div>

<svg style="position:absolute;inset:0;width:100%;height:100%;opacity:0.15;animation:grainShift 4s ease-in-out infinite" xmlns="http://www.w3.org/2000/svg">
  <filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter>
  <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
</svg>

<div style="position:absolute;top:20%;left:15%;width:550px;height:550px;border-radius:50%;

  filter:blur(90px);animation:noiseDrift 22s ease-in-out infinite 0s"></div>

<div style="position:absolute;top:55%;left:50%;width:400px;height:400px;border-radius:50%;

  filter:blur(75px);animation:noiseDrift 26s ease-in-out infinite 9s"></div>

<div style="position:absolute;top:30%;left:60%;width:2px;height:2px;border-radius:50%;

<div style="position:absolute;top:48%;left:25%;width:2px;height:2px;border-radius:50%;
  background:rgba(255,255,255,0.25);box-shadow:0 0 3px rgba(255,255,255,0.2);animation:dustFloat 6s ease-in-out infinite 2s"></div>

<div style="position:absolute;top:68%;left:45%;width:2px;height:2px;border-radius:50%;
  background:rgba(255,255,255,0.28);box-shadow:0 0 4px rgba(255,255,255,0.22);animation:dustFloat 5.5s ease-in-out infinite 4s"></div>

<div style="position:absolute;top:18%;left:38%;width:2px;height:2px;border-radius:50%;
  background:rgba(255,255,255,0.22);box-shadow:0 0 3px rgba(255,255,255,0.18);animation:dustFloat 7s ease-in-out infinite 1s"></div>

<div style="position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.015) 0%,transparent 35%,transparent 65%,rgba(255,255,255,0.02) 100%);

</div>
<div class="layer-fx">
  <!-- fx 层：3 类不同特效（克制精致，不抢金句焦点） -->
  <div class="fx-aura-essence"></div>

</div>
<div class="phase phase-3">
  <!-- phase-3 (8.06-12.09s): + 阶梯三「才能指引方向」三阶梯完整链定型 -->
  <div class="essence-scene">
    <div class="essence-tag">THE ESSENCE OF METRICS · 度量的本质</div>
    <div class="essence-ladder">
      <div class="essence-step s1">
        <span class="essence-step-num">01</span>
