/* === ClipForge 基础层（自动生成，勿手改）=== */
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;color:#fff;overflow:hidden;width:1920px;height:1080px;}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;}
.clip{position:absolute;top:0;left:0;width:1920px;height:1080px;overflow:hidden;}
.layer-bg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;}
.layer-fx{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none;}
.layer-content{position:relative;z-index:3;height:100%;color:#fff;font-size:48px;}
.layer-cinema{position:absolute;top:0;left:0;width:100%;height:100%;z-index:4;pointer-events:none;}
.phase{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 120px 60px 120px;opacity:0;}
.phase:first-child{opacity:1;}
/* 兜底：.phase 内文本居中容器的直接块级子元素水平居中（根治 max-width 块缺 margin:0 auto 导致整块偏左；text-align 只居中行内内容不居中块盒子）*/
.phase [style*="text-align:center"] > div,.phase [style*="text-align: center"] > div{margin-left:auto;margin-right:auto;}
audio{display:none;}
.fx-glow{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;}
.fx-line{position:absolute;height:1px;pointer-events:none;}
.fx-dot{position:absolute;border-radius:50%;pointer-events:none;}
/* === fx 原语库（CSS animation 循环态，0%帧可见/移动型，HyperFrames 安全）===
   LLM 在 .layer-fx 内用 <div class="fx-xxx"> 直接引用，无需写 CSS；
   颜色默认半透明白，可 inline 覆盖（style="background:var(--accent-warm)"）。
   情绪→原语：ambient→aura / focus→ring,pulse-ring / calm→particle / tech→scan,stream,grid /
   climax→beam / shock→bolt / energy→orbit。R-R-008 要求 ≥2 种不同 fx class。 */
@keyframes fxAura{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.8;transform:scale(1.1)}}
@keyframes fxRingExp{0%,100%{opacity:.3;transform:scale(.92)}50%{opacity:.65;transform:scale(1.25)}}
@keyframes fxFloat{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-22px);opacity:1}}
@keyframes fxScanMove{0%,100%{top:18%}50%{top:82%}}
@keyframes fxBeamSweep{0%{left:-60%;opacity:0}10%,90%{opacity:.6}50%{left:50%}100%{left:120%;opacity:0}}
@keyframes fxStreamFall{0%{top:-50%;opacity:0}15%{opacity:.5}100%{top:120%;opacity:0}}
@keyframes fxBolt{0%,88%,100%{opacity:0}90%,94%{opacity:.85}91%{opacity:.2}}
@keyframes fxGridPulse{0%,100%{opacity:.06}50%{opacity:.14}}
@keyframes fxOrbit{from{transform:rotate(0) translateX(160px) rotate(0)}to{transform:rotate(360deg) translateX(160px) rotate(-360deg)}}
@keyframes fxPulseRing{0%{transform:scale(.4);opacity:.6}100%{transform:scale(2.2);opacity:0}}
.fx-aura{position:absolute;border-radius:50%;filter:blur(70px);animation:fxAura 4.5s ease-in-out infinite;}
.fx-ring{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.5);animation:fxRingExp 5s ease-in-out infinite;}
.fx-particle{position:absolute;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.7);animation:fxFloat 4s ease-in-out infinite;}
.fx-scan{position:absolute;left:0;width:100%;height:3px;background:linear-gradient(90deg,transparent,rgba(94,234,212,.55),transparent);opacity:.5;animation:fxScanMove 6s ease-in-out infinite;}
.fx-beam{position:absolute;top:40%;width:80%;height:50px;background:linear-gradient(90deg,transparent,rgba(94,234,212,.45),transparent);filter:blur(6px);mix-blend-mode:screen;animation:fxBeamSweep 5s ease-in-out infinite;}
.fx-stream{position:absolute;width:3px;height:35%;background:linear-gradient(180deg,transparent,rgba(94,234,212,.5),transparent);animation:fxStreamFall 3s linear infinite;}
.fx-bolt{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at 50% 30%,rgba(94,234,212,.4),transparent 60%);animation:fxBolt 5s steps(1) infinite;}
.fx-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(94,234,212,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(94,234,212,.09) 1px,transparent 1px);background-size:50px 50px;animation:fxGridPulse 8s ease-in-out infinite;}
.fx-orbit{position:absolute;top:50%;left:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 0 10px rgba(255,255,255,.5);animation:fxOrbit 6s linear infinite;}
.fx-pulse-ring{position:absolute;top:calc(50% - 100px);left:calc(50% - 100px);width:200px;height:200px;margin:0;border-radius:50%;border:2px solid rgba(255,255,255,.5);animation:fxPulseRing 3s ease-out infinite;}
/* === cinema 后处理原语库（全帧签名层 z:4，LLM 在 .layer-cinema 内用 <div class="cinema-xxx"> 引用，无需写 CSS）===
   每视频选 1-2 个签名（Cinema 测试：移除效果帧是否丢签名？都不丢→剪）。快速播报可选，非每场景必需。
   情绪→原语：聚焦/收紧→vignette / 胶片质感→grain / 论点落地冲击→lightflash(GSAP 控 opacity 闪) / 暖光签名→halation / 数据失真科技感→aberration。*/
.cinema-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,0.55) 100%);pointer-events:none;}
.cinema-grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>");pointer-events:none;}
.cinema-halation{position:absolute;inset:0;mix-blend-mode:screen;background:radial-gradient(ellipse at 50% 62%,rgba(255,180,90,0.16),transparent 68%);pointer-events:none;}
.cinema-lightflash{position:absolute;inset:0;mix-blend-mode:screen;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(255,228,180,0.55),transparent 62%);pointer-events:none;}
.cinema-aberration{position:absolute;inset:0;filter:drop-shadow(1.5px 0 rgba(255,40,90,0.45)) drop-shadow(-1.5px 0 rgba(40,200,255,0.45));pointer-events:none;}
.pfc-use[class*="grad-"]{background-image:none;-webkit-background-clip:border-box;background-clip:border-box;-webkit-text-fill-color:#f5f5f5;color:#f5f5f5;} /* 全局兜底：胶囊禁 grad clip:text（feedback-bgclip-text-capsule-conflict），SubAgent 误用 grad-* 时强制纯色可见；项目级 .pfc-use.grad-xxx 可覆盖分色 */
.tut-scene{display:flex;flex-direction:column;justify-content:center;align-items:stretch;width:100%;height:100%;} /* 教程横屏：撑满 phase content box（phase padding 管安全区），align-items:stretch 让 region 水平撑满（根治偏右，不缩中间）*/
.tut-grid{width:100%;height:100%;}
/* === LLM 自定义组件层（来自 creative/style.css）=== */

:root {
  --bg-deep: #0F172A;
  --font-title: 'Inter','PingFang SC','Microsoft YaHei',sans-serif;
  --font-body: 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --font-data: 'JetBrains Mono','Consolas',monospace;
  --title-weight: 900;
  --tut-blue: #3B82F6;
  --tut-purple: #A78BFA;
  --tut-green: #6EE7B7;
  --tut-gold: #FBBF24;
  --tut-red: #FCA5A5;
  --tut-blue-white: #E0E7FF;
  --tut-white: rgba(255,255,255,0.90);
}

/* ============================================
 * Tutorial E08 microservice-2 — 微服务闭环·后半（参照 E06-pipeline 设计语言）
 * bg: noise_field + 横向6节点（前3 done灰 / 后3 active）+ SVG连线 + 测试→生成 红色虚线闭环
 * 4 phase 累积：标题 → +流水线 → +数据底座双卡 → +人机边界+警示
 * 类前缀 .tut-pl-*（与 E06 一致），删旧 .fcb-*/.ms-*/.pipe-*
 * ============================================ */
.tut-scene {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: space-between; align-items: stretch;
  padding: 60px 90px 60px;
}
.tut-grid {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: space-between; align-items: stretch;
  gap: 10px;
}
.tut-region { opacity: 0; will-change: opacity, transform; }
.tut-region[data-reveal="0"] { opacity: 1; }

/* —— 渐变文字（同色系，禁白色端点） —— */
.grad-blue { background-image: linear-gradient(92deg,#60A5FA 0%,#3B82F6 55%,#93C5FD 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.grad-purple { background-image: linear-gradient(92deg,#C4B5FD 0%,#A78BFA 55%,#DDD6FE 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.grad-green { background-image: linear-gradient(92deg,#34D399 0%,#10B981 55%,#6EE7B7 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.grad-gold { background-image: linear-gradient(92deg,#FBBF24 0%,#F59E0B 55%,#FCD34D 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.grad-red { background-image: linear-gradient(92deg,#FCA5A5 0%,#EF4444 55%,#F87171 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.grad-gold-bg-inline {
  display: inline-block;
  background-image: linear-gradient(92deg,#FBBF24 0%,#FCD34D 100%);
  color: #1E293B; -webkit-text-fill-color: #1E293B;
  padding: 4px 16px; border-radius: 8px;
  font-family: 'JetBrains Mono';
}

/* —— 区域 1：标题 —— 左对齐锚点 */
.tut-pl-title { text-align: left; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.tut-pl-title .title-tag {
  font-family: 'JetBrains Mono'; font-size: 32px; font-weight: 800;
  letter-spacing: 0.08em;
}
.tut-pl-title .title-h1 {
  font-family: 'Inter'; font-size: 92px; font-weight: 900; line-height: 1.04;
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
}
.tut-pl-title .title-sub {
  font-family: 'Noto Sans SC'; font-size: 32px; font-weight: 700;
  color: var(--tut-blue-white); letter-spacing: 0.04em;
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
}

/* —— 区域 2：六阶段流水线（核心组件，参照 E06） —— 横向 6 节点 + SVG 连线 + 测试→生成闭环 */
.tut-pl-pipeline { width: 100%; display: flex; justify-content: stretch; }
.pipeline-wrap {
  position: relative;
  width: 100%; max-width: 1740px;
  height: 300px;
  display: flex; align-items: center; justify-content: center;
}
.pipeline-edges {
  position: absolute;
  top: 50%; left: 0;
  width: 100%; height: 160px;
  transform: translateY(-50%);
  pointer-events: none;
}
.pipeline-edges .edge {
  stroke-width: 4;
  fill: none;
  stroke-linecap: round;
  stroke-dasharray: 300;
  stroke-dashoffset: 300;
}
.edge-1 { stroke: rgba(96,165,250,0.75); }
.edge-2 { stroke: rgba(167,139,250,0.75); }
.edge-3 { stroke: rgba(59,130,246,0.75); }
.edge-4 { stroke: rgba(110,231,183,0.75); }
.edge-5 { stroke: rgba(251,191,36,0.75); }
.edge-dim { stroke: rgba(148,163,184,0.35); stroke-dasharray: 8 8; }
/* 闭环：测试不过 → 代码生成（红色虚线弧线） */
.edge-loop {
  stroke: rgba(239,68,68,0.85);
  stroke-width: 4;
  stroke-dasharray: 10 6;
  fill: none;
  stroke-linecap: round;
}
.node-row {
  position: relative;
  width: 100%;
  display: grid; grid-template-columns: repeat(6, 1fr);
  gap: 0;
  z-index: 2;
}
.stage-node {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 14px 6px;
  border-radius: 14px;
  background: linear-gradient(180deg, rgba(15,23,42,0.92), rgba(15,23,42,0.78));
  border: 2.5px solid;
  will-change: transform, opacity;
}
.sn-1 { border-color: rgba(96,165,250,0.75); box-shadow: 0 0 22px rgba(96,165,250,0.22); }
.sn-2 { border-color: rgba(167,139,250,0.75); box-shadow: 0 0 22px rgba(167,139,250,0.22); }
.sn-3 { border-color: rgba(59,130,246,0.75); box-shadow: 0 0 22px rgba(59,130,246,0.22); }
.sn-4 { border-color: rgba(110,231,183,0.75); box-shadow: 0 0 22px rgba(110,231,183,0.22); }
.sn-5 { border-color: rgba(251,191,36,0.75); box-shadow: 0 0 22px rgba(251,191,36,0.22); }
.sn-6 { border-color: rgba(252,165,165,0.75); box-shadow: 0 0 22px rgba(252,165,165,0.22); }
/* 灰态（前3 done） */
.sn-dim {
  border-color: rgba(148,163,184,0.30);
  background: linear-gradient(180deg, rgba(15,23,42,0.70), rgba(15,23,42,0.55));
  box-shadow: none;
  opacity: 0.5;
}
.sn-dim .node-icon { filter: grayscale(0.7) opacity(0.6); }
.sn-dim .node-stage,
.sn-dim .node-skill,
.sn-dim .node-num { color: rgba(148,163,184,0.70); -webkit-text-fill-color: rgba(148,163,184,0.70); }
/* done 标记（前3 done 加对勾） */
.sn-done::after {
  content: '✓';
  position: absolute;
  top: 6px; right: 8px;
  font-family: 'JetBrains Mono'; font-size: 24px; font-weight: 900;
  color: rgba(110,231,183,0.85);
}
/* active 聚焦态（后3 高亮） */
.sn-active {
  border-color: rgba(167,139,250,0.95);
  box-shadow: 0 0 32px rgba(167,139,250,0.42), 0 0 60px rgba(167,139,250,0.20);
  transform: scale(1.06);
}
.node-icon {
  font-size: 44px; line-height: 1;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
}
.node-stage {
  font-family: 'Inter'; font-size: 34px; font-weight: 900;
  letter-spacing: 0.04em;
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
}
.node-skill {
  font-family: 'JetBrains Mono'; font-size: 32px; font-weight: 700;
  color: var(--tut-blue-white);
  letter-spacing: 0.01em;
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
  text-align: center; line-height: 1.1;
  word-break: break-all;
}
.node-num {
  font-family: 'Noto Sans SC'; font-size: 32px; font-weight: 700;
  color: rgba(224,231,255,0.78);
  letter-spacing: 0.06em;
}

/* —— 区域 3：数据底座双卡（RAG / 图谱） —— */
.tut-pl-base { width: 100%; display: flex; justify-content: stretch; gap: 16px; }
.base-card {
  flex: 1;
  border-radius: 14px; padding: 10px 24px;
  border: 2.5px solid;
  display: flex; align-items: center; gap: 16px;
}
.base-card.blue { border-color: rgba(96,165,250,0.65); background: linear-gradient(90deg, rgba(96,165,250,0.13), rgba(15,23,42,0.90)); }
.base-card.gold { border-color: rgba(251,191,36,0.65); background: linear-gradient(90deg, rgba(251,191,36,0.13), rgba(15,23,42,0.90)); }
.base-icon { font-size: 44px; line-height: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }
.base-name {
  font-family: 'Inter'; font-size: 34px; font-weight: 900;
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
}
.base-desc {
  font-family: 'Noto Sans SC'; font-size: 32px; font-weight: 700;
  color: rgba(224,231,255,0.85);
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
  margin-top: 2px;
}

/* —— 区域 4：人机边界左右对比 —— */
.tut-pl-bound { width: 100%; display: flex; justify-content: stretch; gap: 16px; align-items: stretch; }
.bound-card {
  flex: 1;
  border-radius: 14px; padding: 10px 24px;
  border: 2.5px solid;
  display: flex; align-items: center; gap: 16px;
}
.bound-card.cyan { border-color: rgba(34,211,238,0.65); background: linear-gradient(90deg, rgba(34,211,238,0.13), rgba(15,23,42,0.90)); }
.bound-card.blue { border-color: rgba(96,165,250,0.65); background: linear-gradient(90deg, rgba(96,165,250,0.13), rgba(15,23,42,0.90)); }
.bound-icon { font-size: 44px; line-height: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }
.bound-name {
  font-family: 'Inter'; font-size: 36px; font-weight: 900;
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
}
.bound-tasks {
  font-family: 'Noto Sans SC'; font-size: 32px; font-weight: 700;
  color: rgba(224,231,255,0.85);
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
  margin-top: 2px;
}
.bound-vs {
  font-family: 'JetBrains Mono'; font-size: 40px; font-weight: 900;
  color: rgba(251,191,36,0.85);
  display: flex; align-items: center; justify-content: center;
  padding: 0 8px;
}

/* —— 区域 5：警示条 —— */
.tut-pl-warn { width: 100%; display: flex; justify-content: stretch; }
.warn-card {
  border-radius: 14px; padding: 10px 28px;
  border: 2.5px solid rgba(252,165,165,0.60);
  background: linear-gradient(90deg, rgba(252,165,165,0.12), rgba(15,23,42,0.90));
  display: flex; align-items: center; gap: 16px;
  width: 100%;
}
.warn-mark {
  font-family: 'JetBrains Mono'; font-size: 32px; font-weight: 800;
  letter-spacing: 0.06em;
  padding: 4px 12px; border-radius: 6px;
  background: rgba(252,165,165,0.20);
  color: rgba(252,165,165,0.95);
  -webkit-text-fill-color: rgba(252,165,165,0.95);
  flex-shrink: 0;
}
.warn-text {
  font-family: 'Noto Sans SC'; font-size: 32px; font-weight: 800;
  color: var(--tut-white);
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
  line-height: 1.25;
}

/* —— 收束金句 —— */
.tut-pl-closer { width: 100%; display: flex; justify-content: flex-start; }
.closer-line {
  font-family: 'Noto Sans SC'; font-size: 34px; font-weight: 800;
  color: var(--tut-white);
  text-shadow: 0 2px 6px rgba(30,41,59,0.08);
  letter-spacing: 0.04em;
}
/* === bg 组件 @keyframes（自动注入，来自 components/bg/）=== */
@keyframes noiseDrift {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(40px, -30px) scale(1.08); }
  66% { transform: translate(-25px, 35px) scale(0.94); }
}
@keyframes grainShift {
  0% { transform: translate(0, 0); }
  50% { transform: translate(-8px, 6px); }
  100% { transform: translate(0, 0); }
}
@keyframes dustFloat {
  0%, 100% { transform: translateY(0); opacity: 0.25; }
  50% { transform: translateY(-30px); opacity: 0.45; }
}
@keyframes glassShimmer {
  0%, 100% { opacity: 0.15; }
  50% { opacity: 0.20; }
}
</style>

<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="52.34" data-width="1920" data-height="1080">
<audio id="narration" src="narration.mp3" data-volume="1" data-track="1" data-start="0"></audio>
<audio id="bgm" src="bgm.wav" data-volume="0.15" data-track="2" data-start="0"></audio>

<div class="clip" id="s01" data-start="0.00" data-duration="52.34">
<!-- 场景: seg1 | 时长: ~52s | bg: noise_field | 微服务闭环后半（单 tut-scene 多 region reveal：标题/流水线/底座/人机边界+警示 同屏 1080 内依次 reveal） -->
<div class="layer-bg" data-bg-types="glow,gradient,noise,particles">
