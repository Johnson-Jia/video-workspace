<!-- 场景: windows-recommend | 时长: 2.54s | bg: diamond_lattice | 建议 2-3 个起步 + 收尾 -->
<div class="layer-bg">
  <!-- bg-component: diamond_lattice -->
</div>

<div class="layer-fx">
  <div class="fx-aura" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:1000px;height:440px;border-radius:50%;background:radial-gradient(ellipse,hsla(150,75%,55%,0.18) 0%,transparent 70%);filter:blur(70px);opacity:0.8"></div>
  <div class="fx-aura" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:560px;height:220px;border-radius:50%;background:radial-gradient(ellipse,hsla(215,90%,62%,0.14) 0%,transparent 65%);filter:blur(50px);opacity:0.7"></div>

  <div class="fx-particle" style="position:absolute;top:24%;left:18%;width:8px;height:8px;background:rgba(52,211,153,0.85);box-shadow:0 0 12px rgba(52,211,153,0.6)"></div>
  <div class="fx-particle" style="position:absolute;top:78%;left:82%;width:9px;height:9px;background:rgba(96,165,250,0.85);box-shadow:0 0 12px rgba(96,165,250,0.6)"></div>
</div>

<div class="layer-content">
<div class="phase phase-1 tut-scene">
  <div style="display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;height:100%;gap:24px">
    <div data-reveal="0" data-reveal-dir="fade" style="width:100%;text-align:center">
      <div style="font-family:var(--font-data);font-size:32px;color:rgba(52,211,153,0.75);letter-spacing:2px;margin-bottom:14px">✓ 稳起步建议</div>
      <h1 style="font-family:var(--font-title);font-weight:900;font-size:88px;line-height:1.1;color:#fff;text-shadow:none">
        <span style="background-image:linear-gradient(120deg,#a7f3d0,#34d399 60%,#60a5fa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent">两到三个</span>
      </h1>
      <div style="font-family:var(--font-title);font-weight:700;font-size:42px;color:#fff;margin-top:12px;text-shadow:none">起步</div>
    </div>
    <div class="ma-pill ma-pill-green" data-reveal="1" data-reveal-dir="bottom" style="font-size:32px;padding:8px 18px">先稳后放 · 渐进放量</div>
  </div>
</div>
</div>

<div class="layer-cinema">
