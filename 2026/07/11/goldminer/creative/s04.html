<div class="layer-fx">
<!-- fx1: 中心暖金光晕呼吸（宝藏箱开启聚光） -->
<div class="fx-glow-amber" style="top:38%;left:50%;transform:translateX(-50%);width:420px;height:420px;background:radial-gradient(circle,hsla(40,90%,58%,0.32),transparent 70%);animation:fxAura 6s ease-in-out infinite"></div>
