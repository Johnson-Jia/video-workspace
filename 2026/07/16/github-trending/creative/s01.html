<!-- 场景: hook | 时长: 4.0s | 情绪: grab 爆发·数字锚定 -->
<div class="layer-bg">
  <!-- bg-component: radial_beams -->
<!-- 深色底 -->
<div style="position:absolute;inset:0;background:linear-gradient(180deg,#0a0810 0%,#16100a 50%,#0a0810 100%)"></div>
<!-- 顶部琥珀辉光（暖） -->
<div style="position:absolute;top:-10%;left:15%;width:720px;height:720px;border-radius:50%;
  background:radial-gradient(circle,rgba(249,168,37,0.32),rgba(249,168,37,0.06),transparent 70%);
  filter:blur(110px)"></div>
<!-- 底部电蓝辉光（冷）形成双光晕暖冷对比 -->
<div style="position:absolute;bottom:-12%;right:8%;width:680px;height:680px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,229,255,0.28),rgba(0,180,220,0.05),transparent 70%);
  filter:blur(120px)"></div>
<!-- 径向光束射线（旋转） -->
<div style="position:absolute;top:38%;left:50%;width:1800px;height:1800px;transform:translate(-50%,-50%);
  background:conic-gradient(from 0deg,
    transparent 0deg, rgba(249,168,37,0.06) 8deg, transparent 16deg,
    transparent 38deg, rgba(0,229,255,0.05) 46deg, transparent 54deg,
    transparent 86deg, rgba(249,168,37,0.05) 94deg, transparent 102deg,
    transparent 138deg, rgba(0,229,255,0.04) 146deg, transparent 154deg,
    transparent 196deg, rgba(249,168,37,0.06) 204deg, transparent 212deg,
    transparent 248deg, rgba(0,229,255,0.05) 256deg, transparent 264deg,
    transparent 308deg, rgba(249,168,37,0.05) 316deg, transparent 324deg);
  animation:beamRotate 60s linear infinite"></div>
<!-- 中心辉光脉冲 -->
<div style="position:absolute;top:42%;left:50%;width:520px;height:520px;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,210,120,0.20),rgba(249,168,37,0.06),transparent 70%);
  filter:blur(60px);animation:glowPulse 4s ease-in-out infinite"></div>
<!-- 细网格底纹（密度感） -->
<div style="position:absolute;inset:0;opacity:0.04;
  background-image:linear-gradient(rgba(255,210,120,0.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,210,120,0.5) 1px,transparent 1px);
  background-size:80px 80px"></div>
<!-- 暗角聚光 -->
<div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 30%,rgba(0,0,0,0.55) 100%)"></div>
</div>
<div class="layer-fx">
  <!-- 爆发外环（GSAP 驱动有限脉冲） -->
  <div class="fx-pulse-ring" data-fx="hk-ring1" style="position:absolute;top:42%;left:50%;width:780px;height:780px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid rgba(249,168,37,0.55);z-index:2"></div>
  <div class="fx-pulse-ring" data-fx="hk-ring2" style="position:absolute;top:42%;left:50%;width:1100px;height:1100px;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(0,229,255,0.40);z-index:2"></div>
  <!-- 上升粒子流（新上榜密度上升） -->
  <div class="fx-spark" data-fx="hk-spark1" style="position:absolute;top:62%;left:18%;width:14px;height:14px;border-radius:50%;background:#ffd66b;box-shadow:0 0 26px #ffd66b;z-index:2"></div>
  <div class="fx-spark" data-fx="hk-spark2" style="position:absolute;top:70%;right:16%;width:12px;height:12px;border-radius:50%;background:#ff7a18;box-shadow:0 0 24px #ff7a18;z-index:2"></div>
  <div class="fx-spark" data-fx="hk-spark3" style="position:absolute;top:55%;left:48%;width:10px;height:10px;border-radius:50%;background:#00e5ff;box-shadow:0 0 22px #00e5ff;z-index:2"></div>
  <div class="fx-spark" data-fx="hk-spark4" style="position:absolute;top:48%;left:32%;width:8px;height:8px;border-radius:50%;background:#f9a825;box-shadow:0 0 18px #f9a825;z-index:2"></div>
</div>
<div class="layer-content">

<div class="hk-wrap">

  <div class="hk-sub" data-hook="sub">冲上榜单 · 榜首单日 <span class="hk-em">2130★</span></div>
</div>
</div>
