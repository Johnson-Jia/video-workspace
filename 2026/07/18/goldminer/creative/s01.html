<!-- 场景: hook | 时长: 4.73s | 暖金爆闪 + 钱袋破裂 -->
<div class="layer-bg">
  <!-- bg-component: radial_beams -->
</div>
<div class="layer-fx">
  <!-- 钱袋破裂裂纹（4 条） -->
  <div class="shatter-crack" style="top:30%;left:18%;width:3px;height:340px;transform:rotate(12deg);opacity:0.55"></div>
  <div class="shatter-crack" style="top:28%;left:78%;width:3px;height:380px;transform:rotate(-10deg);opacity:0.50"></div>
  <div class="shatter-crack" style="top:62%;left:32%;width:2px;height:240px;transform:rotate(22deg);opacity:0.40"></div>
  <div class="shatter-crack" style="top:60%;left:62%;width:2px;height:260px;transform:rotate(-18deg);opacity:0.42"></div>

  <!-- 金币散落（散布全屏） -->
  <div class="coin coin-lg" style="top:24%;left:14%"></div>
  <div class="coin coin-md" style="top:30%;left:72%"></div>
  <div class="coin coin-sm" style="top:18%;left:48%"></div>
  <div class="coin coin-md" style="top:70%;left:20%"></div>
  <div class="coin coin-lg" style="top:74%;left:78%"></div>
  <div class="coin coin-sm" style="top:46%;left:8%"></div>
  <div class="coin coin-sm" style="top:52%;left:86%"></div>
  <div class="coin coin-md" style="top:82%;left:46%"></div>

  <!-- 暖金光晕呼吸 -->
  <div class="fx-aura" style="position:absolute;top:8%;left:18%;width:300px;height:300px;background:radial-gradient(circle,hsla(38,90%,55%,0.30),transparent 70%);filter:blur(50px)"></div>
  <div class="fx-aura" style="position:absolute;top:60%;left:62%;width:340px;height:340px;background:radial-gradient(circle,hsla(20,90%,50%,0.26),transparent 70%);filter:blur(55px)"></div>
  <!-- 冲击波光束（钱袋破裂冲击感） -->
  <div class="fx-beam" style="position:absolute;top:40%;left:0;width:100%;height:3px;background:linear-gradient(90deg,transparent,rgba(255,107,0,0.55),transparent)"></div>
  <div class="fx-beam" style="position:absolute;top:58%;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,rgba(255,184,0,0.45),transparent)"></div>
  <!-- 金粉飘散 -->
  <div class="fx-particle" style="position:absolute;top:36%;left:30%;width:6px;height:6px;border-radius:50%;background:hsla(45,90%,65%,0.6);box-shadow:0 0 7px hsla(42,85%,55%,0.5)"></div>
  <div class="fx-particle" style="position:absolute;top:64%;left:54%;width:5px;height:5px;border-radius:50%;background:hsla(40,85%,60%,0.55);box-shadow:0 0 6px hsla(40,80%,52%,0.45)"></div>
</div>
<div class="layer-content">
<div class="phase phase-1">
  <div class="hook-sign">淘金！开淘！</div>
  <div class="hook-num">5.93亿</div>
  <div class="hook-sub">几周归零</div>
  <div class="hook-tag">5.93 亿美元融资 · 几周内归零</div>
</div>
</div>
<div class="layer-cinema">
  <div class="cinema-halation" style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 30%,rgba(255,107,0,0.10) 70%,transparent 100%);mix-blend-mode:screen"></div>
</div>
