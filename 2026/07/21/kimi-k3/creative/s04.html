<!-- 场景: opensource_value | 时长: 14.26s | 价格对比 + 四宫格优势 + 1TB门槛 -->
<div class="layer-bg">
  <!-- bg-component: amber_aura -->
</div>
<div class="layer-fx">
  <!-- 暖金开源光环 + 漂浮粒子（开源价值温暖感） -->
  <div class="fx-aura" style="top:14%;left:10%;width:420px;height:420px;background:radial-gradient(circle,rgba(245,158,11,0.40),rgba(251,191,36,0.18),transparent 70%);"></div>
  <div class="fx-aura" style="bottom:8%;right:8%;width:380px;height:380px;background:radial-gradient(circle,rgba(217,119,6,0.32),transparent 70%);"></div>
  <div class="fx-ring" style="top:calc(50% - 160px);left:calc(50% - 160px);width:320px;height:320px;border:2px solid rgba(251,191,36,0.45);"></div>
  <div class="fx-scan" style="top:30%;left:8%;width:84%;height:2px;background:linear-gradient(90deg,transparent,rgba(245,158,11,0.55),transparent);"></div>
  <div class="fx-particle" style="top:24%;left:28%;background:#fbbf24;box-shadow:0 0 12px rgba(251,191,36,0.7);"></div>
  <div class="fx-particle" style="top:72%;left:70%;background:#f59e0b;box-shadow:0 0 12px rgba(245,158,11,0.7);"></div>
  <div class="fx-particle" style="top:80%;left:34%;background:#fcd34d;box-shadow:0 0 10px rgba(252,211,77,0.6);"></div>
</div>
<div class="layer-content">
<div class="phase phase-1">
  <div class="price-stage">
    <div class="scene-eyebrow gold">开 源 的 好 处 实 打 实</div>
    <div class="price-compare">
      <div class="price-col open">
        <div class="price-col-label">K3 接口</div>
        <div class="price-col-num">$15</div>
        <div class="price-col-unit">每百万 token</div>
      </div>
      <div class="price-divider">vs</div>
      <div class="price-col closed">
        <div class="price-col-label">闭源那家</div>
        <div class="price-col-num">$50</div>
        <div class="price-col-unit">每百万 token</div>
      </div>
    </div>
    <div class="versus-extra">
      <span class="versus-chip" style="background:rgba(245,158,11,0.14);border-color:rgba(245,158,11,0.45);color:var(--accent-gold-soft);">价格只有 三分之一</span>
    </div>
  </div>
</div>
<div class="phase phase-2">
  <div class="price-stage">
    <div class="scene-eyebrow gold">优 势 与 门 槛</div>
    <div class="feat-grid">
      <div class="feat-cell open">
        <div class="feat-icon">↓</div>
        <div>
          <div class="feat-text">本地部署</div>
          <div class="feat-sub">数据不出户</div>
        </div>
      </div>
      <div class="feat-cell gold">
        <div class="feat-icon">⚙</div>
        <div>
          <div class="feat-text">自己微调</div>
          <div class="feat-sub">专域优化</div>
        </div>
      </div>
      <div class="feat-cell blue">
        <div class="feat-icon">▤</div>
        <div>
          <div class="feat-text">架构全透明</div>
          <div class="feat-sub">可复现可审查</div>
        </div>
      </div>
      <div class="feat-cell warn">
        <div class="feat-icon">!</div>
        <div>
          <div class="feat-text">门槛 1TB 显存</div>
          <div class="feat-sub">普通人跑不动</div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
<div class="layer-cinema">
  <div class="cinema-vignette"></div>
</div>
