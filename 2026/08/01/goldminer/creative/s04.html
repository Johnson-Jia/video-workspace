<!-- 场景: loot | 时长: 30.9s | 三教训 → 订阅死区+转型太慢 → 可偷点子CodeQuest -->
<div class="layer-bg">
<!-- bg-component: contour_lines -->
</div>
<div class="layer-fx">
  <!-- 暖金光晕（淘到宝的暖意） -->
  <div class="fx-aura" style="position:absolute;top:14%;left:50%;width:420px;height:420px;margin-left:-210px;background:radial-gradient(circle,hsla(40,90%,55%,0.25),transparent 70%);filter:blur(60px)"></div>
  <div class="fx-aura" style="position:absolute;top:62%;left:20%;width:340px;height:340px;background:radial-gradient(circle,hsla(35,80%,50%,0.20),transparent 70%);filter:blur(55px)"></div>
  <!-- 金尘漂浮（收获质感） -->
  <div class="fx-particle" style="position:absolute;top:60%;left:24%;width:5px;height:5px;border-radius:50%;background:hsla(45,90%,65%,0.55);box-shadow:0 0 6px hsla(42,85%,55%,0.45)"></div>
  <div class="fx-particle" style="position:absolute;top:55%;left:70%;width:6px;height:6px;border-radius:50%;background:hsla(42,88%,62%,0.55);box-shadow:0 0 7px hsla(40,80%,52%,0.45)"></div>
  <div class="fx-particle" style="position:absolute;top:48%;left:88%;width:4px;height:4px;border-radius:50%;background:hsla(48,90%,68%,0.50);box-shadow:0 0 5px hsla(45,85%,58%,0.40)"></div>
  <div class="fx-particle" style="position:absolute;top:42%;left:12%;width:5px;height:5px;border-radius:50%;background:hsla(45,90%,65%,0.50);box-shadow:0 0 6px hsla(42,85%,55%,0.40)"></div>
  <!-- 脉冲环（淘金发现感） -->
  <div class="fx-pulse-ring" style="position:absolute;top:50%;left:50%;width:260px;height:260px;margin:-130px 0 0 -130px;border:2px solid rgba(255,184,0,0.22);border-radius:50%"></div>
</div>
<div class="layer-content">
<div class="phase phase-1">
  <div class="loot-title">淘金 · 首个教训</div>
  <div style="margin-top:36px;width:100%">
    <div class="lesson-bar">
      <span class="lesson-num">其一</span>
      <div>
        <div class="lesson-title">监管集中风险</div>
        <div class="lesson-detail">营收全压中国 · 手握 3.6 亿美金</div>
      </div>
    </div>
    <div class="turnaround-row">
      <span class="turnaround-tag">原则</span>
      <span class="turnaround-text">单一国家别超 40%</span>
    </div>
    <div class="turnaround-row">
      <span class="turnaround-tag" style="color:var(--danger-soft)">回头看</span>
      <span class="turnaround-text">2018 年就该出海</span>
    </div>
  </div>
</div>
<div class="phase phase-2">
  <div class="loot-title">教训二·三</div>
  <div style="margin-top:28px;width:100%">
    <div class="lesson-bar">
      <span class="lesson-num">其二</span>
      <div>
        <div class="lesson-title">订阅死区</div>
        <div class="lesson-detail">月费三五十块 · 进退两难</div>
      </div>
    </div>
    <div class="deadzone-num" style="margin-top:14px">¥30-50</div>
    <div class="feat-detail" style="text-align:center;color:var(--amber-soft);margin-top:4px">太贵当不了休闲·太便宜做不出深度</div>
    <div class="lesson-bar" style="margin-top:22px">
      <span class="lesson-num">其三</span>
      <div>
        <div class="lesson-title">转型太慢</div>
        <div class="lesson-detail">危机来了 · 要快转身</div>
      </div>
    </div>
    <div class="turnaround-row">
      <span class="turnaround-tag" style="color:var(--danger-soft)">死</span>
      <span class="turnaround-text">9 个月销售周期</span>
    </div>
    <div class="turnaround-row" style="border-left-color:var(--cool-green)">
      <span class="turnaround-tag" style="color:#8BE9A8">活</span>
      <span class="turnaround-text">60 天能赚钱的转身</span>
    </div>
  </div>
</div>
<div class="phase phase-3">
  <div class="pivot-badge">可偷的点子</div>
  <div class="pivot-name" style="margin-top:16px">CodeQuest</div>
  <div class="feat-detail" style="text-align:center;margin-top:6px;color:var(--text-gold)">AI 编程教育 · 三招翻盘</div>
  <div style="margin-top:24px;width:100%">
    <div class="turnaround-row" style="border-left-color:var(--cool-green)">
      <span class="turnaround-tag" style="color:#8BE9A8">01</span>
      <span class="turnaround-text">大模型当 AI 老师 · 砍人力成本</span>
    </div>
    <div class="turnaround-row" style="border-left-color:var(--cool-green)">
      <span class="turnaround-tag" style="color:#8BE9A8">02</span>
      <span class="turnaround-text">免费基础课引流 · 高级课变现</span>
    </div>
    <div class="turnaround-row" style="border-left-color:var(--cool-green)">
      <span class="turnaround-tag" style="color:#8BE9A8">03</span>
      <span class="turnaround-text">出海东南亚 · 避开中国监管</span>
    </div>
  </div>
</div>
</div>
<div class="layer-cinema">
  <div class="cinema-halation" style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(255,184,0,0.08) 85%,transparent 100%);mix-blend-mode:screen"></div>
