<!-- 场景: seg4 | 时长: ~17.7s | bg: contour_lines | 自评4级阶梯：1未见/2入门/3胜任/4精通 -->
<div class="layer-bg">
  <!-- bg-component: contour_lines -->
</div>

<div class="layer-fx">
  <!-- fx-pulse 金色静态光晕（3/4 级金边强调，右下方，alpha 0.18 ≤0.22） -->
  <div class="fx-pulse" style="position:absolute;top:50%;left:72%;transform:translate(-50%,-50%);width:760px;height:340px;border-radius:50%;background:radial-gradient(ellipse, hsla(43,90%,55%,0.18) 0%, transparent 65%);filter:blur(55px);opacity:0.6"></div>
  <!-- fx-pulse 蓝色静态光晕（左上方，呼应打分理性） -->
  <div class="fx-pulse" style="position:absolute;top:42%;left:28%;transform:translate(-50%,-50%);width:620px;height:300px;border-radius:50%;background:radial-gradient(ellipse, hsla(215,72%,55%,0.16) 0%, transparent 65%);filter:blur(55px);opacity:0.55"></div>
  <!-- fx-blink 冷色锚点（平衡构图） -->
  <div class="fx-blink" style="position:absolute;top:18%;right:14%;width:12px;height:12px;border-radius:50%;background:hsla(43,90%,60%,0.85);box-shadow:0 0 15px hsla(43,85%,55%,0.5)"></div>
  <div class="fx-blink" style="position:absolute;bottom:14%;left:14%;width:12px;height:12px;border-radius:50%;background:hsla(215,75%,62%,0.85);box-shadow:0 0 15px hsla(215,70%,56%,0.5)"></div>
</div>

<div class="layer-content">
<div class="phase phase-1 tut-scene tut-lvl-scene">  <!-- 教程模式：单 phase + 多 region + data-reveal（不切 phase） -->
  <div class="tut-grid lvl-grid">

    <!-- 区域 A：标尺标题（data-reveal=0，左对齐建视觉锚点） -->
    <div class="tut-region lvl-head" data-reveal="0" data-reveal-dir="fade">
      <div class="con-eyebrow">能力自评矩阵</div>
      <h1 class="scene-title">逐项打分 · 四个等级，先看自己的缺口</h1>
    </div>

    <!-- 区域 B：4 级阶梯（data-reveal=2，四级进度条依次点亮，3/4 金边） -->
    <div class="tut-region lvl-row" data-reveal="2" data-reveal-dir="top">
      <div class="lvl-card">
        <div class="lvl-top"><span class="lvl-num grad-blue">1</span><span class="lvl-name">未见</span></div>
        <div class="lvl-track"><div class="lvl-fill"></div></div>
      </div>
      <div class="lvl-card">
        <div class="lvl-top"><span class="lvl-num grad-blue">2</span><span class="lvl-name">入门</span></div>
        <div class="lvl-track"><div class="lvl-fill"></div></div>
      </div>
      <div class="lvl-card lvl-strong">
        <div class="lvl-top"><span class="lvl-num grad-gold">3</span><span class="lvl-name">胜任</span></div>
        <div class="lvl-track"><div class="lvl-fill"></div></div>
        <div class="lvl-note">交给你一个客户场景能独立扛</div>
      </div>
      <div class="lvl-card lvl-strong">
        <div class="lvl-top"><span class="lvl-num grad-gold">4</span><span class="lvl-name">精通</span></div>
        <div class="lvl-track"><div class="lvl-fill"></div></div>
        <div class="lvl-note">别人卡住了来找你</div>
      </div>
    </div>

  </div>
</div>
</div>

<div class="layer-cinema">
  <!-- 教程类克制，无 cinema 后处理签名 -->
</div>
