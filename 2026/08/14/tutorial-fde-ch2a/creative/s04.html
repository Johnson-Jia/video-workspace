<!-- 场景: scene-4 | 时长: ~23.0s | bg: clean_slate | 客服案例填入六格（虚构脱敏示意） -->
<div class="layer-bg">
  <!-- bg-component: clean_slate -->
</div>

<div class="layer-fx">
  <!-- fx-aura 金色低 alpha 光晕（案例数据区，alpha≤0.22） -->
  <div class="fx-pulse" style="position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);width:1300px;height:520px;border-radius:50%;background:radial-gradient(ellipse, hsla(43,88%,55%,0.16) 0%, transparent 65%);filter:blur(65px);opacity:0.6"></div>
  <!-- fx-blink 冷蓝锚点（数据锚点，平衡构图） -->
  <div class="fx-blink" style="position:absolute;top:20%;right:15%;width:12px;height:12px;border-radius:50%;background:hsla(215,78%,62%,0.85);box-shadow:0 0 15px hsla(215,70%,56%,0.5)"></div>
  <div class="fx-blink" style="position:absolute;bottom:20%;left:15%;width:11px;height:11px;border-radius:50%;background:hsla(43,86%,58%,0.75);box-shadow:0 0 14px hsla(43,78%,52%,0.42)"></div>
</div>

<div class="layer-content">
<div class="phase phase-1 tut-scene">
  <div class="tut-grid canvas-grid">

    <!-- 区域 A：案例口径标签（data-reveal=0，严谨感） -->
    <div class="tut-region case-label" data-reveal="0" data-reveal-dir="fade">
      <span class="case-pill">虚构脱敏 · 示意案例 · 非真实客户</span>
    </div>

    <!-- 区域 B：六格填入客服案例数据（data-reveal=3，2×3 网格撑满，关键数字金色） -->
    <div class="tut-region canvas-board" data-reveal="3" data-reveal-dir="top">
      <div class="canvas-cell">
        <div class="cell-head"><span class="cell-idx">①</span><span class="cell-title">业务现状</span></div>
        <div class="cell-data">日均约 <span class="num">4000</span> 条工单 · 全靠人工分流</div>
      </div>
      <div class="canvas-cell">
        <div class="cell-head"><span class="cell-idx">②</span><span class="cell-title">痛点清单</span></div>
        <div class="cell-data">分流准确率约 <span class="num">82%</span> · 人工瓶颈</div>
      </div>
      <div class="canvas-cell">
        <div class="cell-head"><span class="cell-idx">③</span><span class="cell-title">AI 发力点</span></div>
        <div class="cell-data">工单自动分流 + 草拟回复</div>
      </div>
      <div class="canvas-cell">
        <div class="cell-head"><span class="cell-idx">④</span><span class="cell-title">价值假设</span></div>
        <div class="cell-data">准确率提到 <span class="num">95%</span> 以上 · 待验证</div>
      </div>
      <div class="canvas-cell">
        <div class="cell-head"><span class="cell-idx">⑤</span><span class="cell-title">约束</span></div>
        <div class="cell-data"><span class="num-blue">不碰</span>最终发送 · 草稿客服审核后才发</div>
      </div>
      <div class="canvas-cell">
        <div class="cell-head"><span class="cell-idx">⑥</span><span class="cell-title">下一步</span></div>
        <div class="cell-data">圈最小验证范围</div>
      </div>
    </div>

  </div>
</div>
</div>

<div class="layer-cinema">
  <!-- 教程类克制，无 cinema 后处理签名 -->
</div>
