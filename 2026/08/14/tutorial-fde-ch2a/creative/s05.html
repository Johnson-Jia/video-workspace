<div class="layer-fx">

  <div class="fx-blink" style="position:absolute;top:20%;right:15%;width:12px;height:12px;border-radius:50%;background:hsla(43,86%,58%,0.82);box-shadow:0 0 15px hsla(43,78%,52%,0.45)"></div>
