<!-- 场景: seg2 | 时长: ~16.7s | bg: gradient_mesh | RAG 卡详：三层改造（脱敏/隔离/回写） -->
<div class="layer-bg">

</div>

<div class="layer-fx">
  <!-- fx-pulse 金色静态光晕（RAG 重点，暖色 alpha 0.18 ≤ 0.22，禁划过类） -->

  <div class="fx-blink" style="position:absolute;top:22%;right:14%;width:12px;height:12px;border-radius:50%;background:hsla(215,75%,62%,0.85);box-shadow:0 0 15px hsla(215,70%,56%,0.5)"></div>
  <div class="fx-blink" style="position:absolute;bottom:22%;right:18%;width:10px;height:10px;border-radius:50%;background:hsla(215,70%,60%,0.75);box-shadow:0 0 13px hsla(215,65%,54%,0.45)"></div>
</div>

<div class="layer-content">
