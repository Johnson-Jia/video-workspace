<!-- 场景: seg1 | 时长: ~4s | bg: clean_slate | hook：同一个角色 · 甲方↔乙方 · 考核竟然不一样 -->
<div class="layer-bg">
  <!-- bg-component: clean_slate -->
</div>

<div class="layer-fx">
  <!-- fx-pulse 蓝金双静态光晕（对照大字后方呼吸，金 alpha 0.18 ≤ 0.22，禁划过类 fx） -->
  <div class="fx-pulse" style="position:absolute;top:50%;left:28%;transform:translate(-50%,-50%);width:760px;height:480px;border-radius:50%;background:radial-gradient(ellipse, hsla(215,65%,45%,0.20) 0%, transparent 65%);filter:blur(55px);opacity:0.7"></div>
  <div class="fx-pulse" style="position:absolute;top:50%;left:72%;transform:translate(-50%,-50%);width:760px;height:480px;border-radius:50%;background:radial-gradient(ellipse, hsla(43,90%,55%,0.18) 0%, transparent 65%);filter:blur(55px);opacity:0.7"></div>
  <!-- fx-blink 冷蓝锚点 -->
  <div class="fx-blink" style="position:absolute;top:18%;right:16%;width:14px;height:14px;border-radius:50%;background:hsla(215,75%,62%,0.85);box-shadow:0 0 16px hsla(215,70%,56%,0.5)"></div>
  <div class="fx-blink" style="position:absolute;bottom:20%;left:16%;width:11px;height:11px;border-radius:50%;background:hsla(43,80%,58%,0.75);box-shadow:0 0 14px hsla(43,70%,52%,0.45)"></div>
</div>

<div class="layer-content">
<div class="phase phase-1 tut-scene">
  <div class="tut-region hook-wrap" data-reveal="0" data-reveal-dir="fade">
    <div class="con-eyebrow">同一个角色</div>
    <div class="hk-pair">
      <span class="hk-side grad-blue">甲方</span>
      <span class="hk-vs">↔</span>
      <span class="hk-side grad-gold">乙方</span>
    </div>
    <div class="hook-title grad-gold">考核竟然不一样</div>
  </div>
</div>
</div>
