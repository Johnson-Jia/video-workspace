<!-- 场景: seg1 | 时长: ~4.3s | bg: clean_slate | 数据钩子：两年招聘增长 42 倍 -->
<div class="layer-bg">
  <!-- bg-component: clean_slate -->
</div>

<div class="layer-fx">
  <!-- fx-aura 金色静态光晕（大数字后方脉冲呼吸，alpha 0.18，禁划过类 fx） -->
  <div class="fx-pulse" style="position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);width:1100px;height:440px;border-radius:50%;background:radial-gradient(ellipse, hsla(43,90%,55%,0.18) 0%, transparent 65%);filter:blur(55px);opacity:0.7"></div>
  <!-- fx-blink 冷色锚点（平衡构图，暖色预算已给光晕，锚点用冷蓝） -->
  <div class="fx-blink" style="position:absolute;top:22%;right:14%;width:14px;height:14px;border-radius:50%;background:hsla(215,75%,62%,0.85);box-shadow:0 0 16px hsla(215,70%,56%,0.5)"></div>
  <div class="fx-blink" style="position:absolute;bottom:24%;left:15%;width:11px;height:11px;border-radius:50%;background:hsla(215,70%,60%,0.75);box-shadow:0 0 14px hsla(215,65%,54%,0.45)"></div>
</div>

<div class="layer-content">
<div class="phase phase-1 tut-scene tut-hook-scene">  <!-- 教程模式：单 phase + 多 region + data-reveal（不切 phase） -->
  <div class="tut-grid hook-grid">

    <!-- 区域：数字钩子（data-reveal=0，场景开始即显示，数据冲击） -->
    <div class="tut-region hook-hero" data-reveal="0" data-reveal-dir="fade">
      <div class="con-eyebrow">一个岗位</div>
      <div class="hero-row">
        <span class="hero-num grad-gold" data-count-to="42" data-count-at="0.3">0</span>
        <span class="hero-unit grad-gold">倍<em class="hero-arrow">↑</em></span>
      </div>
      <div class="con-stamp">两年 · 招聘增长</div>
    </div>

  </div>
</div>
</div>

<div class="layer-cinema">
  <!-- 教程类克制，无 cinema 后处理签名 -->
</div>
