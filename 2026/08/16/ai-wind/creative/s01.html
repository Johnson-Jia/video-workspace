<!-- 场景: hook | 时长: 3.05s | 4GB vs 8B 数字对峙（紫青双线开场编码） -->
<div class="layer-bg">
  <!-- bg-component: radial_beams -->
</div>
<div class="layer-fx">
  <!-- 紫青双环对峙（fx-pulse 脉冲，两线能量对冲）-->
  <div class="fx-ring fx-pulse" style="width:560px;height:560px;left:26%;top:38%;margin:-280px 0 0 -280px;border-color:rgba(168,85,247,0.55);box-shadow:0 0 80px rgba(168,85,247,0.35) inset;"></div>
  <div class="fx-ring fx-pulse" style="width:560px;height:560px;left:74%;top:38%;margin:-280px 0 0 -280px;border-color:rgba(0,212,255,0.50);box-shadow:0 0 80px rgba(0,212,255,0.32) inset;"></div>
  <!-- 能量对撞闪（fx-bolt，数字撞击的冲击瞬间）-->
  <div class="fx-bolt fx-blink" style="background:radial-gradient(circle at 50% 34%, rgba(192,132,252,0.42), rgba(0,212,255,0.20) 40%, transparent 65%);"></div>
  <!-- 紫/青锚点粒子（fx-drift 漂浮，双线阵营分布）-->
  <div class="fx-dot fx-drift" style="width:16px;height:16px;left:16%;top:24%;background:#C084FC;box-shadow:0 0 18px rgba(168,85,247,0.8);"></div>
  <div class="fx-dot fx-drift" style="width:13px;height:13px;left:82%;top:22%;background:#00D4FF;box-shadow:0 0 16px rgba(0,212,255,0.8);"></div>
  <div class="fx-dot fx-drift" style="width:14px;height:14px;left:12%;top:70%;background:#00D4FF;box-shadow:0 0 16px rgba(0,212,255,0.8);"></div>
  <div class="fx-dot fx-drift" style="width:16px;height:16px;left:86%;top:68%;background:#C084FC;box-shadow:0 0 18px rgba(168,85,247,0.8);"></div>
  <!-- 交锋火花（fx-blink，对撞点闪烁）-->
  <div class="fx-dot fx-blink" style="width:10px;height:10px;left:50%;top:20%;background:#FF6B35;box-shadow:0 0 16px rgba(255,107,53,0.8);"></div>
  <div class="fx-dot fx-blink" style="width:9px;height:9px;left:47%;top:80%;background:#C084FC;box-shadow:0 0 14px rgba(192,132,252,0.8);"></div>
</div>
