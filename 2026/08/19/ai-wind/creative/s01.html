<!-- 场景: hook | 时长: 2.64s | 14MB 巨型数字 × 手表微缩（mystery-box 开盒瞬间，首帧即冲击） -->
<div class="layer-bg">
<!-- bg-component: cosmic_void -->
</div>
<div class="layer-fx">
  <!-- 悬念盒能量环（fx-pulse 紫环，星门呼应） -->
  <div class="fx-ring fx-pulse" style="width:620px;height:620px;left:50%;top:40%;margin:-310px 0 0 -310px;border-color:rgba(192,132,252,0.42);box-shadow:0 0 90px rgba(168,85,247,0.3) inset;"></div>
  <!-- 青色副环（体积下限的冷光） -->
  <div class="fx-ring fx-pulse" style="width:420px;height:420px;left:50%;top:40%;margin:-210px 0 0 -210px;border-color:rgba(0,212,255,0.34);box-shadow:0 0 70px rgba(0,212,255,0.22) inset;"></div>
  <!-- 开盒冲击闪（fx-bolt 紫，数字落定的瞬间） -->
  <div class="fx-bolt fx-blink" style="background:radial-gradient(circle at 50% 38%, rgba(192,132,252,0.4), rgba(0,212,255,0.18) 42%, transparent 66%);"></div>
  <!-- 星尘粒子（fx-drift，宇宙尺度锚点） -->
  <div class="fx-dot fx-drift" style="width:14px;height:14px;left:12%;top:26%;background:#C084FC;box-shadow:0 0 18px rgba(168,85,247,0.8);"></div>
  <div class="fx-dot fx-drift" style="width:12px;height:12px;left:86%;top:30%;background:#00D4FF;box-shadow:0 0 16px rgba(0,212,255,0.8);"></div>
  <div class="fx-dot fx-drift" style="width:13px;height:13px;left:18%;top:72%;background:#A855F7;box-shadow:0 0 16px rgba(168,85,247,0.8);"></div>
  <div class="fx-dot fx-drift" style="width:11px;height:11px;left:80%;top:68%;background:#C084FC;box-shadow:0 0 14px rgba(192,132,252,0.8);"></div>
  <!-- 尺度对照闪点（fx-blink 橙，微型强调） -->
  <div class="fx-dot fx-blink" style="width:10px;height:10px;left:50%;top:16%;background:#FF6B35;box-shadow:0 0 16px rgba(255,107,53,0.8);"></div>
</div>
<div class="layer-content">
<div class="phase phase-1">
  <div class="hook-wrap">
    <div class="hook-badge">AI 风向标</div>
    <div class="hook-scale-row">
      <div class="hook-num">14MB</div>
      <div class="hook-watch">
        <div class="hook-watch-strap"></div>
        <div class="hook-watch-face"><div class="hook-watch-core"></div></div>
        <div class="hook-watch-strap"></div>
      </div>
    </div>
    <div class="hook-line grad-cyan">AI 装进手表里</div>
  </div>
</div>
</div>
<div class="layer-cinema">
</div>
