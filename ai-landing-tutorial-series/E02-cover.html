<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>E02 思想转变 · AI 提效转型实战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1920px;height:1080px;background:#0F172A;font-family:'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;color:#fff;overflow:hidden;}
.cover{position:relative;width:1920px;height:1080px;padding:64px 110px 56px;display:flex;flex-direction:column;background:linear-gradient(135deg,#0F172A 0%,#1E293B 55%,#0F172A 100%);}

/* bg 装饰 */
.grid-bg{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(96,165,250,0.09) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;}
.glow-gold{position:absolute;width:820px;height:820px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,0.18),transparent 70%);filter:blur(100px);top:-220px;right:-160px;pointer-events:none;}
.glow-blue{position:absolute;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,0.18),transparent 70%);filter:blur(90px);bottom:-160px;left:-110px;pointer-events:none;}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse 78%72% at 50% 48%, transparent 0%, rgba(15,23,42,0.35) 75%, rgba(8,12,24,0.55) 100%);pointer-events:none;}
.corner-tl{position:absolute;top:32px;left:32px;width:130px;height:3px;background:linear-gradient(90deg,rgba(251,191,36,0.55),transparent);}
.corner-tl-v{position:absolute;top:32px;left:32px;width:3px;height:88px;background:linear-gradient(180deg,rgba(251,191,36,0.55),transparent);}
.corner-br{position:absolute;bottom:32px;right:32px;width:130px;height:3px;background:linear-gradient(270deg,rgba(96,165,250,0.45),transparent);}
.corner-br-v{position:absolute;bottom:32px;right:32px;width:3px;height:88px;background:linear-gradient(0deg,rgba(96,165,250,0.45),transparent);}

/* 顶部 */
.top-row{position:relative;z-index:2;display:flex;align-items:center;gap:24px;margin-bottom:20px;}
.ep-num{font-family:'JetBrains Mono','Consolas',monospace;font-size:84px;font-weight:900;line-height:1;letter-spacing:0.02em;background:linear-gradient(135deg,#FBBF24 0%,#F59E0B 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:0 0 30px rgba(251,191,36,0.20);}
.badge{display:inline-flex;align-items:center;gap:12px;font-size:26px;color:#60A5FA;letter-spacing:0.20em;border:1.5px solid rgba(96,165,250,0.42);background:rgba(59,130,246,0.10);padding:9px 24px;border-radius:999px;font-weight:600;}
.badge-dot{width:11px;height:11px;border-radius:50%;background:#FBBF24;box-shadow:0 0 12px rgba(251,191,36,0.7);}

/* 标题（反常识钩子）*/
.title{position:relative;z-index:2;font-size:128px;font-weight:900;line-height:1.04;letter-spacing:-0.01em;margin-top:8px;}
.title-grad{background:linear-gradient(135deg,#FBBF24 0%,#F59E0B 60%,#FCD34D 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:0 0 44px rgba(251,191,36,0.20);}
.subtitle{position:relative;z-index:2;font-size:40px;color:rgba(255,255,255,0.82);margin-top:18px;font-weight:500;letter-spacing:0.02em;}
.subtitle .sub-strong{color:#60A5FA;font-weight:700;}
.subtitle .sub-gold{color:#FBBF24;font-weight:700;}

/* 5 原理卡 */
.principles-label{position:relative;z-index:2;font-size:24px;color:#60A5FA;letter-spacing:0.14em;font-weight:700;margin-top:46px;margin-bottom:16px;}
.principles{position:relative;z-index:2;display:grid;grid-template-columns:repeat(5,1fr);gap:20px;}
.pr-card{border-radius:18px;padding:26px 16px;border:2px solid rgba(96,165,250,0.40);background:linear-gradient(165deg,rgba(59,130,246,0.12),rgba(15,23,42,0.60));display:flex;flex-direction:column;align-items:center;gap:12px;}
.pr-num{font-family:'JetBrains Mono','Consolas',monospace;font-size:44px;font-weight:900;color:#FBBF24;line-height:1;text-shadow:0 0 16px rgba(251,191,36,0.22);}
.pr-name{font-size:30px;font-weight:800;color:#fff;line-height:1.2;text-align:center;}
.pr-desc{font-size:21px;color:rgba(255,255,255,0.6);text-align:center;line-height:1.3;}

/* 金句：人是根本 */
.conclusion{position:relative;z-index:2;margin-top:auto;padding:24px 40px;border-radius:18px;border:2px solid rgba(16,185,129,0.50);background:linear-gradient(90deg,rgba(16,185,129,0.12),rgba(15,23,42,0.50));display:flex;justify-content:center;align-items:center;gap:24px;}
.conclusion-eq{font-family:'JetBrains Mono',monospace;font-size:48px;font-weight:900;color:#34D399;}
.conclusion-text{font-size:44px;font-weight:700;color:#fff;}
.conclusion-strong{background:linear-gradient(92deg,#34D399 0%,#10B981 55%,#047857 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;font-size:52px;font-weight:900;}

/* 底部 */
.footer{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding-top:18px;border-top:1px solid rgba(96,165,250,0.22);}
.repo{font-size:26px;color:rgba(255,255,255,0.85);font-family:'JetBrains Mono',monospace;font-weight:600;display:flex;align-items:center;gap:12px;}
.repo .repo-label{color:#60A5FA;font-weight:700;letter-spacing:0.06em;font-family:'Inter','Noto Sans SC',sans-serif;font-size:23px;}
.repo .repo-path{background:rgba(59,130,246,0.12);padding:5px 14px;border-radius:8px;border:1px solid rgba(96,165,250,0.25);}
.author{font-size:24px;color:rgba(255,255,255,0.66);}
.author .author-name{color:#FBBF24;font-weight:700;}
</style>
</head>
<body>
<div class="cover">

  <!-- 顶部 -->
  <div class="top-row">

  <div class="subtitle">转型<span class="sub-gold">起手</span>不是上工具 · 是<span class="sub-strong">思想转变 + 懂原理</span></div>

  <!-- 5 原理卡 -->
  <div class="principles-label">5 条 AI 原理速通 · 精准交互的地基</div>
  <div class="principles">

  <!-- 金句 -->

    <span class="conclusion-strong">人是根本</span>
  </div>

  <!-- 底部 -->
  <div class="footer">
    <div class="repo"><span class="repo-label">教程仓库</span><span class="repo-path">Johnson-Jia/ai-landing-tutorial</span></div>

  </div>
</div>
