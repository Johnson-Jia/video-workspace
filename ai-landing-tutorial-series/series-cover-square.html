<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 提效转型实战 · 合集封面（方版）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1080px;background:#0F172A;font-family:'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;color:#fff;overflow:hidden;}
.cover{position:relative;width:1080px;height:1080px;padding:56px 64px;display:flex;flex-direction:column;background:linear-gradient(150deg,#0F172A 0%,#1E293B 55%,#0F172A 100%);}

/* bg 装饰 */
.grid-bg{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(96,165,250,0.09) 1px,transparent 1px);background-size:54px 54px;pointer-events:none;}
.glow-blue{position:absolute;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,0.22),transparent 70%);filter:blur(90px);top:-140px;right:-100px;pointer-events:none;}
.glow-gold{position:absolute;width:440px;height:440px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,0.14),transparent 70%);filter:blur(80px);bottom:-120px;left:-80px;pointer-events:none;}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse 80%75% at 50% 48%, transparent 0%, rgba(15,23,42,0.35) 75%, rgba(8,12,24,0.55) 100%);pointer-events:none;}
.corner-tl{position:absolute;top:28px;left:28px;width:100px;height:3px;background:linear-gradient(90deg,rgba(96,165,250,0.55),transparent);}
.corner-tl-v{position:absolute;top:28px;left:28px;width:3px;height:72px;background:linear-gradient(180deg,rgba(96,165,250,0.55),transparent);}
.corner-br{position:absolute;bottom:28px;right:28px;width:100px;height:3px;background:linear-gradient(270deg,rgba(251,191,36,0.45),transparent);}
.corner-br-v{position:absolute;bottom:28px;right:28px;width:3px;height:72px;background:linear-gradient(0deg,rgba(251,191,36,0.45),transparent);}

/* —— 顶部 badge —— */
.header{position:relative;z-index:2;display:flex;justify-content:center;margin-bottom:24px;}
.badge{display:inline-flex;align-items:center;gap:12px;font-size:24px;color:#60A5FA;letter-spacing:0.20em;border:1.5px solid rgba(96,165,250,0.42);background:rgba(59,130,246,0.10);padding:8px 22px;border-radius:999px;font-weight:600;}
.badge-dot{width:10px;height:10px;border-radius:50%;background:#FBBF24;box-shadow:0 0 12px rgba(251,191,36,0.7);}

/* —— 标题 —— */
.title-wrap{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;}
.title{font-size:82px;font-weight:900;line-height:1.05;letter-spacing:-0.01em;}
.title-grad{background:linear-gradient(135deg,#FBBF24 0%,#60A5FA 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:0 0 40px rgba(96,165,250,0.18);}
.subtitle{font-size:32px;color:rgba(255,255,255,0.82);font-weight:500;letter-spacing:0.02em;}
.subtitle .sub-strong{color:#FBBF24;font-weight:700;}

/* —— 数据卡 —— */
.data{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:40px;}
.data-card{border-radius:18px;padding:24px 16px;border:2px solid;background:rgba(15,23,42,0.55);display:flex;flex-direction:column;align-items:center;gap:8px;}
.data-card.gold{border-color:rgba(251,191,36,0.55);background:linear-gradient(165deg,rgba(251,191,36,0.12),rgba(15,23,42,0.60));box-shadow:0 0 40px rgba(251,191,36,0.08) inset;}
.data-card.blue{border-color:rgba(59,130,246,0.55);background:linear-gradient(165deg,rgba(59,130,246,0.12),rgba(15,23,42,0.60));box-shadow:0 0 40px rgba(59,130,246,0.08) inset;}
.data-card.green{border-color:rgba(16,185,129,0.55);background:linear-gradient(165deg,rgba(16,185,129,0.12),rgba(15,23,42,0.60));box-shadow:0 0 40px rgba(16,185,129,0.08) inset;}
.data-num{font-size:62px;font-weight:900;line-height:1;letter-spacing:-0.02em;font-family:'JetBrains Mono','Consolas',monospace;}
.data-card.gold .data-num{color:#FBBF24;text-shadow:0 0 18px rgba(251,191,36,0.22);}
.data-card.blue .data-num{color:#60A5FA;text-shadow:0 0 18px rgba(96,165,250,0.22);}
.data-card.green .data-num{color:#34D399;text-shadow:0 0 18px rgba(52,211,153,0.22);}
.data-label{font-size:24px;color:rgba(255,255,255,0.74);font-weight:600;}

/* —— 中部 meta —— */
.meta{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:36px;}
.meta-row{display:flex;align-items:center;gap:14px;font-size:28px;font-weight:700;}
.meta-row .meta-icon{color:#FBBF24;font-size:24px;}
.meta-row .meta-text{color:#E0E7FF;}
.meta-row .meta-strong{color:#FBBF24;}
.meta-sep{width:120px;height:2px;background:linear-gradient(90deg,transparent,rgba(96,165,250,0.4),transparent);margin:6px 0;}

/* —— 技术栈关键词胶囊 —— */
.tech-tags{position:relative;z-index:2;display:flex;justify-content:center;flex-wrap:wrap;gap:11px;margin-top:24px;padding:0 20px;}
.tech-tag{font-family:'JetBrains Mono','Consolas',monospace;font-size:22px;font-weight:700;color:#93C5FD;padding:7px 18px;border-radius:999px;border:1.5px solid rgba(96,165,250,0.40);background:linear-gradient(135deg,rgba(59,130,246,0.14),rgba(15,23,42,0.50));letter-spacing:0.04em;}

/* —— 底部 —— */
.footer{position:relative;z-index:2;margin-top:auto;padding-top:24px;border-top:1px solid rgba(96,165,250,0.22);display:flex;flex-direction:column;align-items:center;gap:8px;}
.repo{font-size:23px;color:rgba(255,255,255,0.85);font-family:'JetBrains Mono',monospace;font-weight:600;display:flex;align-items:center;gap:10px;}
.repo .repo-label{color:#60A5FA;font-weight:700;letter-spacing:0.06em;font-family:'Inter','Noto Sans SC',sans-serif;font-size:21px;}
.repo .repo-path{background:rgba(59,130,246,0.12);padding:4px 12px;border-radius:7px;border:1px solid rgba(96,165,250,0.25);}
.author{font-size:21px;color:rgba(255,255,255,0.6);}
.author .author-name{color:#FBBF24;font-weight:700;}
.author .author-role{color:rgba(255,255,255,0.42);margin-left:6px;font-size:19px;}
</style>
</head>
<body>
<div class="cover">
  <div class="grid-bg"></div>
  <div class="glow-blue"></div>
  <div class="glow-gold"></div>
  <div class="vignette"></div>
  <div class="corner-tl"></div><div class="corner-tl-v"></div>
  <div class="corner-br"></div><div class="corner-br-v"></div>

  <!-- badge -->
  <div class="header">
    <div class="badge"><span class="badge-dot"></span>AI 转型实战 · 企业级教程合集</div>
  </div>

  <!-- 标题 -->
  <div class="title-wrap">
    <h1 class="title"><span class="title-grad">AI 提效转型实战</span></h1>
    <div class="subtitle">带研发团队从 0 到 <span class="sub-strong">人均产出翻倍</span></div>
  </div>

  <!-- 数据 -->
  <div class="data">
    <div class="data-card gold"><div class="data-num">+104%</div><div class="data-label">人均产出</div></div>
    <div class="data-card blue"><div class="data-num">76.6%</div><div class="data-label">AI 代码占比</div></div>
    <div class="data-card green"><div class="data-num">-16.4pp</div><div class="data-label">Bug 下降</div></div>
  </div>

  <!-- meta -->
  <div class="meta">
    <div class="meta-row"><span class="meta-icon">◆</span><span class="meta-text"><span class="meta-strong">12 集</span> 深度解析</span></div>
    <div class="meta-sep"></div>
    <div class="meta-row"><span class="meta-icon">◆</span><span class="meta-text"><span class="meta-strong">7 阶段</span> 方法论 + <span class="meta-strong">5 个</span> 可运行 demo</span></div>
    <div class="meta-row"><span class="meta-icon">◆</span><span class="meta-text">80+ 人团队 · 3 个月实战验证</span></div>
  </div>

  <!-- 技术栈关键词胶囊 -->
  <div class="tech-tags">
    <span class="tech-tag">Claude Code</span>
    <span class="tech-tag">OpenSpec</span>
    <span class="tech-tag">Skill</span>
    <span class="tech-tag">RAG</span>
    <span class="tech-tag">MCP</span>
  </div>

  <!-- 底部 -->
  <div class="footer">
    <div class="repo"><span class="repo-label">教程仓库</span><span class="repo-path">Johnson-Jia/ai-landing-tutorial</span></div>
    <div class="author">作者 <span class="author-name">Johnson</span><span class="author-role">技术总监 / 首席架构师</span></div>
  </div>
</div>
</body>
</html>
