<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1440px;background:#f8fafc;font-family:'PingFang SC','Microsoft YaHei','Inter',sans-serif;color:#0f172a;overflow:hidden;}
.cover{position:relative;width:1080px;height:1440px;padding:72px 72px 60px;display:flex;flex-direction:column;overflow:hidden;}
.glow-blue{position:absolute;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,0.13),transparent 70%);filter:blur(100px);top:-220px;right:-160px;pointer-events:none;}

.corner-tl{position:absolute;top:30px;left:30px;width:104px;height:3px;background:linear-gradient(90deg,rgba(37,99,235,0.55),transparent);}
.corner-tl-v{position:absolute;top:30px;left:30px;width:3px;height:80px;background:linear-gradient(180deg,rgba(37,99,235,0.55),transparent);}

.title{font-size:118px;font-weight:900;line-height:1.02;letter-spacing:-0.02em;}

.stat-row{position:relative;z-index:2;display:grid;grid-template-columns:1fr;gap:18px;margin-top:32px;}
.stat-card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:24px 30px;display:flex;align-items:center;gap:24px;box-shadow:0 6px 18px rgba(15,23,42,0.06);border-left:6px solid #2563eb;}
.stat-card.gold{border-left-color:#fbbf24;}

.stat-big{font-family:'JetBrains Mono','Consolas',monospace;font-size:72px;font-weight:900;line-height:1;min-width:240px;background:linear-gradient(135deg,#fbbf24,#2563eb);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
.stat-card.gold .stat-big{background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}

.ep-tag{position:relative;z-index:2;display:inline-flex;align-items:center;gap:10px;font-size:26px;color:#fbbf24;border:1.5px solid rgba(251,191,36,0.55);background:rgba(251,191,36,0.12);padding:11px 22px;border-radius:999px;font-weight:700;margin-top:26px;align-self:flex-start;}

.footer{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:20px;border-top:1px solid #e2e8f0;gap:12px;flex-wrap:wrap;}
.repo{font-size:24px;color:#0f172a;font-family:'JetBrains Mono',monospace;font-weight:600;display:flex;align-items:center;gap:10px;}

.author{font-size:22px;color:#64748b;}
.author .author-name{color:#2563eb;font-weight:800;}
