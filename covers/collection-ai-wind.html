<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden;
    font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0a0a14; }
  .wrap {
    width: 1080px; height: 1080px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; position: relative;
    background: linear-gradient(135deg, #0a0a14 0%, #1a0a2e 40%, #0a0a14 100%);
  }
  /* 网格底纹（紫调） */
  .grid-bg {
    position: absolute; width: 100%; height: 100%;
    background-image:
      linear-gradient(rgba(168,85,247,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(168,85,247,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  /* 电紫主光晕 + 青辅光晕 + 橙暖点缀 */
  .glow1 {
    position: absolute; width: 520px; height: 520px; border-radius: 50%;
    background: #A855F7; filter: blur(150px); opacity: 0.28;
    top: -130px; left: -110px;
  }
  .glow2 {
    position: absolute; width: 420px; height: 420px; border-radius: 50%;
    background: #00D4FF; filter: blur(130px); opacity: 0.18;
    bottom: -110px; right: -90px;
  }
  .glow3 {
    position: absolute; width: 260px; height: 260px; border-radius: 50%;
    background: #FF6B35; filter: blur(110px); opacity: 0.12;
    bottom: 120px; left: 50%; transform: translateX(-50%);
  }
  /* 风向线条（呼应"风向标"） */
  .wind-line {
    position: absolute; height: 2px; border-radius: 1px;
    background: linear-gradient(90deg, transparent, rgba(168,85,247,0.35), transparent);
  }
  .badge {
    position: relative; z-index: 1;
    display: inline-flex; align-items: center; gap: 10px;
    background: rgba(168,85,247,0.12); border: 2px solid rgba(168,85,247,0.4);
    color: #C084FC; font-size: 28px; font-weight: 700;
    padding: 12px 32px; border-radius: 30px;
    letter-spacing: 3px; margin-bottom: 36px;
  }
  .badge-bolt { font-size: 22px; }
  .title {
    position: relative; z-index: 1;
    font-size: 110px; font-weight: 900; color: #fff;
    text-align: center; line-height: 1.15; letter-spacing: 4px;
  }
  .title .accent { color: #A855F7; }   /* 电紫 */
  .title .cool { color: #00D4FF; }     /* 青辅 */
  .divider {
    position: relative; z-index: 1;
    width: 200px; height: 5px;
    background: linear-gradient(90deg, #A855F7, #00D4FF);
    border-radius: 3px; margin-top: 36px; margin-bottom: 36px;
  }
  .sub {
    position: relative; z-index: 1;
    font-size: 40px; font-weight: 700; color: #C084FC;
    text-align: center; letter-spacing: 3px;
  }
  .sub-desc {
    position: relative; z-index: 1;
    font-size: 26px; font-weight: 400; color: #8892b0;
    text-align: center; margin-top: 20px; letter-spacing: 2px;
    line-height: 1.5;
  }
  .feature-row {
    position: relative; z-index: 1;
    display: flex; gap: 20px; margin-top: 36px;
  }
  .feature-tag {
    background: rgba(168,85,247,0.1);
    border: 1px solid rgba(168,85,247,0.28);
    color: #C084FC; font-size: 22px; font-weight: 600;
    padding: 10px 26px; border-radius: 20px;
    letter-spacing: 1px;
  }
  .feature-tag.cool {
    background: rgba(0,212,255,0.1);
    border: 1px solid rgba(0,212,255,0.28);
    color: #7dd3fc;
  }
  .bottom-bar {
    position: absolute; bottom: 40px; left: 60px; right: 60px;
    display: flex; justify-content: space-between; align-items: center; z-index: 1;
  }
  .bottom-tag {
    font-size: 22px; font-weight: 700; color: #8892b0;
    font-family: 'JetBrains Mono', monospace;
  }
  .bottom-freq {
    font-size: 22px; font-weight: 700; color: #C084FC;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div data-composition-id="cover" data-width="1080" data-height="1080" data-start="0">
<div class="wrap">
  <div class="grid-bg"></div>
  <div class="glow1"></div>
  <div class="glow2"></div>
  <div class="glow3"></div>

  <!-- 风向线条 -->
  <div class="wind-line" style="top:16%;left:5%;width:340px;transform:rotate(-4deg);"></div>
  <div class="wind-line" style="top:34%;left:58%;width:300px;transform:rotate(3deg);"></div>
  <div class="wind-line" style="top:70%;left:12%;width:360px;transform:rotate(-2deg);"></div>
  <div class="wind-line" style="top:82%;left:52%;width:270px;transform:rotate(4deg);"></div>

  <div class="badge">
    <span class="badge-bolt">&#9889;</span>
    AI WIND
  </div>
  <div class="title"><span class="accent">AI</span><span class="cool">风向标</span></div>
  <div class="divider"></div>
  <div class="sub">每日 AI 开源风向</div>
  <div class="sub-desc">Agent · 大模型 · 语音视觉 · 每日追踪</div>
  <div class="feature-row">
    <div class="feature-tag">智能体</div>
    <div class="feature-tag cool">大模型</div>
    <div class="feature-tag">开源AI</div>
  </div>
  <div class="bottom-bar">
    <div class="bottom-freq">每日更新</div>
    <div class="bottom-tag">@GitHub星探</div>
  </div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
window.__timelines = {};
const tl = gsap.timeline({paused: true});
tl.to({}, {duration: 0.5});
window.__timelines["cover"] = tl;
</script>
</body>
</html>
