<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden;
    font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0A0805; }
  .wrap {
    width: 1080px; height: 1080px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; position: relative;
    background: linear-gradient(135deg, #0A0805 0%, #1a1208 40%, #0A0805 100%);
  }
  /* 沙粒网格背景（淘金意象） */
  .grid-bg {
    position: absolute; width: 100%; height: 100%;
    background-image:
      linear-gradient(rgba(255,184,0,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,184,0,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  /* 暖金光晕（残骸里的宝藏） */
  .glow1 {
    position: absolute; width: 520px; height: 520px; border-radius: 50%;
    background: #FFB800; filter: blur(150px); opacity: 0.22;
    top: -120px; left: -100px;
  }
  .glow2 {
    position: absolute; width: 420px; height: 420px; border-radius: 50%;
    background: #FF6B00; filter: blur(130px); opacity: 0.20;
    bottom: -100px; right: -80px;
  }
  .glow3 {
    position: absolute; width: 260px; height: 260px; border-radius: 50%;
    background: #D4A017; filter: blur(100px); opacity: 0.12;
    bottom: 100px; left: 50%; transform: translateX(-50%);
  }
  /* 大浪线条（波浪意象） */
  .wave-line {
    position: absolute; height: 2px; border-radius: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,184,0,0.3), transparent);
  }
  .badge {
    position: relative; z-index: 1;
    display: inline-flex; align-items: center; gap: 10px;
    background: rgba(255,184,0,0.1); border: 2px solid rgba(255,184,0,0.4);
    color: #FFB800; font-size: 28px; font-weight: 700;
    padding: 12px 32px; border-radius: 30px;
    letter-spacing: 2px; margin-bottom: 36px;
  }
  .badge-ico { font-size: 24px; }
  .title {
    position: relative; z-index: 1;
    font-size: 112px; font-weight: 900; color: #fff;
    text-align: center; line-height: 1.15; letter-spacing: 4px;
  }
  .title .gold { color: #FFB800; text-shadow: 0 0 30px rgba(255,184,0,0.4); }
  .title .amber { color: #FF6B00; text-shadow: 0 0 30px rgba(255,107,0,0.4); }
  .divider {
    position: relative; z-index: 1;
    width: 200px; height: 5px;
    background: linear-gradient(90deg, #FFB800, #FF6B00);
    border-radius: 3px; margin-top: 36px; margin-bottom: 36px;
  }
  .sub {
    position: relative; z-index: 1;
    font-size: 40px; font-weight: 700; color: #FF6B00;
    text-align: center; letter-spacing: 3px;
  }
  .sub-desc {
    position: relative; z-index: 1;
    font-size: 26px; font-weight: 400; color: #B8985F;
    text-align: center; margin-top: 18px; letter-spacing: 1px;
    line-height: 1.5;
  }
  .feature-row {
    position: relative; z-index: 1;
    display: flex; gap: 20px; margin-top: 36px;
  }
  .feature-tag {
    background: rgba(255,184,0,0.1);
    border: 1px solid rgba(255,184,0,0.3);
    color: #FFD966; font-size: 22px; font-weight: 600;
    padding: 10px 24px; border-radius: 20px;
    letter-spacing: 1px;
  }
  .feature-tag.amber {
    background: rgba(255,107,0,0.1);
    border: 1px solid rgba(255,107,0,0.3);
    color: #FFB088;
  }
  .bottom-bar {
    position: absolute; bottom: 40px; left: 60px; right: 60px;
    display: flex; justify-content: space-between; align-items: center; z-index: 1;
  }
  .bottom-tag {
    font-size: 22px; font-weight: 700; color: #8a7548;
    font-family: 'JetBrains Mono', monospace;
  }
  .bottom-freq {
    font-size: 22px; font-weight: 700; color: #FFB800;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div data-composition-id="cover" data-width="1080" data-height="1080" data-start="0">
<div class="wrap">
  <div class="grid-bg"></div>
  <div class="glow1"></div>
  <div class="glow2"></div>
  <div class="glow3"></div>

  <!-- 大浪线条 -->
  <div class="wave-line" style="top:18%;left:5%;width:320px;transform:rotate(-3deg);"></div>
  <div class="wave-line" style="top:35%;left:60%;width:280px;transform:rotate(2deg);"></div>
  <div class="wave-line" style="top:72%;left:15%;width:350px;transform:rotate(-1deg);"></div>
  <div class="wave-line" style="top:82%;left:55%;width:250px;transform:rotate(3deg);"></div>

  <div class="badge">
    <span class="badge-ico">&#128176;</span>
    创业淘金专栏
  </div>
  <div class="title"><span class="gold">大浪</span><span class="amber">淘沙</span></div>
  <div class="divider"></div>
  <div class="sub">创业失败 · 淘金复盘</div>
  <div class="sub-desc">从 1749 个创业坟场淘教训<br>别人的几亿学费 · 你的避坑指南</div>
  <div class="feature-row">
    <div class="feature-tag">1749 失败案例</div>
    <div class="feature-tag amber">535亿$ 烧成灰</div>
    <div class="feature-tag">每期一个教训</div>
  </div>
  <div class="bottom-bar">
    <div class="bottom-freq">每周 2-3 期</div>
    <div class="bottom-tag">@GitHub星探</div>
  </div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
window.__timelines = {};
const tl = gsap.timeline({paused: true});
tl.to({}, {duration: 0.5});
window.__timelines["cover"] = tl;
</script>
</body>
</html>
