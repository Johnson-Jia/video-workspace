<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;padding:20px}
.clip{position:relative;width:540px;height:960px;overflow:hidden}
.layer-bg{position:absolute;inset:0;z-index:1}
:root{--bg-dark:#080818;--bg-mid:#001a33;--accent-warm:#f9a825;--accent-cool:#00f5d4;--text:#fff}
@keyframes scanLine { 0%{top:-10%} 100%{top:110%} }
@keyframes scanLine2 { 0%{top:-10%} 100%{top:110%} }
@keyframes gridPulse { 0%,100%{opacity:0.4} 50%{opacity:0.7} }
@keyframes glassShimmer { 0%,100%{opacity:0.15} 50%{opacity:0.20} }
@keyframes gridNodeBlink { 0%,100%{opacity:0.3;transform:scale(0.9)} 50%{opacity:1;transform:scale(1.2)} }
@keyframes cornerPulse { 0%,100%{opacity:0.35} 50%{opacity:0.85} }
@keyframes dataFlow { 0%{transform:translateX(-100%);opacity:0} 50%{opacity:0.7} 100%{transform:translateX(100%);opacity:0} }
@keyframes tickFade { 0%,100%{opacity:0.2} 50%{opacity:0.6} }
</style></head><body>
<div class="clip"><div class="layer-bg">
<!-- 深青黑底 -->
<div style="position:absolute;inset:0;background:linear-gradient(180deg,#040810,#0a1520,#040810)"></div>
<!-- 网格 -->
<div style="position:absolute;inset:0;background-image:linear-gradient(rgba(0,229,255,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.05) 1px,transparent 1px);background-size:80px 80px;animation:gridPulse 6s ease-in-out infinite"></div>
<!-- 主扫描线 -->
<div style="position:absolute;left:0;width:100%;height:3px;background:linear-gradient(90deg,transparent,rgba(0,229,255,0.3),rgba(0,229,255,0.5),rgba(0,229,255,0.3),transparent);box-shadow:0 0 20px rgba(0,229,255,0.3);animation:scanLine 8s linear infinite"></div>
<!-- 副扫描线（错相位，不同速度） -->
<div style="position:absolute;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,rgba(0,200,255,0.2),rgba(0,200,255,0.35),transparent);animation:scanLine2 11s linear infinite 3s"></div>
<!-- 辉光球 -->
<div style="position:absolute;top:40%;left:50%;width:400px;height:400px;border-radius:50%;background:rgba(0,150,200,0.1);filter:blur(100px);transform:translate(-50%,-50%)"></div>
<!-- 网格节点 1-4（dots 类型，交叉点闪烁） -->
<div style="position:absolute;top:30%;left:40%;width:12px;height:12px;border-radius:50%;
  background:rgba(0,229,255,0.9);box-shadow:0 0 14px rgba(0,229,255,0.7);
  animation:gridNodeBlink 3s ease-in-out infinite"></div>
<div style="position:absolute;top:55%;left:65%;width:10px;height:10px;border-radius:50%;
  background:rgba(0,220,255,0.85);box-shadow:0 0 12px rgba(0,220,255,0.6);
  animation:gridNodeBlink 4s ease-in-out infinite 1s"></div>
<div style="position:absolute;top:70%;left:30%;width:11px;height:11px;border-radius:50%;
  background:rgba(0,235,255,0.8);box-shadow:0 0 13px rgba(0,235,255,0.65);
  animation:gridNodeBlink 3.5s ease-in-out infinite 2s"></div>
<div style="position:absolute;top:42%;left:75%;width:9px;height:9px;border-radius:50%;
  background:rgba(0,225,255,0.85);box-shadow:0 0 11px rgba(0,225,255,0.6);
  animation:gridNodeBlink 4.5s ease-in-out infinite 0.5s"></div>
<!-- 横向数据流条（scan 类型） -->
<div style="position:absolute;top:50%;left:0;width:100%;height:2px;
  background:linear-gradient(90deg,transparent,rgba(0,229,255,0.4),rgba(0,255,200,0.6),rgba(0,229,255,0.4),transparent);
  filter:blur(1px);animation:dataFlow 7s ease-in-out infinite"></div>
<!-- 四角数据角标（clip-path L 形，HUD 监控感） -->
<div style="position:absolute;top:120px;left:90px;width:42px;height:42px;
  border-top:2px solid rgba(0,229,255,0.45);border-left:2px solid rgba(0,229,255,0.45);
  animation:cornerPulse 5s ease-in-out infinite"></div>
<div style="position:absolute;top:120px;right:90px;width:42px;height:42px;
  border-top:2px solid rgba(0,229,255,0.45);border-right:2px solid rgba(0,229,255,0.45);
  animation:cornerPulse 5s ease-in-out infinite 1.5s"></div>
<div style="position:absolute;bottom:160px;left:90px;width:42px;height:42px;
  border-bottom:2px solid rgba(0,229,255,0.45);border-left:2px solid rgba(0,229,255,0.45);
  animation:cornerPulse 5s ease-in-out infinite 3s"></div>
<div style="position:absolute;bottom:160px;right:90px;width:42px;height:42px;
  border-bottom:2px solid rgba(0,229,255,0.45);border-right:2px solid rgba(0,229,255,0.45);
  animation:cornerPulse 5s ease-in-out infinite 4s"></div>
<!-- 边缘测量刻度（左竖排，HUD 仪表盘感） -->
<div style="position:absolute;top:200px;left:60px;display:flex;flex-direction:column;gap:30px;opacity:0.5;
  font-family:'JetBrains Mono',monospace;color:rgba(0,229,255,0.4);font-size:14px;
  animation:tickFade 6s ease-in-out infinite">
  <span>| 00</span><span>| 25</span><span>| 50</span><span>| 75</span><span>| 99</span>
</div>
<!-- 玻璃折射叠层 -->
<div style="position:absolute;inset:0;
  background:linear-gradient(120deg,rgba(255,255,255,0.015) 0%,transparent 30%,transparent 70%,rgba(255,255,255,0.02) 100%);
  animation:glassShimmer 8s ease-in-out infinite"></div>
<!-- 棱镜色散微光 -->
<div style="position:absolute;top:60%;right:-8%;width:50%;height:200px;opacity:0.15;
  background:linear-gradient(90deg,rgba(0,255,200,0.5),rgba(200,0,255,0.4),rgba(0,200,255,0.5));
  filter:blur(70px);border-radius:50%"></div>
</div></div>
</body></html>
