<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;padding:20px}
.clip{position:relative;width:540px;height:960px;overflow:hidden}
.layer-bg{position:absolute;inset:0;z-index:1}
:root{--bg-dark:#080818;--bg-mid:#001a33;--accent-warm:#f9a825;--accent-cool:#00f5d4;--text:#fff}
@keyframes vignettePulse {
  0%, 100% { opacity: 0.10; }
  50% { opacity: 0.16; }
}
@keyframes warmBreath {
  0%, 100% { transform: scale(1); opacity: 0.10; }
  50% { transform: scale(1.06); opacity: 0.18; }
}
@keyframes warmRing {
  0% { transform: scale(0.9); opacity: 0.15; }
  100% { transform: scale(1.5); opacity: 0; }
}
@keyframes lightStreak {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(300%); }
}
@keyframes floatParticle {
  0%, 100% { transform: translateY(0) translateX(0); opacity: 0.4; }
  50% { transform: translateY(-50px) translateX(8px); opacity: 0.7; }
}
@keyframes glassShimmer {
  0%, 100% { opacity: 0.15; }
  50% { opacity: 0.20; }
}
</style></head><body>
<div class="clip"><div class="layer-bg">
<!-- 深色底 -->
<div style="position:absolute;inset:0;
  background:linear-gradient(170deg, #0c0c14 0%, #141420 50%, #0a0a12 100%)"></div>
<!-- 中心暖辉光 -->
<div style="position:absolute;top:30%;left:25%;width:600px;height:500px;border-radius:50%;
  background:radial-gradient(ellipse,hsla(38,70%,55%,0.15),hsla(25,50%,40%,0.05),transparent 70%);
  filter:blur(100px);animation:warmBreath 10s ease-in-out infinite 0s"></div>
<!-- 暖色扩散环 1 -->
<div style="position:absolute;top:calc(42% - 80px);left:calc(42% - 80px);width:160px;height:160px;border-radius:50%;
  border:1.5px solid hsla(38,70%,55%,0.10);animation:warmRing 6s ease-out infinite 0s"></div>
<!-- 暖色扩散环 2 -->
<div style="position:absolute;top:calc(42% - 80px);left:calc(42% - 80px);width:160px;height:160px;border-radius:50%;
  border:1px solid hsla(42,60%,50%,0.07);animation:warmRing 6s ease-out infinite 3s"></div>
<!-- 暖色光晕扫描带 -->
<div style="position:absolute;top:38%;left:-20%;width:40%;height:4px;border-radius:2px;
  background:linear-gradient(90deg,transparent,hsla(40,60%,55%,0.15),hsla(42,70%,60%,0.20),hsla(40,60%,55%,0.15),transparent);
  filter:blur(3px);animation:lightStreak 18s ease-in-out infinite 0s"></div>
<!-- 暖光漂浮粒子 1 -->
<div style="position:absolute;top:35%;left:55%;width:3px;height:3px;border-radius:50%;
  background:hsla(40,80%,65%,0.5);box-shadow:0 0 8px hsla(40,70%,55%,0.4);animation:floatParticle 8s ease-in-out infinite 0s"></div>
<!-- 暖光漂浮粒子 2 -->
<div style="position:absolute;top:50%;left:40%;width:3px;height:3px;border-radius:50%;
  background:hsla(45,75%,60%,0.4);box-shadow:0 0 6px hsla(45,65%,50%,0.3);animation:floatParticle 10s ease-in-out infinite 3s"></div>
<!-- 暖光漂浮粒子 3 -->
<div style="position:absolute;top:55%;left:65%;width:2px;height:2px;border-radius:50%;
  background:hsla(38,70%,58%,0.35);box-shadow:0 0 5px hsla(38,60%,48%,0.25);animation:floatParticle 7s ease-in-out infinite 5s"></div>
<!-- 电影黑边 letterbox（签名：上下黑边，宽银幕电影感，区别于 gradient_mesh 色带/light_field 光球） -->
<div style="position:absolute;top:0;left:0;width:100%;height:90px;background:linear-gradient(180deg,#000 55%,transparent)"></div>
<div style="position:absolute;bottom:0;left:0;width:100%;height:90px;background:linear-gradient(0deg,#000 55%,transparent)"></div>
<!-- 径向暗角 -->
<div style="position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 45%,transparent 30%,rgba(0,0,0,0.55) 80%,rgba(0,0,0,0.75) 100%)"></div>
<!-- 中心微光呼吸 -->
<div style="position:absolute;top:35%;left:30%;width:480px;height:360px;border-radius:50%;
  background:radial-gradient(ellipse,hsla(45,80%,65%,0.08),transparent 60%);
  filter:blur(60px);animation:vignettePulse 8s ease-in-out infinite 3s"></div>
<!-- 玻璃折射层 -->
<div style="position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,220,150,0.015) 0%,transparent 40%,rgba(255,200,120,0.02) 60%,transparent 100%);
  animation:glassShimmer 10s ease-in-out infinite"></div>
</div></div>
</body></html>
